name: Deploy to Staging

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Override with the STAGING_APP_DIR repository variable if staging
            # lives elsewhere; the production workflow had the same hardcoded
            # path problem and it silently skipped every deploy.
            cd "${STAGING_APP_DIR:-/home/ec2-user/ten-portal-staging}"
            git fetch origin
            git reset --hard origin/develop
            npm ci --legacy-peer-deps
            pm2 restart ecosystem.config.js --only ten-portal-staging
