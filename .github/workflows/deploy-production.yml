name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            # The deployment directory. It was hardcoded to
            # /home/ec2-user/ten-portal-production, which is not where the app
            # runs — production serves from InternshipManagementSystem-Final —
            # so `cd` failed and every merge since has left the running code
            # untouched while the workflow reported nothing useful. Set the
            # PROD_APP_DIR repository variable to override without a code change.
            APP_DIR="${PROD_APP_DIR:-/home/ec2-user/InternshipManagementSystem-Final}"

            if [ ! -f "$APP_DIR/server.js" ]; then
              echo "::error::No server.js in $APP_DIR — refusing to deploy."
              echo "Set the PROD_APP_DIR repository variable to the directory PM2 runs."
              exit 1
            fi

            cd "$APP_DIR"
            git fetch origin

            # uploads/ holds real student documents — resumes, marksheets, and
            # generated certificates. Thirteen of them were committed before
            # .gitignore covered the directory, and they are now untracked.
            #
            # `git reset --hard` deletes tracked files that a newer commit
            # removes, so the FIRST deploy after that change would wipe those
            # thirteen off this server — the only copy. Copy the directory
            # aside first, then put back anything the reset took.
            #
            # -a keeps timestamps; -n never overwrites a file that is already
            # there, so a newer upload always wins over the backup.
            if [ -d uploads ]; then
              mkdir -p ../ten-uploads-backup
              cp -a uploads/. ../ten-uploads-backup/ 2>/dev/null || true
            fi

            git reset --hard origin/main

            if [ -d ../ten-uploads-backup ]; then
              mkdir -p uploads
              cp -rn ../ten-uploads-backup/. uploads/ 2>/dev/null || true
            fi

            npm ci --legacy-peer-deps --omit=dev

            # `pm2 restart` re-reads ecosystem.config.js but keeps the process's
            # existing environment, so a changed .env would not be picked up.
            pm2 restart ecosystem.config.js --only ten-portal-production --update-env
            pm2 save

            # Fail loudly if the app did not come back. Without this the job is
            # green whether or not anything is serving.
            sleep 10
            pm2 describe ten-portal-production | grep -q "status.*online" \
              || { echo "::error::ten-portal-production is not online after restart."; pm2 logs ten-portal-production --lines 40 --nostream; exit 1; }

            # Online is not the same as working. The app stays up with no
            # database behind it, so say so here — a green deploy with a dead
            # database is how the first outage went unnoticed for a week.
            # A warning, not a failure: the deploy itself succeeded, and the
            # database is fixed on the box, not by re-running this job.
            APP_PORT="$(grep -E '^PORT=' .env 2>/dev/null | tail -1 | cut -d= -f2 | tr -d '[:space:]')"
            DB_HEALTH="$(curl -s -m 5 "http://127.0.0.1:${APP_PORT:-5000}/api/health/db" || true)"
            echo "$DB_HEALTH" | grep -q '"connected":true' \
              || echo "::warning::The app is online but reports the database NOT connected. On the server run: sudo bash scripts/server/harden-mongod.sh --check   ($DB_HEALTH)"
            echo "Deployed $(git rev-parse --short HEAD) to $APP_DIR"
