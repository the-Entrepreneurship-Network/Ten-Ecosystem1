<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEN — Academics</title>
<style>
/* Tokens are v2-tasks.html's, so Academics and My Task Journey are the same
   product to a student rather than two that happen to share a logo. */
:root{
  --bg-base:#05070e; --bg-surface:#090d1a; --bg-card:#0e1428; --bg-card-hover:#121933;
  --bg-input:#0b1222; --border:rgba(212,175,55,0.08); --border-strong:rgba(212,175,55,0.18);
  --accent-green:#10b981; --accent-amber:#f59e0b; --accent-red:#ef4444; --accent-gold:#D4AF37;
  --accent-blue:#3b82f6;
  --text-primary:#F0EEE8; --text-secondary:#9a9080; --text-muted:#4E4840;
  --radius-sm:10px; --radius-md:16px; --radius-lg:22px; --shadow-card:0 4px 24px rgba(0,0,0,0.35);
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-base);color:var(--text-primary);
     font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
a{color:inherit}

.nav{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);
     background:rgba(9,13,26,.9);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.nav .logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
     background:linear-gradient(135deg,var(--accent-gold),#b8962c);color:#05070e;font-weight:800}
.nav b{font-size:15px;color:var(--accent-gold);letter-spacing:.02em}
.nav .sp{flex:1}
.nav a.back{font-size:13px;color:var(--text-secondary);text-decoration:none;
     border:1px solid var(--border-strong);border-radius:999px;padding:7px 14px}
.nav a.back:hover{color:var(--text-primary)}

.page{max-width:1080px;margin:0 auto;padding:30px 22px 80px}
.page-header h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.page-header h1 span{color:var(--accent-gold)}
.page-header p{color:var(--text-secondary);font-size:14px;margin-top:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:26px}
.card{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
      padding:22px;cursor:pointer;box-shadow:var(--shadow-card);
      transition:transform .18s var(--ease-out),border-color .18s,background .18s}
.card:hover{transform:translateY(-3px);background:var(--bg-card-hover);border-color:rgba(212,175,55,.4)}
.card:active{transform:translateY(-1px)}
.card .ico{font-size:22px;margin-bottom:12px;display:block}
.card h3{font-size:16px;font-weight:700}
.card p{font-size:12.5px;color:var(--text-secondary);margin-top:5px;line-height:1.5}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;padding:2px 8px;
     border-radius:5px;margin-left:6px;vertical-align:middle}
.tag.prem{background:rgba(212,175,55,.2);color:var(--accent-gold)}
.tag.soon{background:rgba(255,255,255,.07);color:var(--text-muted)}

/* ── domains + modules, lifted from v2-tasks.html ─────────────────────── */
.section-head{display:flex;align-items:center;gap:12px;margin:34px 0 14px}
.section-head h2{font-size:19px;font-weight:700}
.section-head .sp{flex:1}
.linky{background:none;border:0;color:var(--text-secondary);font:inherit;font-size:13px;cursor:pointer;
       text-decoration:underline;text-underline-offset:3px}
.linky:hover{color:var(--text-primary)}

.week-header{display:flex;align-items:center;gap:14px;background:var(--bg-surface);
     border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:10px}
.week-badge{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;
     background:rgba(212,175,55,.12);color:var(--accent-gold);font-weight:800;font-size:12px}
.week-title{flex:1}
.week-title b{font-size:15px;display:block}
.week-title small{font-size:12px;color:var(--text-secondary)}
.week-locked-msg{font-size:12px;color:var(--text-muted);border:1px solid var(--border);
     border-radius:999px;padding:6px 12px;white-space:nowrap}

.task-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);
     padding:18px 20px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start}
.task-card.locked{opacity:.55}
.task-card .state{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;
     font-size:13px;background:rgba(255,255,255,.05);color:var(--text-muted)}
.task-card.done .state{background:var(--accent-green);color:#04170f}
.task-card .body{flex:1;min-width:0}
.task-card h4{font-size:15px;font-weight:700}
.task-card p{font-size:13px;color:var(--text-secondary);margin-top:4px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;letter-spacing:.02em}
.chip.easy{background:rgba(16,185,129,.14);color:var(--accent-green)}
.chip.hard{background:rgba(239,68,68,.14);color:#fca5a5}
.chip.expert{background:rgba(139,92,246,.16);color:#c4b5fd}
.chip.coins{background:rgba(212,175,55,.14);color:var(--accent-gold)}
.chip.passed{background:rgba(16,185,129,.16);color:var(--accent-green)}
.chip.locked{background:rgba(255,255,255,.05);color:var(--text-muted)}
.chip.score{background:rgba(59,130,246,.14);color:#93c5fd}

.btn{border:0;border-radius:var(--radius-sm);font:inherit;font-size:13px;font-weight:700;cursor:pointer;
     padding:10px 16px;transition:opacity .2s,transform .16s var(--ease-out)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:linear-gradient(135deg,var(--accent-gold),#b8962c);color:#05070e}
.btn.ghost{background:transparent;border:1px solid var(--border-strong);color:var(--text-secondary)}
.btn.green{background:var(--accent-green);color:#04170f}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* ── modal ────────────────────────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:80;background:rgba(3,5,10,.82);display:none;
       place-items:center;padding:22px;overflow-y:auto;backdrop-filter:blur(3px)}
.modal.on{display:grid}
.sheet{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
       padding:30px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);
       animation:rise .32s var(--ease-out)}
/* Never from scale(0) — nothing appears out of nothing. */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.sheet h2{font-size:21px;font-weight:800;margin-bottom:6px}
.sheet .lede{font-size:13.5px;color:var(--text-secondary);line-height:1.6;margin-bottom:18px}
.perks{list-style:none;display:flex;flex-direction:column;gap:11px;margin-bottom:22px}
.perks li{display:flex;gap:11px;font-size:13.5px;line-height:1.5}
.perks .tick{color:var(--accent-green);flex:none;font-weight:800}
.price{font-size:30px;font-weight:800;color:var(--accent-gold);margin-bottom:2px}
.price small{display:block;font-size:12px;color:var(--text-secondary);font-weight:500;margin-top:3px}
.sheet .stack{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.sheet textarea{width:100%;background:var(--bg-input);border:1px solid var(--border-strong);
     border-radius:var(--radius-sm);color:var(--text-primary);font:inherit;font-size:14px;
     padding:13px 15px;min-height:190px;resize:vertical;outline:none;line-height:1.6}
.sheet textarea:focus{border-color:var(--accent-gold)}
.meta{font-size:12px;color:var(--text-muted);margin-top:8px}
.result{border-radius:var(--radius-sm);padding:14px 16px;margin-top:14px;font-size:13px;line-height:1.6}
.result.pass{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#6EE7B7}
.result.fail{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.3);color:#F5C87A}
.result ul{margin:8px 0 0 18px}
.empty{color:var(--text-secondary);font-size:13.5px;padding:26px;text-align:center;
       border:1px dashed var(--border-strong);border-radius:var(--radius-md)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card{transition:none}}

/* ── cinematic entry ──────────────────────────────────────
   Scrollytelling: one full-height beat per scroll, one logo and one benefit
   each. The artwork is fixed and cross-fades between beats, so the logo is
   what stays still while the words move past it. */
/* The starfield and the Earth are the real pixels from the Space Intern
   artwork, not a gradient imitating them - it is the look that was asked for,
   and cutting the two clean regions out of that render is exact where a
   hand-built approximation was only close. */
#cine{position:fixed;inset:0;z-index:60;overflow:hidden;background:#02040a;--zoom:0}
/* The starfield is its own layer rather than a background on #cine, so it can
   drift on its own while the zoom scales it. Two layers at different speeds:
   parallax is what stops a starfield reading as wallpaper. */
#cineSky,#cineSky2{position:absolute;inset:-8%;pointer-events:none;
  background:url('/img/domains/space-stars.webp') center/cover no-repeat;
  will-change:transform}
#cineSky{opacity:1;animation:sky 150s linear infinite}
#cineSky2{opacity:.4;transform:scaleX(-1);animation:sky2 220s linear infinite;
  mix-blend-mode:screen}
@keyframes sky{0%{transform:translate3d(0,0,0) scale(1.06)}
               50%{transform:translate3d(-2.5%,1.6%,0) scale(1.12)}
               100%{transform:translate3d(0,0,0) scale(1.06)}}
@keyframes sky2{0%{transform:scaleX(-1) translate3d(0,0,0) scale(1.1)}
                50%{transform:scaleX(-1) translate3d(2%,-2.2%,0) scale(1.16)}
                100%{transform:scaleX(-1) translate3d(0,0,0) scale(1.1)}}
#cine.moonbeat #cineSky{transform:scale(calc(1.06 + var(--zoom) * .5));animation:none}
#cine.moonbeat #cineSky2{opacity:calc(.4 - var(--zoom) * .4)}
#cine.gone{display:none}
#cineCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cine .depth{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 55% at 68% 46%,rgba(59,130,246,.16) 0%,transparent 62%),
             radial-gradient(ellipse 55% 45% at 30% 60%,rgba(212,175,55,.07) 0%,transparent 64%)}

/* The scene the logos stand in: Earth low in frame, lunar ground beneath,
   dust above. Taken from the Space Intern artwork so the whole preview looks
   like one place rather than eight separate renders. */
#cineEarth{position:absolute;left:-6vw;bottom:-8vh;width:min(62vw,760px);aspect-ratio:780/700;
  pointer-events:none;opacity:0;
  background:url('/img/domains/space-earth.webp') left bottom/contain no-repeat;
  /* The crop is a rectangle; without this its top and right edges read as a
     pasted box instead of a planet sitting in space. */
  -webkit-mask-image:radial-gradient(ellipse 104% 104% at 10% 92%,#000 52%,transparent 84%);
  mask-image:radial-gradient(ellipse 104% 104% at 10% 92%,#000 52%,transparent 84%);
  transform:translate3d(-8%,14%,0) scale(.82);
  transition:opacity 1s var(--ease-out),transform 1.2s var(--ease-out)}
/* Earth belongs to the Space Intern beat only. Everywhere else the frame is
   deep space, so it rises into view with the descent rather than sitting
   under every headline. */
#cine.moonbeat #cineEarth{opacity:.95;animation:earthDrift 34s ease-in-out infinite}
@keyframes earthDrift{0%,100%{transform:translate3d(0,0,0) scale(1)}
                      50%{transform:translate3d(10px,-12px,0) scale(1.02)}}

#cineScrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(2,4,10,.9) 0%,rgba(2,4,10,.62) 34%,
                                   rgba(2,4,10,.15) 56%,transparent 70%)}
@media(max-width:900px){#cineScrim{background:linear-gradient(0deg,rgba(2,4,10,.92) 26%,transparent 72%)}}

/* The lunar surface belongs to one beat only. Everything else is open space,
   so this is hidden by default and the camera brings it up. */
#cineMoon{position:absolute;left:-14vw;right:-14vw;bottom:-10vh;height:46vh;pointer-events:none;
  border-radius:50% 50% 0 0 / 30vh 30vh 0 0;opacity:0;
  background:linear-gradient(180deg,#3A3F49 0%,#22262E 30%,#12151B 68%,#080A0E 100%);
  box-shadow:inset 0 4px 0 rgba(226,232,240,.22),0 -40px 90px rgba(0,0,0,.7);
  /* Far away and low at the start of the beat; the camera rises onto it. */
  transform:translateY(46vh) scale(.55);
  transition:opacity .6s var(--ease-out)}
#cineMoon::before{content:'';position:absolute;inset:0;border-radius:inherit;opacity:.62;
  background:
    radial-gradient(ellipse 6% 20% at 14% 40%,rgba(0,0,0,.66) 0%,transparent 70%),
    radial-gradient(ellipse 4% 14% at 27% 58%,rgba(0,0,0,.54) 0%,transparent 70%),
    radial-gradient(ellipse 8% 24% at 44% 34%,rgba(0,0,0,.6) 0%,transparent 70%),
    radial-gradient(ellipse 3% 12% at 58% 62%,rgba(0,0,0,.5) 0%,transparent 70%),
    radial-gradient(ellipse 7% 21% at 71% 42%,rgba(0,0,0,.56) 0%,transparent 70%),
    radial-gradient(ellipse 4% 13% at 86% 60%,rgba(0,0,0,.5) 0%,transparent 70%),
    radial-gradient(ellipse 5% 16% at 34% 76%,rgba(0,0,0,.44) 0%,transparent 70%)}
/* Grazing light along the limb, which is what sells it as a sphere. */
#cineMoon::after{content:'';position:absolute;left:0;right:0;top:0;height:36%;
  border-radius:inherit;
  background:linear-gradient(180deg,rgba(226,232,240,.16) 0%,transparent 100%)}

/* The camera move. --zoom runs 0 to 1 across the Space Intern beat: the
   surface climbs into frame and fills it, the starfield pushes in behind, and
   the badge comes from far away to standing on the ground. A drone descent,
   driven by the scrollbar rather than a timeline. */
#cine.moonbeat #cineMoon{opacity:1;
  transform:translateY(calc((1 - var(--zoom)) * 46vh)) scale(calc(.55 + var(--zoom) * .75))}
#cine.moonbeat #cineArt .art.on{
  transform:scale(calc(.30 + var(--zoom) * .72)) translateY(calc((1 - var(--zoom)) * -12vh))}
#cine.moonbeat #cineEarth{
  transform:translate3d(0,0,0) scale(calc(.82 + var(--zoom) * .4));
  opacity:calc(.30 + var(--zoom) * .65)}

#cineArt{position:absolute;right:6vw;top:46%;transform:translateY(-50%);
  width:min(38vw,430px);aspect-ratio:1;pointer-events:none;perspective:900px;
  --px:0;--py:0;--mx:50;--my:50;--near:0}
#cineArt .art{position:absolute;inset:0;display:grid;place-items:center;opacity:0;
  transform:scale(.9) rotateY(-14deg);
  transition:opacity .7s var(--ease-out),transform .9s var(--ease-out)}
#cineArt .art.on{opacity:1;transform:scale(1) rotateY(0)}
/* Every logo drifts, whether it is a real render or the stand-in. The pointer
   offsets ride on the same element, so tilt and float compose instead of
   fighting over the transform. */
/* Cursor-reactive, not a pasted image: the plate leans toward the pointer,
   drifts toward it, and carries a specular sweep that tracks where the
   pointer actually is. Everything rides on CSS variables so the idle drift
   keyframes keep running underneath instead of being overwritten. */
/* Shrink-wraps the artwork instead of filling the square stage. The renders
   are different shapes; a fixed square frame letterboxes the wide ones and
   the overlays below then sit on empty black rather than on the image. */
#cineArt .orb{width:auto;height:auto;max-width:100%;max-height:100%;
  display:inline-grid;place-items:center;position:relative;
  transform:translate3d(calc(var(--px) * 22px),calc(var(--py) * 18px),0)
            rotateY(calc(var(--px) * 16deg)) rotateX(calc(var(--py) * -13deg))
            scale(calc(1 + var(--near) * 0.05));
  transition:transform .34s var(--ease-out);will-change:transform;
  transform-style:preserve-3d}
/* The moving highlight. Sits over the artwork and is masked to its shape by
   being the same box, so it reads as light on the object. */
#cineArt .sheen{position:absolute;inset:0;border-radius:20px;pointer-events:none;
  opacity:calc(.20 + var(--near) * .5);mix-blend-mode:screen;
  background:radial-gradient(circle 42% at calc(var(--mx) * 1%) calc(var(--my) * 1%),
    rgba(255,255,255,.55) 0%,rgba(180,215,255,.20) 26%,transparent 58%);
  transition:opacity .3s ease}
/* A cold rim that swings to the far side of the light, the way a bevel does. */
/* The generator's sparkle sits in the bottom-right of every render. delogo
   removes it but drags streaks across any texture, which is worse than the
   mark. A soft corner fall-off hides it without touching a pixel of the
   artwork - and the corner is empty background on all of them anyway. */
#cineArt .orb .corner{position:absolute;right:0;bottom:0;width:30%;height:28%;
  pointer-events:none;border-radius:0 0 20px 0;
  /* Centred on the mark itself (about 88% across, 88% down the plate), not on
     the corner of this box - off-centre it only shades around the sparkle. */
  background:radial-gradient(ellipse 62% 66% at 62% 57%,
    rgba(4,7,15,1) 0%,rgba(4,7,15,.96) 40%,rgba(4,7,15,.7) 66%,transparent 88%)}

#cineArt .rim{position:absolute;inset:0;border-radius:20px;pointer-events:none;
  box-shadow:inset calc(var(--px) * -12px) calc(var(--py) * -10px) 34px rgba(120,170,235,.24),
             inset calc(var(--px) * 8px) calc(var(--py) * 7px) 22px rgba(0,0,0,.5);
  transition:box-shadow .34s var(--ease-out)}
#cineArt .orb > *{animation:drift 7s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(-10px) rotate(-1.2deg)}
                 50%{transform:translateY(10px) rotate(1.2deg)}}
#cineArt img{max-width:100%;max-height:100%;object-fit:contain;border-radius:20px;
  filter:drop-shadow(0 26px 60px rgba(0,0,0,.7))}
/* The renders carry their own backgrounds, so a frame makes them read as
   plates on the scene rather than photos pasted over it. */
#cineArt img.plate{border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 70px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.2)}
/* Stand-in, shown only while the real artwork is missing, so the sequence
   still reads and the swap is a file drop rather than a code change. */
#cineArt .fallback{width:62%;aspect-ratio:1;border-radius:28%;display:grid;place-items:center;
  font-weight:800;font-size:clamp(20px,3.6vw,38px);color:#F6F2E6;letter-spacing:.02em;
  background:linear-gradient(150deg,var(--c1),var(--c2));
  box-shadow:0 26px 60px rgba(0,0,0,.66),inset 0 2px 0 rgba(255,255,255,.3),
             inset 0 -22px 40px rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.14);
}
#cineArt .cap{position:absolute;left:0;right:0;bottom:-7%;text-align:center;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(240,238,232,.45)}
#cineArt .all14{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:100%}
#cineArt .all14 span{aspect-ratio:1;border-radius:24%;display:grid;place-items:center;
  font-size:10px;font-weight:800;color:#F6F2E6;
  background:linear-gradient(150deg,var(--c1),var(--c2));
  box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.26)}

#cineTrack{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:1;
  -webkit-overflow-scrolling:touch}
.beat{min-height:100vh;display:grid;align-content:center;padding:0 6vw;
  max-width:min(52vw,660px)}
.beat .idx{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-gold);
  font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.beat .idx::after{content:'';height:1px;flex:1;max-width:80px;background:rgba(212,175,55,.35)}
.beat h2{font-size:clamp(28px,4.4vw,54px);font-weight:800;letter-spacing:-.03em;line-height:1.03}
.beat h2 em{font-style:normal;display:block;
  background:linear-gradient(100deg,#F4E9C0,var(--accent-gold),#b8962c);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.beat p{margin-top:16px;color:var(--text-secondary);font-size:14.5px;line-height:1.7;max-width:46ch}
.beat .in{opacity:0;transform:translateY(22px);
  transition:opacity .6s var(--ease-out),transform .7s var(--ease-out)}
.beat.live .in{opacity:1;transform:none}
.beat.pay{max-width:min(58vw,520px)}
@media(max-width:900px){
  #cineArt{right:auto;left:50%;transform:translate(-50%,-50%);top:32%;width:min(62vw,290px);opacity:.4}
  .beat,.beat.pay{max-width:100%;padding:0 26px;align-content:end;padding-bottom:14vh}
}

.paycard{background:rgba(14,20,40,.88);border:1px solid var(--border-strong);
  border-radius:var(--radius-lg);padding:26px;backdrop-filter:blur(14px);
  box-shadow:0 24px 70px rgba(0,0,0,.6);margin-top:22px}
.paycard h3{font-size:22px;font-weight:800}
.paycard .why{font-size:13px;color:var(--text-secondary);margin:8px 0 16px;line-height:1.6}
/* QR slot. Empty until a real code is supplied - a payment QR is not something
   to invent, and a wrong one takes real money to the wrong place. */
.qrslot{background:#fff;border-radius:14px;width:186px;height:186px;margin:0 auto 16px;
  display:grid;place-items:center;box-shadow:0 4px 22px rgba(0,0,0,.4)}
.qrslot.empty{background:rgba(255,255,255,.04);border:1px dashed var(--border-strong);
  color:var(--text-muted);font-size:12px;text-align:center;padding:18px;line-height:1.5}
.qrslot img{width:100%;height:100%;border-radius:14px;display:block}

#cineHud{position:absolute;left:6vw;bottom:24px;z-index:2;display:flex;gap:16px;align-items:center;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);
  pointer-events:none}
#cineDots{position:absolute;right:22px;top:50%;transform:translateY(-50%);z-index:2;
  display:flex;flex-direction:column;gap:9px;pointer-events:none}
#cineDots i{width:6px;height:6px;border-radius:50%;background:rgba(240,238,232,.22);
  transition:background .3s,transform .3s}
#cineDots i.on{background:var(--accent-gold);transform:scale(1.5)}
#cineHint{position:absolute;left:0;right:0;bottom:24px;text-align:center;color:var(--text-muted);
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;pointer-events:none;
  animation:bob 2.4s ease-in-out infinite;transition:opacity .4s}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(6px);opacity:1}}
#cineSkip{position:absolute;right:20px;top:18px;z-index:3;background:rgba(255,255,255,.04);
  border:1px solid var(--border);color:var(--text-muted);border-radius:999px;padding:7px 14px;
  font:inherit;font-size:12px;cursor:pointer}
#cineSkip:hover{color:var(--text-primary)}

@media (prefers-reduced-motion:reduce){
  #cineSky,#cineSky2,#cineEarth{animation:none}
  #cineArt .art,.beat .in,#cineArt .orb,#cineArt .rim{transition:none}
  #cineArt .orb > *{animation:none}
  #cineArt .sheen{display:none}
  #cineHint{animation:none}
}
</style>
</head>
<body>

<div id="cine" aria-label="Academics preview">
  <div id="cineSky" aria-hidden="true"></div>
  <div id="cineSky2" aria-hidden="true"></div>
  <canvas id="cineCanvas" aria-hidden="true"></canvas>
  <div class="depth" aria-hidden="true"></div>
  <div id="cineEarth" aria-hidden="true"></div>
  <div id="cineMoon" aria-hidden="true"></div>
  <div id="cineScrim" aria-hidden="true"></div>
  <div id="cineArt" aria-hidden="true"></div>
  <div id="cineDots" aria-hidden="true"></div>
  <div id="cineHud"><span>TEN &middot; Academics</span><span id="cineCount">01 / 09</span></div>
  <div id="cineHint">Scroll</div>

</div>

<nav class="nav">
  <span class="logo">∞</span><b>TEN</b>
  <span class="sp"></span>
  <a class="back" href="/student-dashboard.html">← Dashboard</a>
</nav>

<div class="page">
  <div class="page-header">
    <h1>Academics <span>&amp; Career</span></h1>
    <p>Learn the domain properly, prove it with a certificate, then use it to get hired.</p>
  </div>

  <div class="grid" id="cards"></div>

  <div id="domainWrap" hidden>
    <div class="section-head">
      <h2>Domains</h2><span class="sp"></span>
      <button class="linky" id="backToCards">← All sections</button>

  <div id="moduleWrap" hidden>
    <div class="section-head">

    </div>
    <div id="modules"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var API = '/api/v2/academics';
  var state = { premiumAmount: 999, passMark: 70, maxAttempts: 3, domain: null };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined) { e.textContent = text; }
    return e;
  }
  function show(id) { ['cards', 'domainWrap', 'moduleWrap'].forEach(function (k) {
    var n = k === 'cards' ? $('cards') : $(k);
    if (k === 'cards') { n.hidden = id !== 'cards'; } else { n.hidden = id !== k; }
  }); }
  function openModal(build) {
    var s = $('sheet'); s.innerHTML = ''; build(s); $('modal').classList.add('on');
  }
  function closeModal() { $('modal').classList.remove('on'); }
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) { closeModal(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeModal(); } });

  var get = function (u) { return fetch(API + u, { credentials: 'same-origin' }).then(function (r) { return r.json(); }); };
  var post = function (u, b) {
    return fetch(API + u, { method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) })
      .then(function (r) { return r.json().then(function (j) { j._code = r.status; return j; }); });
  };

  /* ── cinematic entry ────────────────────────────────────────────────
     Scroll position drives everything. `p` runs 0 to 1 across the runway:
     0 is the tight cluster, 1 is fully spread with payment up. Driven from
     rAF rather than the scroll event so we paint once per frame however
     fast the wheel fires. */
  var DOMAINS14 = [
    ['DevOps with AWS',        'AWS',  '#FF9900', '#8A4B00'],
    ['Python Development',     'PY',   '#4B8BBE', '#1B3A54'],
    ['Java Development',       'JAVA', '#E76F00', '#7A2E00'],
    ['Web Development',        'WEB',  '#E34F26', '#6B1E0C'],
    ['MERN Stack',             'MERN', '#00ED64', '#04512A'],
    ['Artificial Intelligence','AI',   '#8B5CF6', '#3B1E70'],
    ['Data Science',           'DATA', '#06B6D4', '#0A4A58'],
    ['Cyber Security',         'SEC',  '#EF4444', '#6B1414'],
    ['Software Engineering',   'SWE',  '#3B82F6', '#12356E'],
    ['Flutter Development',    'FLTR', '#54C5F8', '#0E4C6B'],
    ['Business Development',   'BIZ',  '#F59E0B', '#7A4A00'],
    ['Human Resources',        'HR',   '#EC4899', '#6B1140'],
    ['Venture Capital',        'VC',   '#10B981', '#064C36'],
    ['Finance',                'FIN',  '#D4AF37', '#6B5410'],
  ];

  (function cinematic() {
    var cine = $('cine'), art = $('cineArt'), track = $('cineTrack');
    if (!cine) { return; }
    var reduced = false;
    try { reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches; } catch (_e) {}

    /* Artwork lives at /img/domains/<slug>.png. Until those files exist the
       coloured medallion stands in, so the sequence is testable now and the
       upgrade is a file drop rather than a code change. */
    var ART = '/img/domains/';
    var EXT = '.webp';
    var BEATS = [
      { slug: 'ten', mark: '\u221E', c1: '#F4E9C0', c2: '#8A6E1F',
        idx: 'Academics', h: 'Fourteen domains.', em: 'One way in.',
        p: 'Modules you work through, assessments that are actually marked, a project you can show '
         + 'someone, and a certificate that stands behind it.' },
      { slug: 'flutter', mark: 'FLTR', c1: '#54C5F8', c2: '#0E4C6B', cap: 'Flutter Development',
        idx: '01 \u2014 Learn by building', h: 'You do not watch.', em: 'You build.',
        p: 'Every module ends in something that runs. Practice projects, not slides \u2014 the only '
         + 'proof that survives an interview is work you can open and explain.' },
      { slug: 'java', mark: 'JAVA', c1: '#E76F00', c2: '#7A2E00', cap: 'Java Development',
        idx: '02 \u2014 Assignments, marked', h: 'Written answers.', em: 'Marked properly.',
        p: 'No multiple choice. You write, and it is scored against the points the question asked '
         + 'for, then told exactly which ones you missed. Pass mark 70%.' },
      { slug: 'python', mark: 'PY', c1: '#4B8BBE', c2: '#1B3A54', cap: 'Python Development',
        idx: '03 \u2014 Resume builder', h: 'A resume that', em: 'shows the work.',
        p: 'ATS-clean, and it pulls in the projects and certificates you earned here rather than '
         + 'asking you to describe them from memory.' },
      { slug: 'mern', mark: 'MERN', c1: '#00ED64', c2: '#04512A', cap: 'MERN Stack',
        idx: '04 \u2014 Job readiness', h: 'Ready end to end,', em: 'not just qualified.',
        p: 'Portfolio, resume and interview preparation for the domain you actually studied, so the '
         + 'thing you learned and the thing you are asked about are the same thing.' },
      { slug: 'swe', mark: 'SWE', c1: '#3B82F6', c2: '#12356E', cap: 'Software Engineering',
        idx: '05 \u2014 Job findings', h: 'The jobs,', em: 'brought to you.',
        p: 'Openings across every major hiring platform, filtered to your domain and your level, '
         + 'with the original apply link rather than a rewrite of it.' },
      { slug: 'webdev', mark: 'WEB', c1: '#E34F26', c2: '#6B1E0C', cap: 'Web Development',
        idx: '06 \u2014 Hackathons', h: 'Hackathons and', em: 'idea-thons.',
        p: 'College, national and international. Start building before the event opens, form a team, '
         + 'track milestones, and come out with something that was judged.' },
      // The only beat with ground under it, and the one the camera descends onto.
      { slug: 'space', mark: 'SPACE', c1: '#94A3B8', c2: '#1E293B', cap: 'Space Intern Program',
        moon: true,
        idx: '07 \u2014 Every track', h: 'All fourteen.', em: 'Same depth.',
        p: 'Whichever domain you are on, the modules, the marking, the resume, the jobs and the '
         + 'hackathons are the same. Nothing here is reserved for one track.' },
      { pay: true, idx: '08 \u2014 Unlock', h: 'Unlock', em: 'Everything.' },
    ];

    var DOM14 = [
      ['AWS', '#FF9900', '#8A4B00'], ['PY', '#4B8BBE', '#1B3A54'], ['JAVA', '#E76F00', '#7A2E00'],
      ['WEB', '#E34F26', '#6B1E0C'], ['MERN', '#00ED64', '#04512A'], ['AI', '#8B5CF6', '#3B1E70'],
      ['DATA', '#06B6D4', '#0A4A58'], ['SEC', '#EF4444', '#6B1414'], ['SWE', '#3B82F6', '#12356E'],
      ['FLTR', '#54C5F8', '#0E4C6B'], ['BIZ', '#F59E0B', '#7A4A00'], ['HR', '#EC4899', '#6B1140'],
      ['VC', '#10B981', '#064C36'], ['FIN', '#D4AF37', '#6B5410'],
    ];

    var layers = BEATS.map(function (b) {
      var wrap = el('div', 'art');
      var orb = el('div', 'orb');
      wrap.appendChild(orb);
      if (b.all14) {
        var g = el('div', 'all14');
        DOM14.forEach(function (d) {
          var sp = el('span', null, d[0]);
          sp.style.setProperty('--c1', d[1]);
          sp.style.setProperty('--c2', d[2]);
          g.appendChild(sp);
        });
        orb.appendChild(g);
      } else if (!b.pay) {
        var fb = el('div', 'fallback', b.mark);
        fb.style.setProperty('--c1', b.c1);
        fb.style.setProperty('--c2', b.c2);
        var img = new Image();
        img.alt = b.cap || 'TEN';
        // Swap only once the real file has decoded, so a missing or broken
        // image never leaves an empty frame mid-sequence.
        img.onload = function () { orb.replaceChild(img, fb); };
        img.className = 'plate';
        img.src = ART + b.slug + EXT;
        orb.appendChild(fb);
        if (b.cap) { wrap.appendChild(el('div', 'cap', b.cap)); }
      }
      /* After the artwork, never before: these three sit on top of it. Added
         first they render behind the image and do nothing at all. */
      if (!b.pay) {
        orb.appendChild(el('div', 'corner'));
        orb.appendChild(el('div', 'sheen'));
        orb.appendChild(el('div', 'rim'));
      }
      art.appendChild(wrap);
      return wrap;
    });

    var dotsBox = $('cineDots');
    var beats = BEATS.map(function (b) {
      var sec = el('section', 'beat' + (b.pay ? ' pay' : ''));
      var inner = el('div', 'in');
      inner.appendChild(el('div', 'idx', b.idx));
      var h = el('h2', null, b.h);
      h.appendChild(el('em', null, b.em));
      inner.appendChild(h);
      if (b.p) { inner.appendChild(el('p', null, b.p)); }

      if (b.pay) {
        var card = el('div', 'paycard');
        card.appendChild(el('h3', null, 'Unlock Everything'));
        card.appendChild(el('p', 'why', 'Every module, every assessment, the project reviews and '
          + 'the certificate. One payment per domain.'));
        var qr = el('div', 'qrslot empty', 'QR goes here once you send it');
        qr.id = 'cineQr';
        card.appendChild(qr);
        var stack = el('div', 'stack');
        var now = el('button', 'btn gold', 'Unlock Everything \u2014 Pay Now');
        now.id = 'cinePayNow';
        var later = el('button', 'btn ghost', 'Pay after Completion');
        later.id = 'cineLater';
        stack.appendChild(now);
        stack.appendChild(later);
        card.appendChild(stack);
        card.appendChild(el('p', 'meta',
          'Start the modules now. Payment is only needed for the certificate.'));
        inner.appendChild(card);
      }
      sec.appendChild(inner);
      track.appendChild(sec);
      dotsBox.appendChild(el('i'));
      return sec;
    });

    var dots = dotsBox.querySelectorAll('i');
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    function activate(n) {
      beats.forEach(function (sec, i) { sec.classList.toggle('live', i === n); });
      layers.forEach(function (l, i) { l.classList.toggle('on', i === n); });
      for (var i = 0; i < dots.length; i++) { dots[i].classList.toggle('on', i === n); }
      cine.classList.toggle('moonbeat', !!BEATS[n].moon);
      $('cineCount').textContent = pad(n + 1) + ' / ' + pad(BEATS.length);
      $('cineHint').style.opacity = n === 0 ? '' : '0';
    }

    /* The browser already knows which section is on screen; asking it beats
       recomputing offsets on every scroll event. */
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { activate(beats.indexOf(e.target)); }
        });
      }, { root: track, threshold: 0.55 });
      beats.forEach(function (sec) { io.observe(sec); });
    } else {
      track.addEventListener('scroll', function () {
        activate(Math.round(track.scrollTop / track.clientHeight));
      }, { passive: true });
    }
    activate(0);

    /* --zoom is how far through the Space Intern beat the student has scrolled.
       Measured against that one section rather than the whole track, so the
       descent starts and ends exactly where the beat does however many beats
       sit either side of it. */
    var moonIndex = BEATS.map(function (b) { return !!b.moon; }).indexOf(true);
    if (moonIndex > -1) {
      var moonBeat = beats[moonIndex], ticking = false;
      var setZoom = function () {
        ticking = false;
        var top = moonBeat.offsetTop - track.scrollTop;
        var z = 1 - (top / Math.max(1, track.clientHeight));
        cine.style.setProperty('--zoom', Math.max(0, Math.min(1, z)).toFixed(3));
      };
      track.addEventListener('scroll', function () {
        if (ticking) { return; }
        ticking = true;
        requestAnimationFrame(setZoom);
      }, { passive: true });
      setZoom();
    }

    /* Pointer tracking, written as CSS variables rather than a transform, so
       the idle drift keyframes keep running underneath.

       Three numbers: -1..1 across the viewport for the lean, 0..100 across
       the plate itself for the highlight, and how close the pointer is to the
       plate, which is what makes it come alive as you approach rather than
       reacting the same from across the screen.

       Coalesced into one rAF - pointermove fires far more often than the
       screen refreshes, and writing a variable per event is work thrown away. */
    if (!reduced && window.matchMedia('(hover:hover)').matches) {
      var mx = 0, my = 0, queued = false;
      cine.addEventListener('pointermove', function (e) {
        mx = e.clientX; my = e.clientY;
        if (queued) { return; }
        queued = true;
        requestAnimationFrame(function () {
          queued = false;
          var w = cine.clientWidth, h = cine.clientHeight;
          art.style.setProperty('--px', ((mx / w) * 2 - 1).toFixed(3));
          art.style.setProperty('--py', ((my / h) * 2 - 1).toFixed(3));

          var r = art.getBoundingClientRect();
          if (!r.width) { return; }
          art.style.setProperty('--mx', (((mx - r.left) / r.width) * 100).toFixed(1));
          art.style.setProperty('--my', (((my - r.top) / r.height) * 100).toFixed(1));

          // 1 over the plate, falling to 0 about a plate-width away.
          var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          var d = Math.hypot(mx - cx, my - cy) / (r.width * 1.15);
          art.style.setProperty('--near', Math.max(0, 1 - d).toFixed(3));
        });
      });
    }

    var cv = $('cineCanvas'), ctx = cv.getContext('2d'), dust = [], vw = 0, vh = 0;
    function sizeCanvas() {
      vw = cine.clientWidth; vh = cine.clientHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.floor(vw * dpr);
      cv.height = Math.floor(vh * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = reduced ? 0 : Math.min(140, Math.round((vw * vh) / 15000));
      dust = Array.from({ length: n }, function () {
        return { x: Math.random() * vw, y: Math.random() * vh, z: Math.random(),
                 r: Math.random() * 1.4 + 0.35 };
      });
    }
    sizeCanvas();
    window.addEventListener('resize', sizeCanvas);

    var raf = 0;
    function frame() {
      ctx.clearRect(0, 0, vw, vh);
      for (var i = 0; i < dust.length; i++) {
        var d = dust[i];
        d.y -= 0.08 + d.z * 0.3;
        if (d.y < -4) { d.y = vh + 4; d.x = Math.random() * vw; }
        ctx.globalAlpha = 0.1 + d.z * 0.32;
        ctx.fillStyle = i % 7 === 0 ? '#D4AF37' : '#8FA6C8';
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, 6.284);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(frame);
    }
    if (!reduced) { raf = requestAnimationFrame(frame); }

    function leave() {
      cancelAnimationFrame(raf);
      cine.classList.add('gone');
      document.body.style.overflow = '';
    }
    document.body.style.overflow = 'hidden';
    $('cineSkip').addEventListener('click', leave);
    $('cinePayNow').addEventListener('click', function () { window.location.href = '/payment.html'; });
    $('cineLater').addEventListener('click', leave);
  })();

  /* ── the four Academics cards ───────────────────────────────────────── */
  var ICONS = { student: '🎓', job: '💼', resume: '📄', hackathons: '🏆' };
  get('/overview').then(function (d) {
    state.premiumAmount = d.premiumAmount; state.passMark = d.passMark; state.maxAttempts = d.maxAttempts;
    var box = $('cards'); box.innerHTML = '';
    (d.sections || []).forEach(function (s) {
      var c = el('div', 'card');
      c.appendChild(el('span', 'ico', ICONS[s.key] || '•'));
      var h = el('h3', null, s.label);
      if (s.premium) { h.appendChild(el('span', 'tag prem', 'PREMIUM')); }
      if (!s.ready) { h.appendChild(el('span', 'tag soon', 'SOON')); }
      c.appendChild(h);
      c.appendChild(el('p', null, s.sub));
      c.addEventListener('click', function () { openSection(s); });
      box.appendChild(c);
    });
  });

  function openSection(s) {
    if (!s.ready) {
      return openModal(function (sh) {
        sh.appendChild(el('h2', null, s.label));
        sh.appendChild(el('p', 'lede', 'Not built yet. The plan for it is written up in '
          + 'docs/academics-career-portal-spec.md, including what has to be decided first.'));
        var st = el('div', 'stack');
        var b = el('button', 'btn ghost', 'Close'); b.addEventListener('click', closeModal);
        st.appendChild(b); sh.appendChild(st);
      });
    }
    // Preview always comes before price.
    openModal(function (sh) {
      sh.appendChild(el('h2', null, 'Domains — 14 learning tracks'));
      sh.appendChild(el('p', 'lede', 'What you get inside:'));
      var ul = el('ul', 'perks');
      [['Modules built from the same task library you are assigned from'],
       ['A written assessment after every module — not multiple choice'],
       ['Marked against the points the question asks for, and told exactly which you missed'],
       ['Pass at ' + state.passMark + '% to unlock the next module. ' + state.maxAttempts + ' attempts, then a 24-hour wait'],
       ['A project per module, which is what a recruiter can actually check'],
       ['A Certificate of Completion, then the resume builder, then real jobs']
      ].forEach(function (p) {
        var li = el('li'); li.appendChild(el('span', 'tick', '✓'));
        li.appendChild(el('span', null, p[0])); ul.appendChild(li);
      });
      sh.appendChild(ul);
      var st = el('div', 'stack');
      var go = el('button', 'btn gold', 'See the domains');
      go.addEventListener('click', function () { closeModal(); loadDomains(); });
      st.appendChild(go); sh.appendChild(st);
    });
  }

  /* ── domains ────────────────────────────────────────────────────────── */
  function loadDomains() {
    show('domainWrap');
    var box = $('domains'); box.innerHTML = '';
    get('/domains').then(function (d) {
      if (!d.domains || !d.domains.length) {
        box.appendChild(el('div', 'empty', 'No domains yet — the task library has not been seeded.'));
        return;
      }
      d.domains.forEach(function (row) {
        var c = el('div', 'card');
        var h = el('h3', null, row.domain);
        if (row.progress && row.progress.certificate) { h.appendChild(el('span', 'tag prem', 'CERTIFIED')); }
        c.appendChild(h);
        c.appendChild(el('p', null, row.progress
          ? row.progress.passed + ' modules passed' + (row.progress.paid ? ' · paid' : ' · unpaid')
          : 'Not started'));
        c.addEventListener('click', function () { openDomain(row.domain); });
        box.appendChild(c);
      });
    });
  }
  $('backToCards').addEventListener('click', function () { show('cards'); });
  $('backToDomains').addEventListener('click', loadDomains);

  /* ── the paywall, moment one: has a way past it ─────────────────────── */
  function payWall(domain, firstTime, onContinue) {
    openModal(function (sh) {
      sh.appendChild(el('h2', null, firstTime ? 'Premium — ' + domain : 'Your certificate is ready'));
      sh.appendChild(el('p', 'lede', firstTime
        ? 'Unlock the full track, the assessments and the certificate.'
        : 'You have passed every module in ' + domain + '. Payment releases the certificate.'));
      var p = el('div', 'price', '₹' + state.premiumAmount);
      p.appendChild(el('small', null, 'one payment for this domain'));
      sh.appendChild(p);
      var st = el('div', 'stack');
      var pay = el('button', 'btn gold', 'Pay ₹' + state.premiumAmount);
      pay.addEventListener('click', function () { window.location.href = '/payment.html'; });
      st.appendChild(pay);
      // Only the first popup carries this. The one after completion does not.
      if (firstTime) {
        var later = el('button', 'btn ghost', 'Continue to modules');
        later.addEventListener('click', function () {
          post('/defer', { domain: domain }).then(function () { closeModal(); onContinue(); });
        });
        st.appendChild(later);
        sh.appendChild(st);
        sh.appendChild(el('p', 'meta', 'Study now, pay when you want the certificate.'));
      } else {
        sh.appendChild(st);
      }
    });
  }

  /* ── modules ────────────────────────────────────────────────────────── */
  function openDomain(domain) {
    state.domain = domain;
    get('/domain/' + encodeURIComponent(domain)).then(function (d) {
      if (d.error) { return openModal(function (sh) {
        sh.appendChild(el('h2', null, 'Cannot open that'));
        sh.appendChild(el('p', 'lede', d.error));
      }); }
      if (!d.paid && !d.deferred) { return payWall(domain, true, function () { renderModules(d); }); }
      renderModules(d);
      if (d.certificateBlocked) { payWall(domain, false, function () {}); }
    });
  }

  function renderModules(d) {
    show('moduleWrap');
    $('domainName').textContent = d.domain;
    var box = $('modules'); box.innerHTML = '';

    d.modules.forEach(function (m) {
      var head = el('div', 'week-header');
      head.appendChild(el('span', 'week-badge', 'M' + m.index));
      var t = el('div', 'week-title');
      t.appendChild(el('b', null, m.title));
      t.appendChild(el('small', null, m.passed ? 'Passed · ' + m.bestScore + '%'
        : m.locked ? 'Locked' : 'Open'));
      head.appendChild(t);
      if (m.locked) { head.appendChild(el('span', 'week-locked-msg', '🔒 Pass module ' + (m.index - 1) + ' to unlock')); }
      box.appendChild(head);

      var card = el('div', 'task-card' + (m.locked ? ' locked' : '') + (m.passed ? ' done' : ''));
      card.appendChild(el('span', 'state', m.passed ? '✓' : m.locked ? '🔒' : '▸'));
      var body = el('div', 'body');
      body.appendChild(el('h4', null, m.title));
      body.appendChild(el('p', null, m.summary || 'No summary.'));
      var chips = el('div', 'chips');
      chips.appendChild(el('span', 'chip ' + (m.difficulty || 'easy'), m.difficulty || 'easy'));
      if (m.coins) { chips.appendChild(el('span', 'chip coins', m.coins + ' coins')); }
      if (m.passed) { chips.appendChild(el('span', 'chip passed', 'PASSED')); }
      else if (m.locked) { chips.appendChild(el('span', 'chip locked', 'LOCKED')); }
      if (m.bestScore) { chips.appendChild(el('span', 'chip score', 'best ' + m.bestScore + '%')); }
      body.appendChild(chips);

      if (!m.locked && !m.passed) {
        var acts = el('div', 'row-actions');
        var quiz = el('button', 'btn gold', 'Take assessment →');
        quiz.disabled = !m.canAttempt;
        quiz.addEventListener('click', function () { openAssessment(d.domain, m.key); });
        acts.appendChild(quiz);
        var proj = el('button', 'btn ghost', m.projectDone ? '✓ Project done' : 'Mark project done');
        proj.addEventListener('click', function () {
          post('/project', { domain: d.domain, moduleKey: m.key }).then(function () { openDomain(d.domain); });
        });
        acts.appendChild(proj);
        body.appendChild(acts);
        if (!m.canAttempt && m.unlocksAt) {
          body.appendChild(el('p', 'meta', 'All ' + state.maxAttempts + ' attempts used. Next opens '
            + new Date(m.unlocksAt).toLocaleString('en-IN') + '.'));
        } else if (m.attemptsLeft < state.maxAttempts) {
          body.appendChild(el('p', 'meta', m.attemptsLeft + ' of ' + state.maxAttempts + ' attempts left today.'));
        }
      }
      card.appendChild(body);
      box.appendChild(card);
    });

    if (d.complete && d.certificateBlocked) {
      box.appendChild(el('div', 'empty', 'Every module passed. Payment releases your certificate.'));
    }
  }

  /* ── one assessment ─────────────────────────────────────────────────── */
  function openAssessment(domain, moduleKey) {
    get('/assessment/' + encodeURIComponent(domain) + '/' + encodeURIComponent(moduleKey)).then(function (q) {
      if (q.error) { return alert(q.error); }
      openModal(function (sh) {
        sh.appendChild(el('h2', null, q.title));
        sh.appendChild(el('p', 'lede', q.question));
        var ta = el('textarea');
        ta.placeholder = 'Write your answer. At least ' + q.minWords + ' words.';
        sh.appendChild(ta);
        sh.appendChild(el('p', 'meta', 'Pass mark ' + q.passMark + '%. This question asks for '
          + q.pointCount + ' things. ' + q.attemptsLeft + ' of ' + state.maxAttempts + ' attempts left.'));
        var out = el('div');
        var st = el('div', 'stack');
        var send = el('button', 'btn gold', 'Submit answer');
        send.addEventListener('click', function () {
          send.disabled = true;
          post('/assessment', { domain: domain, moduleKey: moduleKey, answer: ta.value })
            .then(function (r) {
              out.innerHTML = '';
              if (r._code === 429) {
                out.className = 'result fail'; out.textContent = r.message; return;
              }
              if (r.error) { out.className = 'result fail'; out.textContent = r.error; send.disabled = false; return; }
              out.className = 'result ' + (r.passed ? 'pass' : 'fail');
              out.appendChild(el('b', null, r.score + '% — ' + (r.passed ? 'passed' : 'not passed')));
              if (r.tooShort) {
                out.appendChild(el('p', null, 'Your answer is ' + r.words
                  + ' words. Naming the right terms is not the same as explaining them.'));
              }
              if (r.missed && r.missed.length) {
                out.appendChild(el('p', null, 'You did not cover:'));
                var ul = el('ul');
                r.missed.forEach(function (x) { ul.appendChild(el('li', null, x)); });
                out.appendChild(ul);
              }
              if (!r.passed) {
                out.appendChild(el('p', null, r.attemptsLeft > 0
                  ? r.attemptsLeft + ' attempts left. If you disagree with the mark, ask your coordinator to review it.'
                  : 'No attempts left. Next opens ' + new Date(r.unlocksAt).toLocaleString('en-IN') + '.'));
                send.disabled = r.attemptsLeft <= 0;
              } else {
                send.textContent = 'Passed';
              }
            });
        });
        st.appendChild(send);
        var cl = el('button', 'btn ghost', 'Close');
        cl.addEventListener('click', function () { closeModal(); openDomain(domain); });
        st.appendChild(cl);
        sh.appendChild(st); sh.appendChild(out);
        if (!q.canAttempt) {
          send.disabled = true;
          out.className = 'result fail';
          out.textContent = 'All attempts used. Next opens ' + new Date(q.unlocksAt).toLocaleString('en-IN') + '.';
        }
        setTimeout(function () { ta.focus(); }, 60);
      });
    });
  }
})();
</script>
</body>
</html>
