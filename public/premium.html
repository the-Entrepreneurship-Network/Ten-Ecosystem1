<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium — TEN</title>
<!--
  The paid tracks' own room.

  Shown to every student, unlocked only for those on a settled paid track — a
  section nobody can see is a section nobody buys, so the locked state is a real
  page with the price on it rather than a redirect. Which of the two a visitor
  gets is decided by the server (utils/premium.js), never by this page.
-->
<style>
  :root{
    --gold:#D4AF37; --gold-soft:rgba(212,175,55,0.12); --gold-line:rgba(212,175,55,0.28);
    --bg:#05070e; --panel:#0b1120; --panel-2:#0e1628; --line:#1e293b;
    --text:#e8e4da; --muted:#8aa0bf; --green:#34d399; --amber:#fbbf24; --red:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;}

  /* The gold sheen is the whole point of the premium look: it should feel like
     a different room from the ordinary dashboard the moment it loads. */
  .aura{position:fixed;inset:0;pointer-events:none;z-index:0;
        background:radial-gradient(900px 420px at 50% -12%, rgba(212,175,55,0.14), transparent 65%);}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
         padding:14px 18px;background:rgba(5,7,14,0.92);backdrop-filter:blur(10px);
         border-bottom:1px solid var(--line);}
  .back{padding:8px 14px;border:1px solid var(--line);border-radius:10px;color:var(--text);
        text-decoration:none;font-size:13px;font-weight:600;}
  .back:hover{border-color:var(--gold-line)}
  h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.3px}
  .plan-chip{margin-left:auto;display:none;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;
             background:linear-gradient(135deg,rgba(212,175,55,0.22),rgba(212,175,55,0.06));
             border:1px solid var(--gold-line);color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.6px;}

  main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:26px 18px 70px}
  .hero{border:1px solid var(--gold-line);border-radius:20px;padding:26px;margin-bottom:26px;
        background:linear-gradient(150deg,rgba(212,175,55,0.10),rgba(14,22,40,0.6));}
  .hero h2{margin:0 0 6px;font-size:26px;letter-spacing:.2px}
  .hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}

  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
  .card.gold{border-color:var(--gold-line);background:linear-gradient(150deg,rgba(212,175,55,0.07),var(--panel))}
  .k{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

  h3.sec{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);
         margin:30px 0 12px;font-weight:800}

  .badges{display:flex;flex-wrap:wrap;gap:10px}
  .badge{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:12px;
         background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:600}
  .badge .ic{font-size:19px}

  .item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:11px}
  .item h4{margin:0 0 6px;font-size:15.5px}
  .item .meta{font-size:11.5px;color:var(--muted);margin-bottom:9px}
  .item .body{font-size:13.5px;line-height:1.65;color:#cfd8e6;white-space:pre-wrap}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.5px}
  .p-sent{background:rgba(138,160,191,.14);color:var(--muted)}
  .p-assigned{background:rgba(251,191,36,.14);color:var(--amber)}
  .p-submitted{background:rgba(96,165,250,.14);color:#60a5fa}
  .p-approved{background:rgba(52,211,153,.14);color:var(--green)}
  .p-changes_requested{background:rgba(248,113,113,.14);color:var(--red)}

  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  input[type=url],input[type=text]{flex:1;min-width:200px;min-height:44px;padding:10px 13px;border-radius:10px;
    border:1px solid var(--line);background:#070d19;color:var(--text);font-size:14px}
  input:focus{outline:none;border-color:var(--gold-line)}
  .btn{min-height:44px;padding:10px 20px;border-radius:10px;border:none;background:var(--gold);
       color:#05070e;font-weight:800;font-size:14px;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}

  .empty{color:var(--muted);font-size:13.5px;padding:16px 2px}
  .fb{margin-top:9px;padding:10px 13px;border-radius:10px;background:rgba(248,113,113,.08);
      border:1px solid rgba(248,113,113,.25);font-size:13px;color:#fecaca}

  /* locked state */
  .lock{text-align:center;padding:36px 22px}
  .lock .ic{font-size:46px;margin-bottom:10px}
  .lock h2{margin:0 0 8px;font-size:23px}
  .lock p{color:var(--muted);font-size:14px;line-height:1.65;max-width:520px;margin:0 auto 18px}
  .stack{max-width:430px;margin:0 auto 20px;text-align:left;
         border:1px solid var(--gold-line);border-radius:14px;padding:16px 18px;background:var(--gold-soft)}
  .stack li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:13.5px;list-style:none}
  .stack ul{margin:0;padding:0}
  .price{margin-top:12px;padding-top:12px;border-top:1px solid var(--gold-line);
         display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
  @media(max-width:520px){ main{padding:18px 13px 60px} .hero{padding:20px} }
</style>
</head>
<body>
<div class="aura"></div>

<header>
  <a class="back" href="/student-dashboard.html">← Dashboard</a>
  <h1>✦ Premium</h1>
  <span class="plan-chip" id="planChip"></span>
</header>

<main id="root">
  <p class="empty">Loading…</p>
</main>

<script>
/** Escape before anything server-supplied touches innerHTML. */
function esc(v){return String(v==null?'':v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function money(n){return '₹'+Number(n||0).toLocaleString('en-IN');}
function when(d){ if(!d) return ''; try{return new Date(d).toLocaleDateString(undefined,
  {day:'numeric',month:'short',year:'numeric'});}catch(e){return '';} }

var STATE = null;

async function load(){
  try{
    const r = await fetch('/api/v2/premium/me',{credentials:'same-origin'});
    if(r.status===401){ location.href='/login.html'; return; }
    const d = await r.json();
    if(!d.success){ document.getElementById('root').innerHTML =
      '<p class="empty">'+esc(d.message||'Could not load this section.')+'</p>'; return; }
    STATE = d;
    d.premium ? renderUnlocked(d) : renderLocked(d);
  }catch(e){
    document.getElementById('root').innerHTML =
      '<p class="empty">Could not reach the server. Check your connection and try again.</p>';
  }
}

/* ── locked: shown to free tracks and to unpaid paid-track students ────── */
function renderLocked(d){
  const b = d.bundle;
  let stack = '';
  if (b) {
    stack =
      '<div class="stack"><ul>' +
        b.perks.map(function(p){
          return '<li><span>✓ '+esc(p.label)+'</span><span style="color:var(--gold);font-weight:700;white-space:nowrap">'
               + (p.worth>0?money(p.worth):'included')+'</span></li>';
        }).join('') +
      '</ul><div class="price"><span>You pay</span><span style="color:var(--gold)">'+money(b.price)+'</span></div>'
      + (b.saving>0?'<div style="color:var(--green);font-size:12.5px;font-weight:700;margin-top:5px;text-align:right">You save '+money(b.saving)+'</div>':'')
      + '</div>';
  }

  // A free-track student cannot buy this, so they are told plainly instead of
  // being shown a button that leads nowhere.
  const cta = d.onPaidTrack
    ? '<a class="btn" style="text-decoration:none;display:inline-block" href="/student-dashboard.html">Complete my payment →</a>'
    : '<p class="empty" style="text-align:center">This section belongs to the 1 Week, 15 Days and 1 Month tracks. Your track is free, and everything in it stays open to you.</p>';

  document.getElementById('root').innerHTML =
    '<div class="hero lock">' +
      '<div class="ic">🔒</div>' +
      '<h2>' + (d.onPaidTrack ? 'Unlock your Premium section' : 'Premium is part of the paid tracks') + '</h2>' +
      '<p>' + (d.onPaidTrack
        ? 'Your programme fee is still outstanding. Settle it and this page becomes your coordinator\'s direct line to you — briefs, projects and the TEN Assistant.'
        : 'Members on a paid track get a coordinator writing to them directly, projects assigned by hand, and the TEN Assistant.') + '</p>' +
      stack + cta +
    '</div>' +
    '<h3 class="sec">What is inside</h3>' +
    '<div class="grid">' +
      card('🎖️','Member badge','Your plan shown across the portal.') +
      card('✉️','Coordinator notes','Written to you, not to the cohort.') +
      card('📦','Assigned projects','Real briefs with a deadline and a review.') +
      card('∞','TEN Assistant','Your plan, deadlines and coins — ask anything.') +
    '</div>';
}
function card(ic,t,d){
  return '<div class="card"><div style="font-size:22px;margin-bottom:7px">'+ic+'</div>'
       + '<div style="font-weight:700;margin-bottom:4px">'+esc(t)+'</div>'
       + '<div style="color:var(--muted);font-size:13px;line-height:1.5">'+esc(d)+'</div></div>';
}

/* ── unlocked ─────────────────────────────────────────────────────────── */
function renderUnlocked(d){
  const chip = document.getElementById('planChip');
  chip.textContent = '✦ ' + (d.plan || 'PREMIUM');
  chip.style.display = 'flex';

  const notes    = d.assignments.filter(function(a){return a.kind==='note';});
  const projects = d.assignments.filter(function(a){return a.kind==='project';});

  document.getElementById('root').innerHTML =
    '<div class="hero">' +
      '<h2>Welcome to ' + esc(d.plan || 'Premium') + '</h2>' +
      '<p>Your coordinator can write to you here and set you real projects. Everything below is yours alone — it is not shared with the rest of the cohort.</p>' +
    '</div>' +

    '<div class="grid">' +
      '<div class="card gold"><div class="k">Your plan</div><div style="font-size:20px;font-weight:800;color:var(--gold)">'+esc(d.plan||'Premium')+'</div>'
        + (d.grantedAt?'<div style="color:var(--muted);font-size:12px;margin-top:4px">Member since '+esc(when(d.grantedAt))+'</div>':'') + '</div>' +
      '<div class="card"><div class="k">Projects</div><div style="font-size:20px;font-weight:800">'+projects.length+'</div>'
        + '<div style="color:var(--muted);font-size:12px;margin-top:4px">'+projects.filter(function(p){return p.status==='approved';}).length+' approved</div></div>' +
      '<div class="card"><div class="k">Notes</div><div style="font-size:20px;font-weight:800">'+notes.length+'</div>'
        + '<div style="color:var(--muted);font-size:12px;margin-top:4px">from your coordinator</div></div>' +
      '<div class="card"><div class="k">TEN Assistant</div><a class="btn" style="text-decoration:none;display:inline-block;margin-top:4px" href="/assistant">Open →</a></div>' +
    '</div>' +

    '<h3 class="sec">Badges</h3>' +
    (d.badges.length
      ? '<div class="badges">' + d.badges.map(function(b){
          return '<div class="badge"><span class="ic">'+esc(b.icon)+'</span><span>'+esc(b.name)+'</span></div>';
        }).join('') + '</div>'
      : '<p class="empty">No badges yet — they arrive as you go.</p>') +

    '<h3 class="sec">Projects from your coordinator</h3>' +
    (projects.length ? projects.map(renderProject).join('')
      : '<p class="empty">No projects assigned yet. Your coordinator will set one here.</p>') +

    '<h3 class="sec">Notes</h3>' +
    (notes.length ? notes.map(renderNote).join('')
      : '<p class="empty">No notes yet.</p>');
}

function renderNote(a){
  return '<div class="item">' +
    '<h4>'+esc(a.title)+'</h4>' +
    '<div class="meta">'+esc(a.from)+' · '+esc(when(a.createdAt))+'</div>' +
    (a.body?'<div class="body">'+esc(a.body)+'</div>':'') +
  '</div>';
}

function renderProject(a){
  const done = a.status==='approved';
  return '<div class="item">' +
    '<h4>'+esc(a.title)+' <span class="pill p-'+esc(a.status)+'">'+esc(a.status.replace('_',' '))+'</span></h4>' +
    '<div class="meta">'+esc(a.from)+' · '+esc(when(a.createdAt))
      + (a.dueAt?' · due '+esc(when(a.dueAt)):'') + '</div>' +
    (a.body?'<div class="body">'+esc(a.body)+'</div>':'') +
    (a.feedback?'<div class="fb"><b>Coordinator:</b> '+esc(a.feedback)+'</div>':'') +
    (done
      ? '<div class="row"><span style="color:var(--green);font-size:13px;font-weight:700">✓ Approved — '
        + esc(a.submissionUrl) + '</span></div>'
      : '<div class="row">' +
          '<input type="url" id="u_'+esc(a.id)+'" placeholder="https://github.com/you/project" value="'+esc(a.submissionUrl)+'">' +
          '<button class="btn" onclick="submitProject(\'' + esc(a.id) + '\')">'
            + (a.submissionUrl?'Update':'Submit') + '</button>' +
        '</div>') +
  '</div>';
}

async function submitProject(id){
  const input = document.getElementById('u_'+id);
  if(!input) return;
  const url = input.value.trim();
  if(!/^https?:\/\//i.test(url)){ alert('Give a link starting with http:// or https://'); return; }
  try{
    const r = await fetch('/api/v2/premium/projects/'+encodeURIComponent(id)+'/submit',{
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({submissionUrl:url})
    });
    const d = await r.json();
    if(!d.success){ alert(d.message||'Could not submit that.'); return; }
    load();
  }catch(e){ alert('Could not reach the server.'); }
}

load();
</script>
</body>
</html>
