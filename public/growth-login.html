<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth OS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0c1220; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; }
  .card { background: #0e1628; border: 1px solid rgba(245,197,66,0.18); border-radius: 18px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
  .brand { text-align: center; font-size: 11px; letter-spacing: 5px; color: #f5c542; font-weight: 700; }
  .title { text-align: center; font-size: 22px; color: #fff7d6; font-weight: 800; margin: 10px 0 4px; }
  .subtitle { text-align: center; color: #8b8578; font-size: 13px; margin-bottom: 30px; }
  .field { margin-bottom: 18px; }
  label { display: block; color: #b9b4a8; font-size: 13px; margin-bottom: 7px; font-weight: 500; }
  input { width: 100%; background: #0c1220; border: 1px solid #2a3350; border-radius: 9px; padding: 12px 14px; color: #f0eee8; font-size: 15px; outline: none; transition: border-color .2s; }
  input:focus { border-color: #f5c542; }
  .btn { width: 100%; background: linear-gradient(135deg,#f5c542,#d9a520); color: #1a1208; border: none; border-radius: 9px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .btn:disabled { background: #2a3350; color: #6b6558; cursor: not-allowed; }
  .msg { border-radius: 9px; padding: 11px 13px; font-size: 13px; margin-bottom: 18px; display: none; line-height: 1.5; }
  .msg.error { background: #2a0f0f; border: 1px solid #7f1d1d; color: #fca5a5; }
  .msg.warn { background: #2a1f06; border: 1px solid #78500a; color: #fcd34d; display: block; }
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand">THE ENTREPRENEURSHIP NETWORK</div>
    <div class="title">Growth OS</div>
    <div class="subtitle">Campaigns, segments and sending quota</div>

    <div class="msg warn" id="timeoutMsg">Your session timed out. Please sign in again.</div>
    <div class="msg error" id="errorMsg"></div>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" id="submitBtn" type="submit">Sign in</button>
  </form>

<script>
(function () {
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('submitBtn');
  var err = document.getElementById('errorMsg');

  if (!new URLSearchParams(location.search).has('timeout')) {
    document.getElementById('timeoutMsg').style.display = 'none';
  }

  function fail(text) {
    err.textContent = text;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      var res = await fetch('/api/growth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      var data = await res.json().catch(function () { return {}; });
      if (res.ok && data.success) { location.href = '/growth'; return; }
      fail(data.error || 'Invalid username or password');
    } catch (_) {
      fail('Could not reach the server. Check your connection and try again.');
    }
  });
})();
</script>
</body>
</html>
