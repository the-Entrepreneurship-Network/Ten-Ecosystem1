<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEN — Internal Portal</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #f1f5f9;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 44px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 32px 64px rgba(0,0,0,0.5);
    border: 1px solid #334155;
  }
  .logo {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    border-radius: 14px;
    font-size: 26px;
    margin-bottom: 12px;
  }
  .logo h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .logo p  { color: #64748b; font-size: 13px; margin-top: 3px; }

  .alert {
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13.5px;
    margin-bottom: 22px;
    display: none;
  }
  .alert-error   { background: #450a0a; border: 1px solid #ef4444; color: #fca5a5; }
  .alert-warning { background: #422006; border: 1px solid #f59e0b; color: #fcd34d; }
  .alert.show { display: block; }

  .field { margin-bottom: 18px; }
  label  { display: block; color: #94a3b8; font-size: 12.5px; font-weight: 600; margin-bottom: 7px; letter-spacing: 0.4px; text-transform: uppercase; }
  .input-wrap { position: relative; }
  input[type=text], input[type=password] {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 12px 40px 12px 14px;
    color: #f1f5f9;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=text]:focus, input[type=password]:focus { border-color: #3b82f6; }
  .eye-btn {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: #475569; cursor: pointer;
    font-size: 17px; line-height: 1;
    padding: 2px;
  }
  .eye-btn:hover { color: #94a3b8; }

  .btn-primary {
    width: 100%;
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary:hover:not(:disabled) { background: #2563eb; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .btn-primary.loading .spinner { display: block; }
  .btn-primary.loading .btn-label { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">🛡</div>
    <h1>TEN Internal Portal</h1>
    <p>Authorised personnel only</p>
  </div>

  <div id="alertTimeout" class="alert alert-warning">Session expired — please sign in again.</div>
  <div id="alertError"   class="alert alert-error">Invalid credentials. Access denied.</div>

  <div class="field">
    <label for="username">Username or Email</label>
    <div class="input-wrap">
      <input type="text" id="username" autocomplete="username" placeholder="Enter username or email" />
    </div>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="input-wrap">
      <input type="password" id="password" autocomplete="current-password" placeholder="Enter password" />
      <button class="eye-btn" type="button" aria-label="Toggle password" onclick="togglePw()">👁</button>
    </div>
  </div>

  <button class="btn-primary" id="loginBtn" onclick="doLogin()">
    <div class="spinner"></div>
    <span class="btn-label">Sign In</span>
  </button>
</div>

<script>
  /* ── Unregister any student/coordinator service workers so they cannot
        intercept admin portal navigations or fetch calls. ── */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    });
  }

  const params = new URLSearchParams(location.search);
  if (params.get('timeout') === '1') document.getElementById('alertTimeout').classList.add('show');

  /* ── If already authenticated as admin, skip the login form. ── */
  (async () => {
    try {
      const res = await fetch('/api/admin-internal/session-check', { credentials: 'same-origin' });
      if (res.ok) {
        const d = await res.json();
        if (d && d.success) { window.location.replace('/ten-admin'); }
      }
    } catch (_) {}
  })();

  function togglePw() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  }

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });

  async function doLogin() {
    const btn      = document.getElementById('loginBtn');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    document.getElementById('alertError').classList.remove('show');
    document.getElementById('alertTimeout').classList.remove('show');

    if (!username || !password) {
      document.getElementById('alertError').textContent = 'Please enter both username and password.';
      document.getElementById('alertError').classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.classList.add('loading');

    try {
      const res = await fetch('/api/admin-internal/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        window.location.href = '/ten-admin';
      } else {
        document.getElementById('alertError').textContent = data.error || 'Access denied.';
        document.getElementById('alertError').classList.add('show');
        document.getElementById('password').value = '';
      }
    } catch (err) {
      document.getElementById('alertError').textContent = 'Network error — please try again.';
      document.getElementById('alertError').classList.add('show');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }
</script>
</body>
</html>
