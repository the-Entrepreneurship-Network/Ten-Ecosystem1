<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .card { background: #1e293b; border-radius: 12px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
  .icon { text-align: center; font-size: 48px; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
  .field { margin-bottom: 20px; }
  label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 8px; font-weight: 500; }
  .input-wrap { position: relative; }
  input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; color: #f1f5f9; font-size: 15px; outline: none; transition: border-color 0.2s; }
  input:focus { border-color: #3b82f6; }
  .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 18px; }
  .btn { width: 100%; background: #3b82f6; color: white; border: none; border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
  .btn:hover { background: #2563eb; }
  .btn:disabled { background: #334155; cursor: not-allowed; }
  .error { background: #450a0a; border: 1px solid #ef4444; color: #fca5a5; border-radius: 8px; padding: 12px; font-size: 14px; margin-bottom: 20px; display: none; }
  .timeout { background: #422006; border: 1px solid #f59e0b; color: #fcd34d; border-radius: 8px; padding: 12px; font-size: 14px; margin-bottom: 20px; }
</style>
  <link rel="stylesheet" href="/css/mobile.css">
  <script src="/mobile-nav.js" defer></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0e1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TEN">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<div class="card">
  <div class="icon">🔒</div>
  <p class="subtitle">Internal Portal</p>

  <div id="timeoutMsg" class="timeout" style="display:none">
    Session expired. Please log in again.
  </div>

  <div id="errorMsg" class="error">
    Access denied. Check your credentials.
  </div>

  <div class="field">
    <label>Username</label>
    <input type="text" id="username" autocomplete="username" placeholder="Enter username">
  </div>
  <div class="field">
    <label>Password</label>
    <div class="input-wrap">
      <input type="password" id="password" autocomplete="current-password" placeholder="Enter password">
      <button class="toggle-pw" type="button" onclick="togglePw()">👁</button>
    </div>
  </div>
  <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>
</div>

<script>
  const params = new URLSearchParams(location.search);
  if (params.get('timeout') === '1') {
    document.getElementById('timeoutMsg').style.display = 'block';
  }

  function togglePw() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errorMsg');
    err.style.display = 'none';

    if (!username || !password) {
      err.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      const res = await fetch('/api/admin-internal/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = '/ten-admin';
      } else {
        err.textContent = 'Access denied. Check your credentials.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    } catch (e) {
      err.textContent = 'Connection error. Try again.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  }
</script>
</body>
</html>
