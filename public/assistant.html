<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEN Assistant</title>
<!--
  TEN Assistant — full-height chat.

  The page itself never scrolls. The shell is exactly one viewport tall and the
  message list is the only scrolling region, which is what stops the window
  jumping when an answer arrives. Everything else — picker, plans, payment —
  lives in panels over the top rather than pushing the conversation around.

  Self-contained: no framework, no build step, no external request. It talks
  only to /api/v2/assistant, which answers from the portal's own DomainTask
  rows, so it cannot invent a task that is not in the database.
-->
<style>
  :root{
    --void:#05070E; --ink:#090D1A; --card:#0E1428; --edge:#121933; --line:rgba(212,175,55,.13);
    --gold:#D4AF37; --gold-lift:#F0D060; --gold-dim:#B8960C;
    --text:#F0EEE8; --sub:#9A9080; --faint:#6D685E;
    --r-sm:10px; --r-md:16px; --r-lg:22px;
    --col:760px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--void);color:var(--text);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;
       -webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;font-size:inherit}
  a{color:var(--gold);text-decoration:none}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* ── shell ───────────────────────────────────────────────────────────── */
  .app{height:100dvh;display:grid;grid-template-columns:272px 1fr}
  /* Hidden by default at every width. Without this base rule the scrim is
     an unstyled div occupying grid column 1 on desktop, which pushes the
     chat onto a second row and squeezes it to the sidebar's width. */
  .scrim{display:none}
  @media(max-width:900px){.app{grid-template-columns:1fr}}

  /* ── sidebar ─────────────────────────────────────────────────────────── */
  /* The sidebar slides rather than unmounting, so the conversation column
     does not reflow and lose its scroll position when it is toggled. */
  .side{background:var(--ink);border-right:1px solid var(--line);
        display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding:16px 14px;
        transition:transform .26s cubic-bezier(.16,1,.3,1)}
  .app.collapsed{grid-template-columns:0 1fr}
  /* min-width:0 is load-bearing. A grid item defaults to min-width:auto, so
     without it the sidebar refuses to shrink past its content and the chat
     column gets squeezed to one word per line instead of taking the space. */
  .app.collapsed .side{transform:translateX(-100%);width:0;min-width:0;
                       padding-left:0;padding-right:0;overflow:hidden}
  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;inset:0;z-index:60;width:min(300px,86vw);border-right:1px solid var(--line);
          transform:translateX(-100%)}
    .app.mobile-open .side{transform:translateX(0)}
    .scrim{position:fixed;inset:0;z-index:55;background:rgba(3,5,10,.6);display:none}
    .app.mobile-open .scrim{display:block}
  }
  @media (prefers-reduced-motion:reduce){.side{transition:none}}

  .brand{display:flex;align-items:center;gap:10px;padding:2px 4px 16px}
  .brand .mk{font-size:24px;color:var(--gold);line-height:1}
  .brand b{font-size:14px;font-weight:700;letter-spacing:.01em;display:block}
  .brand small{color:var(--sub);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase}

  .side h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
           margin:16px 4px 8px;font-weight:600}
  .newchat{display:flex;align-items:center;gap:8px;width:100%;background:transparent;
           border:1px solid rgba(212,175,55,.28);color:var(--text);border-radius:var(--r-sm);
           padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
  .newchat:hover{background:rgba(212,175,55,.09);border-color:rgba(212,175,55,.5)}
  .newchat span{color:var(--gold);font-size:15px;line-height:1}
  .sessions{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0}
  .nochats{color:var(--faint);font-size:12px;padding:6px 10px;margin:0}
  .sess{display:flex;align-items:center;border-radius:var(--r-sm)}
  .sess:hover{background:rgba(212,175,55,.07)}
  .sess.on{background:rgba(212,175,55,.12)}
  .sess-open{flex:1;min-width:0;background:none;border:0;color:var(--sub);text-align:left;
             padding:8px 4px 8px 10px;font-size:12.5px;cursor:pointer;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess.on .sess-open,.sess:hover .sess-open{color:var(--text)}
  .sess-del{background:none;border:0;color:transparent;font-size:16px;line-height:1;
            padding:6px 9px;cursor:pointer}
  .sess:hover .sess-del{color:var(--faint)}
  .sess-del:hover{color:#EF4444}
  .side .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  .plan-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;
             background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
  .plan-chip b{color:var(--gold);font-size:12.5px;display:block}
  .plan-chip small{color:var(--sub);font-size:11px}
  .plan-chip button{background:none;border:1px solid rgba(212,175,55,.3);color:var(--gold);
                    border-radius:999px;padding:5px 11px;font-size:11px;cursor:pointer}
  .side .back{display:block;margin-top:10px;color:var(--faint);font-size:12px;text-align:center}

  /* ── main column ─────────────────────────────────────────────────────── */
  .main{display:flex;flex-direction:column;min-height:0;min-width:0}
  .top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);
       background:rgba(9,13,26,.85);backdrop-filter:blur(8px)}
  .top .burger{background:none;border:1px solid var(--line);color:var(--sub);
               border-radius:var(--r-sm);padding:6px 10px;cursor:pointer;line-height:1}
  .top .burger:hover{color:var(--text);border-color:rgba(212,175,55,.4)}
  .top h1{font-size:14px;margin:0;font-weight:600;flex:1}
  .top h1 span{display:block;color:var(--faint);font-size:11px;font-weight:400}

  /* The only scrolling region on the page. */
  #log{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
  .row{border-bottom:1px solid rgba(212,175,55,.05)}
  .row.me{background:rgba(212,175,55,.035)}
  .row .in{max-width:var(--col);margin:0 auto;padding:20px;display:flex;gap:14px}
  @media(max-width:640px){.row .in{padding:16px 14px;gap:10px}}
  .av{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
      font-size:13px;font-weight:700}
  .av.ai{background:linear-gradient(145deg,var(--gold-lift),var(--gold-dim));color:#05070E}
  .av.you{background:var(--edge);color:var(--sub);border:1px solid var(--line)}
  .body{min-width:0;flex:1;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
  .body .who{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}

  .dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sub);
             margin-right:4px;animation:blink 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  .empty{max-width:var(--col);margin:0 auto;padding:48px 20px;text-align:center}
  .empty .mk{font-size:44px;color:var(--gold);line-height:1}
  .empty h2{font-size:clamp(1.3rem,3.4vw,1.75rem);margin:14px 0 6px}
  .empty p{color:var(--sub);margin:0 auto;max-width:46ch;font-size:14px}
  .starters{display:grid;grid-template-columns:1fr;gap:8px;margin-top:22px;text-align:left}
  @media(min-width:560px){.starters{grid-template-columns:1fr 1fr}}
  .starters button{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
                   padding:12px 14px;cursor:pointer;color:var(--text);font-size:13px}
  .starters button:hover{border-color:rgba(212,175,55,.4);background:rgba(212,175,55,.06)}
  .starters b{display:block;font-size:13px}
  .starters small{color:var(--sub);font-size:11.5px}

  /* ── composer ────────────────────────────────────────────────────────── */
  .composer{border-top:1px solid var(--line);background:rgba(5,7,14,.9);
            padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  .composer form{max-width:var(--col);margin:0 auto;display:flex;gap:10px;align-items:flex-end;
                 background:var(--card);border:1px solid rgba(212,175,55,.22);border-radius:var(--r-lg);
                 padding:8px 8px 8px 16px}
  .composer form:focus-within{border-color:rgba(212,175,55,.5)}
  .composer textarea{flex:1;background:none;border:0;color:var(--text);resize:none;outline:none;
                     font-size:14.5px;line-height:1.5;max-height:180px;padding:8px 0}
  .composer textarea::placeholder{color:var(--faint)}
  .composer .send{flex:none;width:38px;height:38px;border-radius:12px;border:0;cursor:pointer;
                  background:linear-gradient(145deg,var(--gold-lift),var(--gold-dim));color:#05070E;
                  font-size:17px;font-weight:700}
  .composer .send:disabled{opacity:.4;cursor:default}
  .meter{max-width:var(--col);margin:8px auto 0;color:var(--faint);font-size:11px;text-align:center}

  /* ── panels ──────────────────────────────────────────────────────────── */
  .panel{position:fixed;inset:0;z-index:70;background:rgba(3,5,10,.94);backdrop-filter:blur(10px);
         overflow-y:auto;padding:32px 18px;display:none}
  .panel.on{display:block}
  .panel .inner{max-width:900px;margin:0 auto}
  .panel h2{font-size:clamp(1.4rem,4vw,2rem);text-align:center;margin:0 0 8px;
    background:linear-gradient(150deg,#F5E3A3,#D4AF37 55%,#9C7C14);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .panel .lede{color:var(--sub);text-align:center;margin:0 auto 24px;max-width:52ch;font-size:13.5px}
  .close{display:block;margin:22px auto 0;background:none;border:0;color:var(--sub);
         font-size:13px;cursor:pointer;text-decoration:underline}

  .plans{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:820px){.plans{grid-template-columns:repeat(4,1fr)}}
  .tier{background:var(--card);border:1px solid rgba(212,175,55,.16);border-radius:var(--r-lg);
        padding:18px;display:flex;flex-direction:column}
  .tier.on{border-color:rgba(212,175,55,.55)}
  .tier .nm{font-size:13.5px;font-weight:700}
  .tier .amt{font-size:24px;font-weight:800;color:var(--gold);margin:6px 0 0}
  .tier .per{color:var(--sub);font-size:11px;margin-bottom:12px}
  .tier ul{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:6px;flex:1}
  .tier li{font-size:12.5px;color:#D9D4C9;padding-left:15px;position:relative}
  .tier li:before{content:"\2022";position:absolute;left:2px;color:var(--gold)}
  .tier button{background:linear-gradient(145deg,var(--gold-lift),var(--gold-dim));color:#05070E;
               border:0;border-radius:var(--r-sm);padding:9px;font-weight:700;font-size:13px;cursor:pointer}
  .tier button[disabled]{background:none;border:1px solid rgba(212,175,55,.3);color:var(--sub);cursor:default}

  .pay{margin-top:20px;background:var(--card);border:1px solid rgba(212,175,55,.2);
       border-radius:var(--r-lg);padding:20px;max-width:400px;margin-inline:auto;text-align:center;display:none}
  .pay.on{display:block}
  .pay .qrbox{background:#fff;border-radius:var(--r-md);padding:11px;display:inline-block;margin-bottom:10px}
  .pay .qrbox img{display:block;width:min(210px,56vw);height:auto}
  .pay .amt2{font-size:22px;font-weight:800;color:var(--gold)}
  .pay .vpa{font-family:ui-monospace,monospace;font-size:12px;color:#D9D4C9;background:var(--edge);
            border:1px solid rgba(212,175,55,.16);border-radius:var(--r-sm);padding:8px;margin:10px 0;word-break:break-all}
  .pay input{width:100%;background:var(--void);color:var(--text);border:1px solid rgba(212,175,55,.22);
             border-radius:var(--r-sm);padding:10px;text-align:center;letter-spacing:.06em;outline:none;margin:6px 0}
  .pay .warn{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.28);color:#F5C87A;
             border-radius:var(--r-sm);padding:10px;font-size:12px;margin:10px 0;text-align:left;line-height:1.5}
  .pay .ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#6EE7B7;
           border-radius:var(--r-sm);padding:10px;font-size:12.5px;margin-top:10px;line-height:1.5}
  .pay .cta{width:100%;background:linear-gradient(145deg,var(--gold-lift),var(--gold-dim));color:#05070E;
            border:0;border-radius:var(--r-sm);padding:11px;font-weight:700;cursor:pointer}

  .weeks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .weeks li{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
  .weeks .hd{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .weeks b{font-size:13px}
  .weeks .mt{font-size:11px;color:var(--sub);white-space:nowrap}
  .weeks p{margin:3px 0 0;font-size:12.5px;color:#D9D4C9}
  .pill{display:inline-block;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.26);
        color:var(--gold);border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600;margin:0 6px 10px 0}

  /* ── intro (unchanged behaviour) ─────────────────────────────────────── */
  #intro{position:fixed;inset:0;z-index:9999;background:#05070E;display:grid;place-items:center;
    animation:introOut .6s cubic-bezier(.7,0,.84,0) 2.6s forwards}
  #intro .stage{position:relative;display:grid;place-items:center}
  #intro .bloom{position:absolute;width:78%;height:78%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,243,196,.5) 0%,rgba(212,175,55,.22) 42%,transparent 70%);
    opacity:0;animation:bloomIn 1.95s cubic-bezier(.34,.01,.24,1) .2s forwards}
  #intro img{position:relative;width:min(78vw,30rem);height:auto;mix-blend-mode:screen;
    opacity:0;transform:scale(1.06);animation:markIn 1.1s cubic-bezier(.16,1,.3,1) .2s forwards}
  #intro .skip{position:absolute;bottom:34px;right:26px;background:rgba(255,255,255,.03);
    border:1px solid rgba(212,175,55,.25);color:var(--sub);border-radius:999px;padding:8px 16px;
    font-size:12px;cursor:pointer;opacity:0;animation:fadeIn .34s ease 1.2s forwards}
  @keyframes markIn{to{opacity:1;transform:scale(1)}}
  @keyframes bloomIn{0%{opacity:0;transform:scale(.86)}62%{opacity:.55;transform:scale(1.08)}100%{opacity:.34;transform:scale(1)}}
  @keyframes introOut{to{opacity:0;transform:scale(1.055);filter:blur(9px);visibility:hidden}}
  @keyframes fadeIn{to{opacity:1}}
  #intro.done{display:none}
  @media (prefers-reduced-motion:reduce){
    #intro img,#intro .bloom{animation-duration:.01ms;animation-delay:0ms;opacity:1;transform:none}
    #intro{animation:introOut .01ms linear 1.6s forwards}
    #log{scroll-behavior:auto}
    .dots span{animation:none}
  }
</style>
</head>
<body>

<div id="intro" role="dialog" aria-modal="true" aria-label="TEN Assistant is opening">
  <div class="stage">
    <div class="bloom" aria-hidden="true"></div>
    <img src="/ten-3d-logo.jpg" alt="The Entrepreneurship Network (TEN)">
  </div>
  <button class="skip" type="button" id="introSkip">Skip intro</button>
</div>

<div class="app" id="app">
  <div class="scrim" id="scrim"></div>

  <aside class="side" id="side">
    <div class="brand">
      <span class="mk" aria-hidden="true">&#8734;</span>
      <span><b>TEN Assistant</b><small>The Entrepreneurship Network</small></span>
    </div>

    <button class="newchat" type="button" id="newChat">
      <span aria-hidden="true">&#43;</span> New chat
    </button>

    <h3>Chats</h3>
    <div class="sessions" id="sessions"></div>

    <div class="foot">
      <div class="plan-chip">
        <span><b id="tierName">Starter</b><small id="tierMeter">&nbsp;</small></span>
        <button type="button" id="openPlans">Plans</button>
      </div>
      <a class="back" href="/student-dashboard.html">&larr; Back to dashboard</a>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <button class="burger" type="button" id="burger" aria-label="Menu">&#9776;</button>
      <h1>TEN Assistant<span>Answers from the portal's own task library</span></h1>
    </div>

    <div id="log" aria-live="polite"></div>

    <div class="composer">
      <form id="ask">
        <textarea id="q" rows="1" placeholder="Ask about your tasks, coins, certificates…" aria-label="Message"></textarea>
        <button class="send" type="submit" id="send" aria-label="Send">&uarr;</button>
      </form>
      <div class="meter" id="meter"></div>
    </div>
  </main>
</div>

<div class="panel" id="plansPanel" role="dialog" aria-modal="true" aria-label="Plans">
  <div class="inner">
    <h2 id="pwHead">Great minds don’t give advice by the hour.</h2>
    <p class="lede" id="pwSub">Starter gets you unstuck. The paid tiers go deeper on the same question.</p>
    <div class="plans" id="plans"></div>
    <div class="pay" id="pay"></div>
    <button class="close" type="button" id="closePlans">Close</button>
  </div>
</div>

<div class="panel" id="planPanel" role="dialog" aria-modal="true" aria-label="Track plan">
  <div class="inner">
    <h2 id="planTitle">Your plan</h2>
    <div id="planBody"></div>
    <button class="close" type="button" id="closePlan">Close</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ── intro: once per session ─────────────────────────────────────────── */
  (function () {
    var intro = $('intro');
    var KEY = 'ten.assistant.intro.v1', seen = false;
    try { seen = sessionStorage.getItem(KEY) === '1'; } catch (e) {}
    if (seen) { intro.classList.add('done'); return; }
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
    function end() { intro.classList.add('done'); }
    intro.addEventListener('animationend', function (e) {
      if (e.animationName === 'introOut') { end(); }
    });
    $('introSkip').addEventListener('click', end);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { end(); }
    }, { once: true });
    setTimeout(end, 4000);
  })();

  /* ── who is asking (read-only) ───────────────────────────────────────── */
  function me() {
    var o = { userId: '', userName: '', domain: '' };
    try {
      var keys = ['employeeId', 'employee_id', 'userId', 'studentId', 'empId'];
      for (var i = 0; i < keys.length; i++) {
        var v = localStorage.getItem(keys[i]);
        if (v) { o.userId = v; break; }
      }
      o.userName = localStorage.getItem('name') || localStorage.getItem('studentName') || '';
      o.domain   = localStorage.getItem('domain') || localStorage.getItem('studentDomain') || '';
      var raw = localStorage.getItem('student') || localStorage.getItem('user');
      if (raw) {
        var p = JSON.parse(raw);
        o.userId   = o.userId   || p.employeeId || p.userId || p._id || '';
        o.userName = o.userName || p.name || '';
        o.domain   = o.domain   || p.domain || '';
      }
    } catch (e) {}
    return o;
  }

  /* ── message list ────────────────────────────────────────────────────── */
  var log = $('log');

  function atBottom() {
    return log.scrollHeight - log.scrollTop - log.clientHeight < 90;
  }
  /* Only follow the conversation when the reader is already at the bottom.
     Yanking someone back down while they are re-reading an earlier answer is
     the thing that makes a chat feel like it is fighting you. */
  function follow(force) {
    if (force || atBottom()) { log.scrollTop = log.scrollHeight; }
  }

  function bubble(who, text) {
    var row = document.createElement('div');
    row.className = 'row' + (who === 'me' ? ' me' : '');
    var inner = document.createElement('div'); inner.className = 'in';
    var av = document.createElement('div');
    av.className = 'av ' + (who === 'me' ? 'you' : 'ai');
    av.textContent = who === 'me' ? (me().userName ? me().userName[0].toUpperCase() : 'Y') : '∞';
    var body = document.createElement('div'); body.className = 'body';
    var lab = document.createElement('div'); lab.className = 'who';
    lab.textContent = who === 'me' ? 'You' : 'TEN Assistant';
    var txt = document.createElement('div');
    txt.textContent = text;                      // text node, never innerHTML
    body.appendChild(lab); body.appendChild(txt);
    inner.appendChild(av); inner.appendChild(body);
    row.appendChild(inner);
    log.appendChild(row);
    follow(who === 'me');                        // always follow your own message
    return txt;
  }

  function thinking() {
    var t = bubble('ai', '');
    t.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    return t;
  }

  /* ── empty state ─────────────────────────────────────────────────────── */
  var STARTERS = [
    ['My week-by-week plan', 'Every task, coin value and difficulty', 'Give me my week by week plan'],
    ['How do coins work?', '100 coins = ₹50, and the ones students miss', 'How do coins work and how do I earn the most?'],
    ['What domains exist?', 'All 14 tracks and 6 durations', 'What are all the domains available?'],
    ['Certificates', 'Types, and what earns the strongest one', 'What certificates does TEN issue and how do I qualify?']
  ];

  function showEmpty() {
    var who = me();
    var wrap = document.createElement('div');
    wrap.className = 'empty';
    var mk = document.createElement('div'); mk.className = 'mk'; mk.textContent = '∞';
    var h = document.createElement('h2');
    h.textContent = who.userName ? 'Hello, ' + who.userName.split(' ')[0] + '.' : 'How can I help?';
    var p = document.createElement('p');
    p.textContent = who.domain
      ? 'You are on ' + who.domain + '. Ask me anything about your tasks, coins, certificates or deadlines.'
      : 'Ask me about your weekly tasks, coins, attendance, documents or certificates.';
    wrap.appendChild(mk); wrap.appendChild(h); wrap.appendChild(p);

    var grid = document.createElement('div'); grid.className = 'starters';
    STARTERS.forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button';
      var t = document.createElement('b'); t.textContent = s[0];
      var d = document.createElement('small'); d.textContent = s[1];
      b.appendChild(t); b.appendChild(d);
      b.addEventListener('click', function () { send(s[2]); });
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
    log.appendChild(wrap);
  }

  function clearEmpty() {
    var e = log.querySelector('.empty');
    if (e) { e.remove(); }
  }

  /* ── sending ─────────────────────────────────────────────────────────── */
  var busy = false;
  function send(text) {
    var q = String(text || '').trim();
    if (!q || busy) { return; }
    busy = true;
    $('send').disabled = true;
    clearEmpty();
    bubble('me', q);
    remember('me', q);
    var pending = thinking();
    var who = me();

    fetch('/api/v2/assistant/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, userId: who.userId, userName: who.userName, domain: who.domain })
    })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (out) {
        var d = out.body;
        if (out.status === 402 && d.paywall) {
          pending.textContent = d.paywall.headline + '\n\n' + d.paywall.sub;
          if (d.paywall.plans) { renderPlans(d.paywall); }
          openPanel('plansPanel');
          return;
        }
        pending.textContent = d.answer || d.error || 'No answer available.';
        remember('ai', pending.textContent);
        if (typeof d.remaining === 'number') {
          $('meter').textContent = d.remaining + ' of ' + d.limit + ' messages left this month';
        } else if (d.limit === null) {
          $('meter').textContent = 'Unlimited messages';
        }
      })
      .catch(function () {
        pending.textContent = 'Could not reach the assistant. Check your connection and try again.';
      })
      .then(function () { busy = false; $('send').disabled = false; follow(); });
  }

  var box = $('q');
  function grow() { box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight, 180) + 'px'; }
  box.addEventListener('input', grow);
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('ask').requestSubmit(); }
  });
  $('ask').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = box.value;
    box.value = ''; grow();
    send(v);
  });

  /* ── panels ──────────────────────────────────────────────────────────── */
  function openPanel(id) { $(id).classList.add('on'); }
  function closePanel(id) { $(id).classList.remove('on'); }
  $('openPlans').addEventListener('click', function () { openPanel('plansPanel'); });
  $('closePlans').addEventListener('click', function () { closePanel('plansPanel'); });
  $('closePlan').addEventListener('click', function () { closePanel('planPanel'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closePanel('plansPanel'); closePanel('planPanel'); $('app').classList.remove('mobile-open'); }
  });
  /* One control, two behaviours: on a narrow screen it slides the panel over
     the conversation; on a wide one it collapses the column so the chat gets
     the full width. */
  function toggleSide() {
    var app = $('app');
    if (window.matchMedia('(max-width:900px)').matches) { app.classList.toggle('mobile-open'); }
    else { app.classList.toggle('collapsed'); }
  }
  $('burger').addEventListener('click', toggleSide);
  $('scrim').addEventListener('click', function () { $('app').classList.remove('mobile-open'); });

  /* ── plans + payment ─────────────────────────────────────────────────── */
  var CURRENT = 'starter';

  function renderPlans(wall) {
    var grid = $('plans'); grid.innerHTML = '';
    $('pwHead').textContent = wall.headline;
    $('pwSub').textContent = wall.sub;
    var free = { key: 'starter', label: 'Starter', priceLabel: 'Free', messages: '12 messages',
                 history: 'No history kept', blurb: 'Short answers to get you unstuck.', deepDive: false };
    [free].concat(wall.plans || []).forEach(function (plan) {
      var card = document.createElement('div');
      card.className = 'tier' + (plan.key === CURRENT ? ' on' : '');
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = plan.label;
      var amt = document.createElement('div'); amt.className = 'amt'; amt.textContent = plan.priceLabel.split('/')[0];
      var per = document.createElement('div'); per.className = 'per';
      per.textContent = plan.key === 'starter' ? 'always' : 'per month';
      var ul = document.createElement('ul');
      var feats = [plan.messages, plan.history, plan.blurb];
      if (plan.deepDive && plan.blurb.toLowerCase().indexOf('deep dive') === -1) { feats.push('Deep Dive Mode'); }
      feats.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
      var btn = document.createElement('button'); btn.type = 'button';
      if (plan.key === CURRENT) { btn.textContent = 'Your plan'; btn.disabled = true; }
      else if (plan.key === 'starter') { btn.textContent = 'Included'; btn.disabled = true; }
      else { btn.textContent = 'Choose ' + plan.label; btn.addEventListener('click', function () { showPayment(plan); }); }
      [nm, amt, per, ul, btn].forEach(function (el) { card.appendChild(el); });
      grid.appendChild(card);
    });
  }

  /*
   * The button says "I have paid", not "Pay". A static UPI QR reports nothing
   * back to the server, so this submits a claim a human then verifies. Nothing
   * here unlocks a tier: a tier unlocked in the browser is one anyone can
   * unlock.
   */
  function showPayment(plan) {
    var box2 = $('pay');
    box2.className = 'pay on';
    box2.innerHTML = '';
    fetch('/api/v2/assistant/payment-info?tier=' + encodeURIComponent(plan.key))
      .then(function (r) { return r.json(); })
      .then(function (info) {
        if (info.error) { box2.textContent = info.error; return; }
        var h = document.createElement('div');
        h.style.cssText = 'font-weight:700;font-size:14px;margin-bottom:6px';
        h.textContent = plan.label + ' — ' + info.priceLabel;
        var qr = document.createElement('div'); qr.className = 'qrbox';
        var img = document.createElement('img');
        img.src = info.qrImage; img.alt = 'UPI QR for ' + info.payeeName;
        qr.appendChild(img);
        var amt = document.createElement('div'); amt.className = 'amt2'; amt.textContent = '₹' + info.amount;
        var payee = document.createElement('div');
        payee.style.cssText = 'color:var(--sub);font-size:12px'; payee.textContent = info.payeeName;
        var vpa = document.createElement('div'); vpa.className = 'vpa'; vpa.textContent = info.vpa;
        var open = document.createElement('a');
        open.href = info.upiLink; open.textContent = 'Open in UPI app';
        open.style.cssText = 'display:inline-block;font-size:12.5px;margin-bottom:6px';
        var lab = document.createElement('label');
        lab.setAttribute('for', 'utr');
        lab.style.cssText = 'display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin-top:6px';
        lab.textContent = 'UPI reference / transaction ID';
        var utr = document.createElement('input');
        utr.type = 'text'; utr.id = 'utr'; utr.placeholder = 'e.g. 412345678901';
        var warn = document.createElement('div'); warn.className = 'warn';
        warn.textContent = 'Pay the exact amount from your own UPI app first. Submitting a reference does not activate the plan by itself: the team matches it against the payment record, and your tier turns on after that.';
        var go = document.createElement('button'); go.type = 'button'; go.className = 'cta';
        go.textContent = 'I have paid — submit reference';
        var out = document.createElement('div');

        go.addEventListener('click', function () {
          var ref = utr.value.trim();
          if (!/^[A-Za-z0-9]{6,25}$/.test(ref)) {
            out.className = 'warn';
            out.textContent = 'Enter a valid Transaction ID: 6 to 25 letters and numbers.';
            return;
          }
          go.disabled = true;
          fetch('/api/v2/assistant/submit-utr', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: me().userId, tier: plan.key, utr: ref })
          })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (d.error) { out.className = 'warn'; out.textContent = d.error; go.disabled = false; return; }
              out.className = 'ok'; out.textContent = d.message; utr.disabled = true;
            })
            .catch(function () {
              out.className = 'warn';
              out.textContent = 'Could not submit. Check your connection and try again.';
              go.disabled = false;
            });
        });

        [h, qr, amt, payee, vpa, open, lab, utr, warn, go, out].forEach(function (el) { box2.appendChild(el); });
      })
      .catch(function () { box2.textContent = 'Could not load payment details.'; });
  }

  /* ── tier ────────────────────────────────────────────────────────────── */
  (function refreshTier() {
    var id = me().userId;
    fetch('/api/v2/assistant/entitlement' + (id ? '?userId=' + encodeURIComponent(id) : ''))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        CURRENT = d.tier || 'starter';
        if (d.paywall) { renderPlans(d.paywall); }
        $('tierName').textContent = d.label || 'Starter';
        var m = d.limit === null ? 'Unlimited' : d.remaining + ' of ' + d.limit + ' left';
        $('tierMeter').textContent = m;
        $('meter').textContent = d.limit === null ? 'Unlimited messages'
          : d.remaining + ' of ' + d.limit + ' messages left this month';
      })
      .catch(function () {});
  })();

  /* ── sessions ────────────────────────────────────────────────────────
     Conversations live in this browser, keyed per student so two people on a
     shared machine never see each other's chats.

     Local, not server-side, on purpose: the sidebar has to be useful on the
     free tier, and server-side history is what the paid tiers actually buy -
     it survives a different browser, a cleared cache and a new device. This
     list does not. */
  var SKEY = 'ten.assistant.sessions.' + (me().userId || 'guest');
  var sessions = [];
  var currentId = null;

  function loadSessions() {
    try { sessions = JSON.parse(localStorage.getItem(SKEY) || '[]'); }
    catch (e) { sessions = []; }
    if (!Array.isArray(sessions)) { sessions = []; }
  }
  function saveSessions() {
    try { localStorage.setItem(SKEY, JSON.stringify(sessions.slice(0, 50))); }
    catch (e) { /* storage full or blocked; the chat still works */ }
  }
  function current() {
    return sessions.filter(function (s) { return s.id === currentId; })[0] || null;
  }

  /* A title from the first thing they said, because "Chat 3" tells nobody
     which conversation was which. */
  function titleFrom(text) {
    var t = String(text).replace(/\s+/g, ' ').trim();
    return t.length > 38 ? t.slice(0, 38) + '…' : t;
  }

  function renderSessions() {
    var box = $('sessions');
    box.innerHTML = '';
    if (!sessions.length) {
      var none = document.createElement('p');
      none.className = 'nochats';
      none.textContent = 'Your chats will appear here.';
      box.appendChild(none);
      return;
    }
    sessions.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'sess' + (s.id === currentId ? ' on' : '');

      var open = document.createElement('button');
      open.type = 'button';
      open.className = 'sess-open';
      open.textContent = s.title;
      open.title = s.title;
      open.addEventListener('click', function () { openSession(s.id); });

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'sess-del';
      del.setAttribute('aria-label', 'Delete chat: ' + s.title);
      del.innerHTML = '&times;';
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        sessions = sessions.filter(function (x) { return x.id !== s.id; });
        saveSessions();
        if (s.id === currentId) { newChat(); } else { renderSessions(); }
      });

      row.appendChild(open);
      row.appendChild(del);
      box.appendChild(row);
    });
  }

  function newChat() {
    currentId = null;
    log.innerHTML = '';
    showEmpty();
    renderSessions();
    $('app').classList.remove('mobile-open');
    box.focus();
  }

  function openSession(id) {
    var s = sessions.filter(function (x) { return x.id === id; })[0];
    if (!s) { return; }
    currentId = id;
    log.innerHTML = '';
    s.messages.forEach(function (m) { bubble(m.role === 'me' ? 'me' : 'ai', m.text); });
    renderSessions();
    follow(true);
    $('app').classList.remove('mobile-open');
  }

  function remember(role, text) {
    var s = current();
    if (!s) {
      s = { id: String(Date.now()), title: titleFrom(text), messages: [], updatedAt: Date.now() };
      currentId = s.id;
      sessions.unshift(s);
    }
    s.messages.push({ role: role, text: text });
    s.updatedAt = Date.now();
    // Most recent first, the order people actually look for.
    sessions.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
    saveSessions();
    renderSessions();
  }

  $('newChat').addEventListener('click', newChat);
  loadSessions();
  renderSessions();


  showEmpty();
  setTimeout(function () { box.focus(); }, 3000);
})();
</script>
</body>
</html>
