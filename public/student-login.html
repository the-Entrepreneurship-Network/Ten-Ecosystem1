<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal Sign In | TEN Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #050814;
      background-image: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 45%);
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .login-card {
      background: rgba(14, 20, 40, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.15);
      backdrop-filter: blur(10px);
    }
  </style>
  <link rel="stylesheet" href="/css/ten-brand.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-slate-100 p-4">

  <div class="w-full max-w-md">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-4 animate-pulse">
        <i class="fa-solid fa-graduation-cap text-3xl"></i>
      </div>
      <div class="text-xs uppercase tracking-widest text-emerald-400 font-extrabold mb-1">TEN Ecosystem</div>
      <h1 class="text-3xl font-black text-slate-100">Student Portal</h1>
      <p class="text-slate-400 text-sm mt-1.5">Sign in to manage your internships and portfolios.</p>
    </div>

    <!-- Login card -->
    <div class="login-card rounded-2xl p-8 shadow-2xl relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-emerald-500 to-transparent"></div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2">Email Address or Student ID</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input class="w-full pl-10 pr-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition duration-200" 
                   type="text" id="loginId" placeholder="e.g. TEN/WEB/1005 or your email" required autocapitalize="none">
          </div>
        </div>

        <div>
          <label class="block text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input class="w-full pl-10 pr-4 py-3 bg-slate-950/50 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition duration-200" 
                   type="password" id="password" placeholder="Enter your password" required>
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-slate-950 font-bold rounded-xl transition duration-300 shadow-lg shadow-emerald-500/10">
          Sign In to Portal
        </button>

        <div id="loadingText" class="hidden text-center text-xs text-emerald-400 animate-pulse mt-3">
          ⟳ Authenticating student workspace...
        </div>
      </form>
    </div>

    <!-- Navigation links -->
    <div class="flex items-center justify-center gap-4 text-xs text-slate-500 mt-6">
      <a href="/register" class="hover:text-emerald-400 transition">Register Account</a>
      <span>•</span>
      <a href="/" class="hover:text-emerald-400 transition">Back to Home</a>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const urlEmail = params.get("email");
      const savedEmail = sessionStorage.getItem("lastRegisteredEmail");
      const emailToUse = urlEmail || savedEmail;

      if (emailToUse) {
        const loginInput = document.getElementById("loginId");
        if (loginInput) {
          loginInput.value = emailToUse;
        }
      }
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const loading = document.getElementById("loadingText");
      loading.classList.remove("hidden");

      const loginIdInput = document.getElementById("loginId").value.trim();
      const password = document.getElementById("password").value;

      try {
        const isEmail = loginIdInput.includes("@");
        const payload = isEmail 
          ? { email: loginIdInput, password, role: "student" } 
          : { employeeId: loginIdInput, password, role: "student" };

        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        loading.classList.add("hidden");

        if (data.success) {
          const activeRole = data.role || "student";
          if (activeRole !== "student") {
            Swal.fire({
              icon: "error",
              title: "Unauthorized Role",
              text: `This portal is only for Students. Please sign in via the appropriate portal.`,
              background: "#0e1428",
              color: "#F0EEE8",
              confirmButtonColor: "#EF4444"
            });
            return;
          }

          localStorage.setItem("role", "student");
          if (data.sessionToken) {
            localStorage.setItem("sessionToken", data.sessionToken);
          }
          if (data.user) {
            localStorage.setItem("user", JSON.stringify(data.user));
            localStorage.setItem("userId", data.user._id);
          }
          if (data.student) {
            localStorage.setItem("employeeId", data.student.employeeId);
            localStorage.setItem("student", JSON.stringify(data.student));
            localStorage.setItem("ten_token", data.sessionToken || data.student.employeeId);
            localStorage.setItem("ten_employee_id", data.student.employeeId);
          }

          Swal.fire({
            icon: "success",
            title: "Access Granted",
            text: `Welcome to your Student Workspace! 🚀`,
            background: "#0e1428",
            color: "#F0EEE8",
            showConfirmButton: false,
            timer: 1500
          });

          setTimeout(() => {
            window.location.href = "/student-dashboard";
          }, 1500);

        } else {
          Swal.fire({
            icon: "error",
            title: "Login Failed",
            text: data.message || "Invalid credentials",
            background: "#0e1428",
            color: "#F0EEE8",
            confirmButtonColor: "#ef4444"
          });
        }
      } catch (error) {
        loading.classList.add("hidden");
        console.error(error);
        Swal.fire({
          icon: "error",
          title: "Network Error",
          text: "Something went wrong. Please check your connection and try again.",
          background: "#0e1428",
          color: "#F0EEE8",
          confirmButtonColor: "#ef4444"
        });
      }
    });
  </script>
  <script src="/password-toggle.js"></script>
  <script src="/forgot-password.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (window.TenForgotPassword) {
        TenForgotPassword.init({ role: "student" });
      }
    });
  </script>
</body>
</html>
