<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEN — Registration Successful</title>
<link rel="stylesheet" href="ten-theme.css">
<link rel="stylesheet" href="ten-motion.css">
<style>

html, body {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.success-wrap {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 24px;
  animation: ten-fadeUp 0.5s ease both;
}

.cred-card {
  background: var(--ten-card);
  border: 1px solid var(--ten-border);
  border-radius: var(--ten-r-xl);
  padding: 54px 56px;
  box-shadow: var(--ten-shadow-lg), var(--ten-glow-gold);
  position: relative;
  overflow: hidden;
  width: min(560px, calc(100vw - 48px));
}
.cred-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--ten-gold), transparent);
}

.brand-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--ten-gold-bg);
  border: 1px solid var(--ten-border);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--ten-gold);
  text-transform: uppercase;
  margin-bottom: 22px;
}

.success-icon {
  width: 80px; height: 80px;
  background: var(--ten-gold-bg);
  border: 1px solid var(--ten-border-strong);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  margin-bottom: 18px;
  animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  animation-delay: 0.2s;
}
@keyframes pop {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

h1 {
  font-family: var(--ten-font-display);
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--ten-text);
  margin-bottom: 10px;
}

.success-sub {
  font-size: 13px;
  color: var(--ten-text-sub);
  line-height: 1.8;
  margin-bottom: 26px;
}

.cred-list {
  display: grid;
  gap: 14px;
  text-align: left;
}

.cred-row {
  display: grid;
  grid-template-columns: 140px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 14px 14px;
  border: 1px solid var(--ten-border);
  border-radius: var(--ten-r-lg);
  background: rgba(255,255,255,0.02);
}

.cred-label {
  font-size: 11px;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--ten-text-muted);
  font-weight: 800;
}

.cred-value {
  font-family: var(--ten-font-mono);
  color: var(--ten-text);
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.copy-btn {
  padding: 10px 14px;
  border-radius: var(--ten-r-lg);
  border: 1px solid var(--ten-border-strong);
  background: rgba(255,255,255,0.03);
  color: var(--ten-text-sub);
  font-family: var(--ten-font-display);
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  white-space: nowrap;
}
.copy-btn:hover {
  transform: translateY(-1px);
  border-color: var(--ten-gold);
  background: rgba(212,175,55,0.08);
  color: var(--ten-gold);
}
.copy-btn:disabled {
  opacity: 0.75;
  cursor: default;
  transform: none;
}

.cred-note {
  margin-top: 14px;
  padding: 12px 14px;
  border: 1px solid var(--ten-border);
  border-radius: var(--ten-r-lg);
  background: rgba(212,175,55,0.06);
  color: var(--ten-text-sub);
  font-size: 12px;
  line-height: 1.7;
}

.continue-btn {
  width: 100%;
  margin-top: 20px;
  padding: 15px 16px;
  border: none;
  border-radius: var(--ten-r-lg);
  background: linear-gradient(135deg, var(--ten-gold), rgba(212,175,55,0.6));
  color: #0a0700;
  font-family: var(--ten-font-display);
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.continue-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(212,175,55,0.35);
}

@media (max-width: 560px) {
  .cred-card { padding: 42px 18px; }
  .cred-row { grid-template-columns: 1fr; }
  .copy-btn { width: 100%; }
}

</style>
  <link rel="stylesheet" href="/css/mobile.css">
  <script src="/mobile-nav.js" defer></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0e1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TEN">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>

<div class="ten-grid-bg"></div>
<div class="ten-orb ten-orb-1"></div>
<div class="ten-orb ten-orb-2"></div>

<div class="success-wrap">
  <div class="cred-card ten-scale-in">
    <div class="brand-tag">
      <svg width="14" height="12" viewBox="0 0 14 12" fill="none">
        <path d="M1 5C1 3.34 2.34 2 4 2C5.66 2 7 3.34 7 5C7 6.66 5.66 8 4 8C2.34 8 1 6.66 1 5Z" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
        <path d="M7 5C7 3.34 8.34 2 10 2C11.66 2 13 3.34 13 5C13 6.66 11.66 8 10 8C8.34 8 7 6.66 7 5Z" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
      </svg>
      TEN
    </div>

    <div class="success-icon ten-glow-pulse">✓</div>
    <h1>Registration Successful!</h1>
    <p class="success-sub">Your account is ready. Save these credentials before continuing.</p>

    <div class="cred-list ten-fadeUp">
      <div class="cred-row">
        <div class="cred-label">Employee ID</div>
        <div class="cred-value" id="credEmployeeId">—</div>
        <button class="copy-btn" id="copyEmployeeId" type="button">Copy</button>
      </div>
      <div class="cred-row">
        <div class="cred-label">Password</div>
        <div class="cred-value" id="credPassword">—</div>
        <button class="copy-btn" id="copyPassword" type="button">Copy</button>
      </div>
    </div>

    <div class="cred-note">
      These credentials were also sent to your email. Screenshot them before continuing.
    </div>

    <button class="continue-btn" id="continueBtn" type="button">Continue to Groups</button>
  </div>
</div>

<script>
function _fallbackCopy(text) {
  const t = document.createElement("textarea");
  t.value = text;
  t.style.position = "fixed";
  t.style.left = "-9999px";
  t.style.top = "0";
  document.body.appendChild(t);
  t.focus();
  t.select();
  try { document.execCommand("copy"); } catch (_) {}
  t.remove();
}

async function copyValue(btn, value) {
  if (!value) return;
  const original = btn.textContent;
  btn.textContent = "Copied!";
  btn.disabled = true;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(value);
    } else {
      _fallbackCopy(value);
    }
  } catch (_) {
    _fallbackCopy(value);
  } finally {
    setTimeout(() => {
      btn.textContent = original;
      btn.disabled = false;
    }, 900);
  }
}

const employeeId = sessionStorage.getItem("reg_employeeId") || "";
const password = sessionStorage.getItem("reg_password") || "";
document.getElementById("credEmployeeId").textContent = employeeId || "—";
document.getElementById("credPassword").textContent = password || "—";

document.getElementById("copyEmployeeId").addEventListener("click", () => copyValue(document.getElementById("copyEmployeeId"), employeeId));
document.getElementById("copyPassword").addEventListener("click", () => copyValue(document.getElementById("copyPassword"), password));

document.getElementById("continueBtn").addEventListener("click", () => {
  sessionStorage.removeItem("reg_employeeId");
  sessionStorage.removeItem("reg_password");
  const redirect = sessionStorage.getItem("redirectAfterSuccess") || "groups.html";
  sessionStorage.removeItem("redirectAfterSuccess");
  window.location.href = redirect;
});

(function confetti(){
  for(let i=0;i<60;i++){
    const d=document.createElement('div');
    d.style.cssText=`position:fixed;top:-10px;left:${Math.random()*100}vw;
      width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;
      background:hsl(${Math.random()*60+30},80%,60%);border-radius:${Math.random()>0.5?'50%':'2px'};
      animation:ten-particleRise ${2+Math.random()*3}s ${Math.random()*2}s linear forwards;
      transform:rotate(${Math.random()*360}deg);z-index:9999;pointer-events:none;`;
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),6000);
  }
})();
</script>

<script src="ten-motion.js"></script>
</body>
</html>
