<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEN Admin Portal</title>
<style>
/* ── Reset & Base ──────────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0f172a;
  color: #f1f5f9;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar ───────────────────────────────────────────────────── */
#sidebar {
  width: 240px;
  min-width: 240px;
  background: #1e293b;
  border-right: 1px solid #334155;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.sidebar-header {
  padding: 20px 18px 16px;
  border-bottom: 1px solid #334155;
}
.sidebar-header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
.sidebar-header p  { font-size: 11.5px; color: #64748b; margin-top: 3px; }
.role-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #1d4ed8;
  color: #bfdbfe;
  font-size: 11px;
  font-weight: 600;
  border-radius: 20px;
  padding: 3px 9px;
  margin-top: 10px;
}

nav { flex: 1; padding: 10px 0; }
.nav-section { padding: 6px 18px 3px; font-size: 10.5px; font-weight: 700; color: #475569; letter-spacing: 0.8px; text-transform: uppercase; margin-top: 6px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 18px;
  color: #94a3b8;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.1s, color 0.1s;
  font-size: 13.5px;
  user-select: none;
}
.nav-item:hover   { background: #263348; color: #e2e8f0; }
.nav-item.active  { background: #1d3461; color: #60a5fa; font-weight: 600; }
.nav-item .icon   { font-size: 15px; width: 20px; text-align: center; }
.nav-item .badge  {
  margin-left: auto;
  background: #ef4444;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  border-radius: 20px;
  padding: 2px 7px;
  min-width: 20px;
  text-align: center;
}

.sidebar-footer {
  padding: 14px 18px;
  border-top: 1px solid #334155;
}
.user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.avatar {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
}
.user-info-text .name  { font-size: 13px; font-weight: 600; }
.user-info-text .role  { font-size: 11px; color: #64748b; }
.btn-logout {
  width: 100%;
  background: #1e293b;
  border: 1px solid #334155;
  color: #94a3b8;
  border-radius: 7px;
  padding: 7px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.btn-logout:hover { background: #450a0a; color: #fca5a5; border-color: #ef4444; }

/* ── Main Content ──────────────────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  background: #1e293b;
  border-bottom: 1px solid #334155;
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.topbar h2 { font-size: 16px; font-weight: 600; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }

.content { flex: 1; overflow-y: auto; padding: 24px; }

/* ── Section ───────────────────────────────────────────────────── */
.section { display: none; }
.section.active { display: block; }

/* ── Cards & Stats ─────────────────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.stat-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 18px;
}
.stat-card .label { font-size: 12px; color: #64748b; font-weight: 500; margin-bottom: 6px; }
.stat-card .value { font-size: 28px; font-weight: 700; }
.stat-card .sub   { font-size: 11px; color: #475569; margin-top: 2px; }
.stat-card.red   .value { color: #f87171; }
.stat-card.green .value { color: #4ade80; }
.stat-card.blue  .value { color: #60a5fa; }
.stat-card.amber .value { color: #fbbf24; }

/* ── Tables ────────────────────────────────────────────────────── */
.card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 20px;
}
.card-header {
  padding: 14px 18px;
  border-bottom: 1px solid #334155;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.card-header h3 { font-size: 14px; font-weight: 600; }
.card-body { padding: 0; }
table { width: 100%; border-collapse: collapse; }
th {
  background: #0f172a;
  padding: 10px 14px;
  text-align: left;
  font-size: 11.5px;
  font-weight: 600;
  color: #64748b;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  white-space: nowrap;
}
td {
  padding: 11px 14px;
  border-top: 1px solid #1e293b;
  font-size: 13.5px;
  vertical-align: middle;
}
tr:nth-child(even) td { background: #162032; }
tr:hover td { background: #1d3461; }

.empty-row td { text-align: center; color: #475569; padding: 32px; }

/* ── Badges ────────────────────────────────────────────────────── */
.badge {
  display: inline-block;
  border-radius: 20px;
  padding: 2px 9px;
  font-size: 11px;
  font-weight: 600;
}
.badge-success  { background: #052e16; color: #4ade80; border: 1px solid #166534; }
.badge-warning  { background: #431407; color: #fb923c; border: 1px solid #9a3412; }
.badge-danger   { background: #450a0a; color: #f87171; border: 1px solid #991b1b; }
.badge-info     { background: #0c1a3a; color: #60a5fa; border: 1px solid #1d4ed8; }
.badge-neutral  { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

/* ── Buttons ───────────────────────────────────────────────────── */
.btn {
  border: none;
  border-radius: 7px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.1s, background 0.1s;
  white-space: nowrap;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary  { background: #3b82f6; color: #fff; }
.btn-success  { background: #16a34a; color: #fff; }
.btn-danger   { background: #dc2626; color: #fff; }
.btn-warning  { background: #d97706; color: #fff; }
.btn-neutral  { background: #334155; color: #cbd5e1; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 6px 10px; }

/* ── Forms & Inputs ────────────────────────────────────────────── */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: #94a3b8; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
input[type=text], input[type=email], input[type=password], select, textarea {
  width: 100%;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 9px 12px;
  color: #f1f5f9;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
  font-family: inherit;
}
input:focus, select:focus, textarea:focus { border-color: #3b82f6; }
select option { background: #1e293b; }
textarea { resize: vertical; min-height: 80px; }

/* ── Search & Filters ──────────────────────────────────────────── */
.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.filters input, .filters select { width: auto; flex: 1; min-width: 160px; max-width: 300px; }

/* ── Pagination ────────────────────────────────────────────────── */
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-top: 1px solid #334155;
  font-size: 13px;
  color: #64748b;
}
.pagination-btns { display: flex; gap: 6px; }

/* ── Modal / Dialog ────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  display: none;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 28px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 32px 64px rgba(0,0,0,0.6);
}
.modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 18px; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* ── Tabs ──────────────────────────────────────────────────────── */
.tabs { display: flex; gap: 0; border-bottom: 1px solid #334155; margin-bottom: 0; }
.tab-btn {
  padding: 10px 18px;
  background: none;
  border: none;
  color: #64748b;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: color 0.1s, border-color 0.1s;
}
.tab-btn:hover  { color: #e2e8f0; }
.tab-btn.active { color: #60a5fa; border-bottom-color: #3b82f6; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Toast ─────────────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 13px 18px;
  font-size: 13.5px;
  z-index: 200;
  max-width: 340px;
  transform: translateY(80px);
  opacity: 0;
  transition: transform 0.25s, opacity 0.25s;
}
#toast.show { transform: translateY(0); opacity: 1; }
#toast.success { border-color: #166534; color: #4ade80; }
#toast.error   { border-color: #991b1b; color: #f87171; }

/* ── Loading ───────────────────────────────────────────────────── */
.loading-row td { text-align: center; padding: 32px; color: #475569; }
.spinner-sm {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

.text-muted   { color: #64748b; }
.text-small   { font-size: 12px; }
.flex         { display: flex; }
.gap-8        { gap: 8px; }
.flex-wrap    { flex-wrap: wrap; }
.items-center { align-items: center; }
.mt-16        { margin-top: 16px; }
</style>
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────────────────── -->
<aside id="sidebar">
  <div class="sidebar-header">
    <h1>🛡 TEN Portal</h1>
    <p>Internal Management System</p>
    <div class="role-badge" id="roleBadge">Loading…</div>
  </div>

  <nav id="sidebarNav"></nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <div class="avatar" id="avatarInitial">?</div>
      <div class="user-info-text">
        <div class="name" id="footerUsername">–</div>
        <div class="role" id="footerRole">–</div>
      </div>
    </div>
    <button class="btn-logout" onclick="doLogout()">Sign Out</button>
  </div>
</aside>

<!-- ── Main ────────────────────────────────────────────────────── -->
<div id="main">
  <div class="topbar">
    <h2 id="pageTitle">Dashboard</h2>
    <div class="topbar-actions" id="topbarActions"></div>
  </div>
  <div class="content" id="content">
    <div id="loadingState" style="text-align:center;padding:80px;color:#475569;">Loading portal…</div>
  </div>
</div>

<!-- ── Toast ─────────────────────────────────────────────────────── -->
<div id="toast"></div>

<!-- ── Modals ─────────────────────────────────────────────────── -->
<div class="modal-backdrop" id="modal">
  <div class="modal" id="modalBox">
    <h3 id="modalTitle">Dialog</h3>
    <div id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════════ */
let SESSION = null;       // { user, role, level }
let currentSection = '';
let studentPage = 1, paymentPage = 1, certHistPage = 1, auditPage = 1, payAllPage = 1;

const ROLE_LABELS = {
  hr_1: 'Associate HR',       hr_2: 'HR Support',
  hr_3: 'HR Verifier',        hr_4: 'HR Finance',
  hr_5: 'Account Manager',    hr_6: 'Coordinator Lead',
  hr_7: 'Comms Lead',         hr_8: 'HR Head',
  admin: 'Admin',             founder: 'Founder'
};

/* ════════════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════════════ */
let toastTimer;
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type === 'success' ? 'success' : type === 'error' ? 'error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3500);
}

/* ════════════════════════════════════════════════════════════════
   API HELPER
══════════════════════════════════════════════════════════════════ */
async function api(path, opts = {}) {
  const res = await fetch('/api/admin-internal' + path, {
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts
  });
  if (res.status === 401) { window.location.href = '/ten-admin/login?timeout=1'; throw new Error('session expired'); }
  return res.json();
}

/* ════════════════════════════════════════════════════════════════
   MODAL HELPER
══════════════════════════════════════════════════════════════════ */
function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = footerHtml;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

/* ════════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════════ */
async function init() {
  try {
    const data = await api('/session-check');
    if (!data.success) { window.location.href = '/ten-admin/login'; return; }
    SESSION = { user: data.user, role: data.role, level: data.level };
    buildSidebar();
    document.getElementById('loadingState').remove();
    // Restore saved section or default to overview
    const saved = sessionStorage.getItem('adminSection') || 'overview';
    showSection(saved);
  } catch (e) {
    window.location.href = '/ten-admin/login';
  }
}

/* ════════════════════════════════════════════════════════════════
   SIDEBAR BUILDER
══════════════════════════════════════════════════════════════════ */
const NAV = [
  { section: 'overview',      label: 'Overview',         icon: '📊', minLevel: 1 },
  { section: 'students',      label: 'Students',         icon: '👥', minLevel: 1 },
  { section: 'payments',      label: 'Payments',         icon: '💳', minLevel: 2 },
  { section: 'certificates',  label: 'Certificates',     icon: '📜', minLevel: 2 },
  { section: 'coordinators',  label: 'Coordinators',     icon: '🗂', minLevel: 6 },
  { section: 'broadcast',     label: 'Broadcast',        icon: '📣', minLevel: 7 },
  { section: 'audit',         label: 'Audit Log',        icon: '🔍', minLevel: 8 },
  { section: 'hrs',           label: 'HR Accounts',      icon: '👤', minLevel: 9 },
  { section: 'admins',        label: 'Admin Accounts',   icon: '🔑', minLevel: 10 },
  { section: 'system',        label: 'System Info',      icon: '⚙️', minLevel: 1 },
];

function buildSidebar() {
  const lv = SESSION.level;
  const roleLabel = ROLE_LABELS[SESSION.role] || SESSION.role;

  document.getElementById('roleBadge').textContent = `${roleLabel} · Level ${lv}`;
  document.getElementById('footerUsername').textContent = SESSION.user;
  document.getElementById('footerRole').textContent = roleLabel;
  document.getElementById('avatarInitial').textContent = SESSION.user[0].toUpperCase();

  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  NAV.filter(n => lv >= n.minLevel).forEach(n => {
    const el = document.createElement('div');
    el.className = 'nav-item';
    el.id = 'nav-' + n.section;
    el.dataset.section = n.section;
    el.innerHTML = `<span class="icon">${n.icon}</span>${n.label}`;
    el.onclick = () => showSection(n.section);
    nav.appendChild(el);
  });
}

/* ════════════════════════════════════════════════════════════════
   SECTION ROUTER
══════════════════════════════════════════════════════════════════ */
const SECTION_TITLES = {
  overview: 'Dashboard Overview', students: 'Students', payments: 'Payments',
  certificates: 'Certificates', coordinators: 'Coordinators', broadcast: 'Broadcast Notifications',
  audit: 'Audit Log', hrs: 'HR Accounts', admins: 'Admin Accounts', system: 'System Info'
};

async function showSection(name) {
  if (SESSION && SESSION.level < (NAV.find(n => n.section === name)?.minLevel || 99)) {
    toast('You do not have permission to view this section.', 'error');
    return;
  }
  currentSection = name;
  sessionStorage.setItem('adminSection', name);

  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + name);
  if (navEl) navEl.classList.add('active');

  document.getElementById('pageTitle').textContent = SECTION_TITLES[name] || name;

  const content = document.getElementById('content');
  // Clear topbar actions
  document.getElementById('topbarActions').innerHTML = '';

  // Render section
  switch (name) {
    case 'overview':     await renderOverview(content); break;
    case 'students':     await renderStudents(content); break;
    case 'payments':     await renderPayments(content); break;
    case 'certificates': await renderCertificates(content); break;
    case 'coordinators': await renderCoordinators(content); break;
    case 'broadcast':    renderBroadcast(content); break;
    case 'audit':        await renderAudit(content); break;
    case 'hrs':          await renderHRs(content); break;
    case 'admins':       await renderAdmins(content); break;
    case 'system':       await renderSystem(content); break;
  }
}

/* ════════════════════════════════════════════════════════════════
   OVERVIEW
══════════════════════════════════════════════════════════════════ */
async function renderOverview(c) {
  c.innerHTML = '<div class="loading-row"><table><tr><td>Loading stats…</td></tr></table></div>';
  const data = await api('/stats');
  if (!data.success) { c.innerHTML = '<p class="text-muted">Failed to load stats.</p>'; return; }
  const d = data.data;
  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card blue"><div class="label">Total Students</div><div class="value">${d.totalStudents}</div><div class="sub">${d.newRegistrationsToday} joined today</div></div>
      <div class="stat-card"><div class="label">HR Accounts</div><div class="value">${d.totalHRs}</div></div>
      <div class="stat-card"><div class="label">Coordinators</div><div class="value">${d.totalCoordinators}</div></div>
      <div class="stat-card green"><div class="label">Active Today</div><div class="value">${d.activeToday}</div><div class="sub">attendance marked</div></div>
      <div class="stat-card amber"><div class="label">Pending Payments</div><div class="value">${d.pendingPayments}</div><div class="sub">awaiting verification</div></div>
      <div class="stat-card amber"><div class="label">Pending Certs</div><div class="value">${d.pendingCertRequests}</div><div class="sub">awaiting HR</div></div>
      <div class="stat-card red"><div class="label">Locked Accounts</div><div class="value">${d.lockedAccounts}</div></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>Domain Breakdown</h3></div>
      <div class="card-body">
        <table>
          <thead><tr><th>Domain</th><th>Students</th></tr></thead>
          <tbody>${d.domainBreakdown.length ? d.domainBreakdown.map(x =>
            `<tr><td>${esc(x.domain)}</td><td>${x.count}</td></tr>`).join('') :
            '<tr class="empty-row"><td colspan="2">No data</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}

/* ════════════════════════════════════════════════════════════════
   STUDENTS
══════════════════════════════════════════════════════════════════ */
let studentSearch = '', studentDomain = '';
async function renderStudents(c) {
  c.innerHTML = `
    <div class="card">
      <div class="card-header">
        <h3>Students</h3>
        <div class="filters">
          <input type="text" id="stuSearch" placeholder="Search name / ID / email…" value="${esc(studentSearch)}" oninput="studentSearch=this.value" onkeydown="if(event.key==='Enter')loadStudents()">
          <input type="text" id="stuDomain" placeholder="Domain filter" value="${esc(studentDomain)}" oninput="studentDomain=this.value" onkeydown="if(event.key==='Enter')loadStudents()">
          <button class="btn btn-primary btn-sm" onclick="loadStudents()">Search</button>
        </div>
      </div>
      <div class="card-body">
        <table><thead><tr>
          <th>Employee ID</th><th>Name</th><th>Domain</th><th>Tenure</th>
          <th>Locked</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="studentTbody"><tr class="loading-row"><td colspan="7">Loading…</td></tr></tbody></table>
      </div>
      <div class="pagination">
        <span id="stuInfo">–</span>
        <div class="pagination-btns">
          <button class="btn btn-neutral btn-sm" onclick="stuPrev()">← Prev</button>
          <button class="btn btn-neutral btn-sm" onclick="stuNext()">Next →</button>
        </div>
      </div>
    </div>`;
  await loadStudents();
}

let stuTotal = 0;
async function loadStudents() {
  const tbody = document.getElementById('studentTbody');
  if (!tbody) return;
  tbody.innerHTML = '<tr class="loading-row"><td colspan="7">Loading…</td></tr>';

  stuTotal = data.total || 0;
  const lv = SESSION.level;
  tbody.innerHTML = data.data && data.data.length ? data.data.map(s => `
    <tr>
      <td><span class="text-small text-muted">${esc(s.employeeId)}</span></td>

          ${lv >= 5 && s.isLockedOut ? `<button class="btn btn-success btn-sm" onclick="unlockStudent('${s._id}','${esc(s.name)}')">Unlock</button>` : ''}

function renderBroadcast(c) {
  c.innerHTML = `<div class="card" style="max-width:600px">
    <div class="card-header"><h3>Send Broadcast Notification</h3></div>
    <div class="card-body" style="padding:20px">
      <div class="form-group">
        <label>Target</label>
        <select id="bTarget">
          <option value="all">All Students</option>
          <option value="domain">By Domain</option>
          <option value="student">Specific Student (by Employee ID)</option>
        </select>
      </div>
      <div class="form-group" id="bDomainGroup" style="display:none">
        <label>Domain</label>
        <input type="text" id="bDomain" placeholder="e.g. DevOps, Design…">
      </div>
      <div class="form-group" id="bEmpGroup" style="display:none">
        <label>Employee ID</label>
        <input type="text" id="bEmpId" placeholder="e.g. TEN-0001">
      </div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="bTitle" placeholder="Notification title">
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea id="bMsg" placeholder="Notification message…"></textarea>
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="bType">
          <option value="info">Info</option>
          <option value="success">Success</option>
          <option value="warning">Warning</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="sendBroadcast()">Send Notification</button>
      <div id="bResult" style="margin-top:12px"></div>
    </div>
  </div>`;
  document.getElementById('bTarget').addEventListener('change', function() {
    document.getElementById('bDomainGroup').style.display = this.value === 'domain' ? '' : 'none';
    document.getElementById('bEmpGroup').style.display   = this.value === 'student' ? '' : 'none';
  });
}

async function sendBroadcast() {
  const payload = {
    title: document.getElementById('bTitle').value,
    message: document.getElementById('bMsg').value,
    type: document.getElementById('bType').value,
    targetType: document.getElementById('bTarget').value,
    targetDomain: document.getElementById('bDomain')?.value,
    targetEmployeeId: document.getElementById('bEmpId')?.value
  };
  const data = await api('/notifications/broadcast', { method:'POST', body: JSON.stringify(payload) });
  const res = document.getElementById('bResult');
  if (data.success) {
    res.innerHTML = `<span class="badge badge-success">Sent to ${data.sent} student(s).</span>`;
    toast('Broadcast sent.', 'success');
  } else {
    res.innerHTML = `<span class="badge badge-danger">${esc(data.error||'Error')}</span>`;
    toast(data.error||'Error', 'error');
  }
}

      <tbody id="auditTbody"><tr class="loading-row"><td colspan="4">Loading…</td></tr></tbody></table>
    </div>
    <div class="pagination">
      <span id="auditInfo">–</span>
      <div class="pagination-btns">
        <button class="btn btn-neutral btn-sm" onclick="auditPrev()">← Prev</button>
        <button class="btn btn-neutral btn-sm" onclick="auditNext()">Next →</button>
      </div>
    </div>
  </div>`;
  if (SESSION.level >= 8) {
    document.getElementById('topbarActions').innerHTML =
      `<button class="btn btn-warning btn-sm" onclick="recalcAttendance()">Recalculate Attendance</button>`;
  }
  await loadAudit();
}

let auditTotal = 0;
async function loadAudit() {
  const tbody = document.getElementById('auditTbody');
  if (!tbody) return;
  tbody.innerHTML = '<tr class="loading-row"><td colspan="4">Loading…</td></tr>';
  const params = new URLSearchParams({ page: auditPage });
  const af = document.getElementById('auditAction');
  if (af && af.value) params.set('actionType', af.value);
  const data = await api('/audit-log?' + params);
  auditTotal = data.total || 0;
  tbody.innerHTML = data.data && data.data.length ? data.data.map(l => `
    <tr>
      <td class="text-small">${fmtDate(l.createdAt)}</td>
      <td><span class="badge badge-info">${esc(l.actionType||'–')}</span></td>
      <td class="text-small text-muted">${esc(l.performedBy||'–')}</td>
      <td class="text-small">${esc(l.description||'–')}</td>
    </tr>`).join('') : '<tr class="empty-row"><td colspan="4">No log entries.</td></tr>';
  const info = document.getElementById('auditInfo');
  if (info) info.textContent = `${auditTotal} total · page ${auditPage}`;
}
function auditPrev() { if (auditPage>1) { auditPage--; loadAudit(); } }
function auditNext() { if (auditPage*50<auditTotal) { auditPage++; loadAudit(); } }

async function recalcAttendance() {
  if (!confirm('Recalculate attendance for ALL students? This may take a moment.')) return;
  const data = await api('/attendance/recalculate-all', { method:'POST', body:'{}' });
  toast(data.success ? `Updated ${data.updated} students (${data.errors} errors).` : (data.error||'Error'), data.success?'success':'error');
}

/* HR level definitions — used for the level-card layout */
const HR_LEVEL_INFO = [
  { role:'hr_1', label:'Associate HR',     color:'#3b82f6', perms:'View students & system stats (read-only)' },
  { role:'hr_2', label:'HR Support',       color:'#6366f1', perms:'View payments & certificates (read-only)' },
  { role:'hr_3', label:'HR Verifier',      color:'#8b5cf6', perms:'Approve / reject certificate requests' },
  { role:'hr_4', label:'HR Finance',       color:'#a855f7', perms:'Verify / reject payments, export CSV' },
  { role:'hr_5', label:'Account Manager',  color:'#ec4899', perms:'Edit students, reset student passwords' },
  { role:'hr_6', label:'Coordinator Lead', color:'#f43f5e', perms:'Manage coordinators, reset their passwords' },
  { role:'hr_7', label:'Comms Lead',       color:'#f97316', perms:'Send broadcast notifications' },
  { role:'hr_8', label:'HR Head',          color:'#eab308', perms:'View audit log, recalculate attendance' },
];

async function renderHRs(c) {
  c.innerHTML = '<div style="padding:20px;color:#475569">Loading…</div>';
  document.getElementById('topbarActions').innerHTML =
    `<button class="btn btn-primary btn-sm" onclick="openCreateHR()">+ Create HR</button>`;
  await loadHRs(c);
}

async function loadHRs(c) {
  if (!c) c = document.getElementById('content');
  const data = await api('/hrs');
  const hrs = data.data || [];

  /* Group accounts by role */
  const byRole = {};
  HR_LEVEL_INFO.forEach(l => { byRole[l.role] = []; });
  hrs.forEach(hr => {
    if (byRole[hr.role]) byRole[hr.role].push(hr);
    else byRole['hr_1'].push(hr);
  });

  const levelCards = HR_LEVEL_INFO.map((info, i) => {
    const accounts = byRole[info.role];
    const count    = accounts.length;
    return `
    <div style="border:1px solid #334155;border-radius:10px;overflow:hidden;margin-bottom:10px;">
      <!-- Level header row -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#1e293b;">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="background:${info.color}22;border:1px solid ${info.color}55;color:${info.color};
                      border-radius:8px;min-width:38px;height:38px;display:flex;align-items:center;
                      justify-content:center;font-weight:700;font-size:15px;flex-shrink:0">L${i+1}</div>
          <div>
            <div style="font-weight:700;color:#e2e8f0;font-size:14px">${info.label}
              <span style="font-size:11px;color:#475569;font-weight:400;margin-left:6px">${info.role}</span>
            </div>
            <div style="font-size:12px;color:#64748b;margin-top:2px">${info.perms}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span style="background:#0f172a;border:1px solid #334155;color:${count?'#94a3b8':'#475569'};
                       border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600">
            ${count} account${count !== 1 ? 's' : ''}
          </span>
          <button class="btn btn-primary btn-sm" onclick="openCreateHR('${info.role}')">+ Add</button>
        </div>
      </div>
      <!-- Accounts under this level -->
      ${accounts.length ? `
      <div style="background:#0f172a;padding:8px 12px;display:flex;flex-direction:column;gap:6px;">
        ${accounts.map(hr => `
          <div style="display:flex;align-items:center;justify-content:space-between;
                      background:#1e293b;border:1px solid #334155;border-radius:7px;padding:8px 14px;">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:30px;height:30px;border-radius:50%;background:${info.color}22;
                          border:1px solid ${info.color}55;display:flex;align-items:center;
                          justify-content:center;color:${info.color};font-weight:700;font-size:12px">
                ${esc((hr.username||'?')[0].toUpperCase())}
              </div>
              <div>
                <div style="font-weight:600;color:#e2e8f0;font-size:13px">${esc(hr.username||'–')}</div>
                <div style="font-size:11.5px;color:#64748b">${esc(hr.name||'')}${hr.email ? ' · '+esc(hr.email) : ''}</div>
              </div>
            </div>
            <div class="flex gap-8">
              <button class="btn btn-neutral btn-sm" onclick="openChangeHRLevel('${hr._id}','${esc(hr.username)}','${esc(hr.role)}')">Change Level</button>
              <button class="btn btn-warning btn-sm" onclick="resetHRPw('${hr._id}','${esc(hr.username)}')">Reset PW</button>
              <button class="btn btn-danger btn-sm" onclick="deleteHR('${hr._id}','${esc(hr.username)}')">Delete</button>
            </div>
          </div>`).join('')}
      </div>` : ''}
    </div>`;
  }).join('');

  c.innerHTML = `
    <div class="card">
      <div class="card-header">
        <h3>HR Accounts — ${hrs.length} total · 8 levels</h3>
        <p class="text-small text-muted" style="margin-top:4px">Each level inherits all permissions from levels below it</p>
      </div>
      <div class="card-body" style="padding:12px 16px">
        ${levelCards}
      </div>
    </div>`;
}

function openCreateHR(preselectedRole) {
  openModal('Create HR Account', `
    <div class="form-group"><label>Username</label><input type="text" id="hrUser" placeholder="username"></div>
    <div class="form-group"><label>Email</label><input type="email" id="hrEmail" placeholder="email@example.com"></div>
    <div class="form-group"><label>Full Name</label><input type="text" id="hrName" placeholder="Full name"></div>
    <div class="form-group"><label>Password (min 8 chars)</label><input type="password" id="hrPw" placeholder="Password"></div>
    <div class="form-group"><label>Level</label>
      <select id="hrRole">${HR_LEVEL_INFO.map(info =>
        `<option value="${info.role}" ${info.role===(preselectedRole||'hr_1')?'selected':''}>
          ${info.role} — ${info.label}</option>`).join('')}</select></div>`, `
    <button class="btn btn-neutral" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="confirmCreateHR()">Create</button>`);
}
async function confirmCreateHR() {
  const body = {
    username: document.getElementById('hrUser').value,
    email: document.getElementById('hrEmail').value,
    name: document.getElementById('hrName').value,
    password: document.getElementById('hrPw').value,
    role: document.getElementById('hrRole').value
  };
  const data = await api('/hrs', { method:'POST', body: JSON.stringify(body) });
  closeModal();
  toast(data.success ? 'HR account created.' : (data.error||'Error'), data.success?'success':'error');
  if (data.success) loadHRs();
}

function openChangeHRLevel(id, username, currentRole) {
  openModal(`Change Level — ${username}`, `
    <div class="form-group"><label>New Level</label>
      <select id="hrNewRole">${['hr_1','hr_2','hr_3','hr_4','hr_5','hr_6','hr_7','hr_8'].map(r =>
        `<option value="${r}" ${r===currentRole?'selected':''}>${r} — ${ROLE_LABELS[r]}</option>`).join('')}</select></div>`, `
    <button class="btn btn-neutral" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="confirmChangeHRLevel('${id}')">Save</button>`);
}
async function confirmChangeHRLevel(id) {
  const role = document.getElementById('hrNewRole').value;
  const data = await api('/hrs/'+id+'/level', { method:'PATCH', body: JSON.stringify({ role }) });
  closeModal();
  toast(data.success ? 'Level updated.' : (data.error||'Error'), data.success?'success':'error');
  if (data.success) loadHRs();
}

function resetHRPw(id, username) {
  openModal(`Reset Password — ${username}`, `
    <div class="form-group"><label>New Password (min 8 chars)</label>
    <input type="password" id="hrResetPw" placeholder="New password"></div>`, `
    <button class="btn btn-neutral" onclick="closeModal()">Cancel</button>
    <button class="btn btn-warning" onclick="confirmResetHRPw('${id}')">Reset</button>`);
}
async function confirmResetHRPw(id) {
  const pw = document.getElementById('hrResetPw').value;
  const data = await api('/hrs/'+id+'/reset-password', { method:'POST', body: JSON.stringify({ newPassword: pw }) });
  closeModal();
  toast(data.success ? 'Password reset.' : (data.error||'Error'), data.success?'success':'error');
}

async function deleteHR(id, username) {
  if (!confirm(`Delete HR account "${username}"? This cannot be undone.`)) return;
  const data = await api('/hrs/'+id, { method:'DELETE' });
  toast(data.success ? 'HR account deleted.' : (data.error||'Error'), data.success?'success':'error');
  if (data.success) loadHRs();
}

/* ════════════════════════════════════════════════════════════════
   UTILITIES
══════════════════════════════════════════════════════════════════ */
function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return '–';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }) + ' ' +
         dt.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12: true });
}

function statusBadge(status) {
  const map = {
    success: ['badge-success','Approved'], failed: ['badge-danger','Rejected'],
    pending_verification: ['badge-warning','Pending'], pending: ['badge-warning','Pending']
  };
  const [cls, label] = map[status] || ['badge-neutral', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

   intercept admin portal navigations or API calls. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}
