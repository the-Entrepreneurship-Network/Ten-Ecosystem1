<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password — TEN</title>
<link rel="stylesheet" href="ten-theme.css">
<link rel="stylesheet" href="ten-motion.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
html,body { height:100%; }
body { display:flex; align-items:center; justify-content:center; padding:24px; }
.wrap { position:relative; z-index:2; width:100%; max-width:460px; animation: ten-fadeUp .65s ease both; }
.logo-section { text-align:center; margin-bottom:28px; }
.logo-badge { display:inline-flex; align-items:center; justify-content:center; width:72px; height:72px;
  background: linear-gradient(135deg, var(--ten-gold), var(--ten-gold-dim)); border-radius:20px;
  font-size:32px; margin-bottom:14px; box-shadow:0 0 40px rgba(212,175,55,0.4);
  animation: ten-pulse-gold 2.5s ease-in-out infinite; }
.logo-title { font-family:var(--ten-font-display); font-size:22px; font-weight:800; letter-spacing:-.5px; color:var(--ten-text); }
.logo-title span { background:linear-gradient(90deg,var(--ten-gold),var(--ten-gold-light)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.logo-sub { font-size:11px; color:var(--ten-text-muted); margin-top:5px; letter-spacing:2px; text-transform:uppercase; }
.card { background:var(--ten-card); border:1px solid var(--ten-border); border-radius:var(--ten-r-xl);
  padding:36px; box-shadow:var(--ten-shadow-lg), var(--ten-glow-gold); position:relative; overflow:hidden; }
.card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--ten-gold),var(--ten-gold-dim),transparent); }
.card-title { font-family:var(--ten-font-display); font-size:22px; font-weight:700; margin-bottom:6px; }
.card-sub { font-size:13px; color:var(--ten-text-sub); margin-bottom:24px; }
.form-group { margin-bottom:18px; }
.form-group label { display:block; font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--ten-text-sub); margin-bottom:8px; }
.form-group input { width:100%; padding:13px 16px; background:rgba(255,255,255,0.03); border:1px solid var(--ten-border); border-radius:var(--ten-r-sm); color:var(--ten-text); font-family:var(--ten-font-body); font-size:14.5px; outline:none; transition:all .2s; }
.form-group input:focus { border-color:var(--ten-gold); box-shadow:0 0 0 3px rgba(212,175,55,0.10); }
.btn { width:100%; padding:14px; border:none; border-radius:var(--ten-r-sm); background:linear-gradient(135deg,var(--ten-gold),var(--ten-gold-dim)); color:#0a0600; font-weight:800; letter-spacing:.5px; cursor:pointer; font-family:var(--ten-font-body); font-size:14.5px; }
.btn:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(212,175,55,.35); }
.btn:disabled { opacity:.65; cursor:not-allowed; transform:none; box-shadow:none; }
.role-pill { display:inline-block; padding:4px 12px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:.5px; background:rgba(212,175,55,.12); color:var(--ten-gold); border:1px solid rgba(212,175,55,.3); margin-left:8px; text-transform:capitalize; }
.error-msg { color:#f43f5e; font-size:13px; margin-top:10px; display:none; }
.helper { font-size:12px; color:var(--ten-text-muted); margin-top:6px; }
.back-link { text-align:center; margin-top:18px; }
.back-link a { color:var(--ten-text-sub); font-size:13px; text-decoration:none; }
.back-link a:hover { color:var(--ten-gold); }
</style>
</head>
<body>
<div class="ten-grid-bg"></div>
<div class="ten-orb ten-orb-1"></div>
<div class="ten-orb ten-orb-2"></div>

<div class="wrap">
  <div class="logo-section">
    <div class="logo-badge ten-float">🔐</div>
    <div class="logo-title"><span>TEN</span> Password Reset</div>
    <div class="logo-sub">Set a new password for your account</div>
  </div>

  <div class="card">
    <div class="card-title">Reset password <span class="role-pill" id="rolePill">—</span></div>
    <p class="card-sub">Choose a strong new password (at least 8 characters).</p>

    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="Enter new password">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat the new password">
    </div>
    <button class="btn" id="submitBtn" onclick="doReset()">Update Password</button>
    <div class="error-msg" id="err"></div>
    <div class="helper">If your link has expired, request a new one from the login page.</div>
  </div>

  <div class="back-link"><a href="/index.html">← Back to Main Portal</a></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token") || "";
const role  = (params.get("role") || "").toLowerCase();
const validRoles = ["student","coordinator","hr"];

document.getElementById("rolePill").textContent = role || "—";

if(!token || !validRoles.includes(role)){
  document.getElementById("submitBtn").disabled = true;
  showErr("This reset link is invalid or incomplete.");
}

function showErr(m){ const el=document.getElementById("err"); el.textContent=m; el.style.display="block"; }
function clearErr(){ document.getElementById("err").style.display="none"; }

async function doReset(){
  clearErr();
  const np = document.getElementById("newPassword").value;
  const cp = document.getElementById("confirmPassword").value;
  if(np.length < 8) return showErr("New password must be at least 8 characters.");
  if(np !== cp)     return showErr("Passwords do not match.");

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Updating...";
  try{
    const r = await fetch("/auth/reset-password", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ token, role, newPassword: np })
    });
    const d = await r.json();
    if(d.success){
      const target = role === "student" ? "/login.html"
                   : role === "coordinator" ? "/coordinator-login.html"
                   : "/hr-login";
      Swal.fire({
        icon:"success", title:"Password updated!",
        text:"Redirecting to login...",
        background:"#0c1220", color:"#f0eee8", confirmButtonColor:"#f5c542",
        timer:2400, showConfirmButton:false
      }).then(()=>{ window.location.href = target; });
    } else {
      showErr(d.message || "Failed to reset password");
      btn.disabled = false; btn.textContent = "Update Password";
    }
  }catch(e){
    showErr("Network error. Please try again.");
    btn.disabled = false; btn.textContent = "Update Password";
  }
}

document.addEventListener("keydown", e => { if(e.key === "Enter") doReset(); });
</script>
<script src="ten-motion.js"></script>
<script src="/password-toggle.js"></script>
</body>
</html>
