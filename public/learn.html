<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEN LLM Portal — learn, prove it, get certified</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/mobile.css">
<style>
:root{--bg:#05070e;--surface:#090d1a;--card:#0e1428;--gold:#D4AF37;--gold-soft:rgba(212,175,55,.1);
  --text:#F0EEE8;--muted:#9a9080;--dim:#4E4840;--green:#10b981;--red:#ef4444;--blue:#3b82f6;
  --border:rgba(212,175,55,.14);--border-strong:rgba(212,175,55,.34);--radius:16px;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 460px at 50% -12%,rgba(212,175,55,.09),transparent 62%);}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:26px 20px 80px;}
h1{font-family:'Outfit',sans-serif;font-size:clamp(26px,4.6vw,40px);font-weight:900;letter-spacing:-.02em;}
h2{font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;margin-bottom:4px;}
.sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin-top:10px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:26px;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Outfit',sans-serif;font-weight:800;font-size:15px;letter-spacing:.04em;}
.brand span{color:var(--gold);}
.who{font-size:13px;color:var(--muted);}
/* color:inherit, because a <button> does NOT inherit it — it takes the UA's
   `buttontext`, which is black. The module cards and topic rows are buttons, so
   every title on this page was rendering black on a black card. */
button,.btn{font-family:inherit;color:inherit;font-weight:800;font-size:13.5px;border-radius:11px;cursor:pointer;
  padding:11px 18px;min-height:44px;border:1px solid transparent;transition:all .2s;text-decoration:none;display:inline-block;}
.pri{background:var(--gold);color:#05070e;}
.pri:hover{filter:brightness(1.08);}
.sec{background:transparent;border-color:var(--border-strong);color:#e2c766;}
.sec:hover{background:var(--gold-soft);}
.ghost{background:none;border:none;color:var(--muted);font-weight:600;min-height:auto;padding:6px 2px;}
button:disabled{opacity:.45;cursor:not-allowed;}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
.note{padding:13px 16px;border-radius:12px;font-size:13.5px;line-height:1.55;margin:14px 0;
  background:var(--gold-soft);border:1px solid var(--border-strong);color:#e8d9a8;}
.note.bad{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:#fecaca;}
.note.good{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3);color:#a7f3d0;}
input,textarea{width:100%;padding:12px 14px;border-radius:11px;min-height:46px;background:#0b1222;
  border:1px solid var(--border);color:var(--text);font-size:15px;font-family:inherit;}
textarea{min-height:110px;resize:vertical;line-height:1.6;}
input:focus,textarea:focus{outline:none;border-color:var(--border-strong);}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;font-weight:700;}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:11px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px;}
.tlist{margin-top:18px;display:flex;flex-direction:column;gap:8px;}
.t{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;background:var(--card);
  border:1px solid var(--border);text-align:left;width:100%;font-weight:400;min-height:auto;}
.t:disabled{opacity:.42;}
.t .n{flex:0 0 30px;height:30px;border-radius:8px;background:var(--gold-soft);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.t .ti{flex:1;font-size:14.5px;font-weight:600;}
.t .st{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;}
.t.done .st{color:var(--green);} .t.shut .st{color:var(--red);} .t.now{border-color:var(--border-strong);}
.diff{font-size:10px;color:var(--dim);letter-spacing:.1em;}
.prose{line-height:1.75;font-size:15px;color:#ded6c4;white-space:pre-wrap;}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;
  color:var(--gold);margin-bottom:8px;}
.vid{aspect-ratio:16/9;width:100%;border-radius:12px;border:1px solid var(--border);margin-top:8px;background:#000;}
.vrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:11px;}
.vcount{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--dim);}
.q{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:17px;margin-bottom:12px;}
.q .qp{font-size:14.5px;line-height:1.6;margin-bottom:11px;font-weight:600;}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:14px;line-height:1.5;}
.opt:hover{background:rgba(255,255,255,.03);}
.opt input{width:auto;min-height:auto;margin-top:3px;}
.cam{position:fixed;right:16px;bottom:16px;z-index:50;width:190px;border-radius:13px;overflow:hidden;
  border:2px solid var(--border-strong);background:#000;box-shadow:0 10px 34px rgba(0,0,0,.6);}
.cam video{width:100%;display:block;}
.cam .lbl{font-size:10.5px;padding:5px 9px;background:rgba(0,0,0,.75);color:var(--muted);
  display:flex;justify-content:space-between;gap:6px;}
.cam.warn{border-color:var(--red);}
.timer{font-family:'Outfit',sans-serif;font-weight:800;font-size:19px;color:var(--gold);}
.timer.low{color:var(--red);}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}

/* ── sitting a paper ─────────────────────────────────────────────────────
   The timer has to be visible from any question, and on a phone the submit
   button was a scroll away at the bottom of thirty questions. */
.exambar{position:sticky;top:0;z-index:20;display:flex;align-items:flex-start;justify-content:space-between;
  gap:12px;flex-wrap:wrap;padding:14px 16px 18px;margin:-8px -4px 0;border-radius:0 0 16px 16px;
  background:rgba(9,13,26,.94);backdrop-filter:blur(10px);border:1px solid var(--border);border-top:none;}
.exam-t{font-family:'Outfit',sans-serif;font-size:17px;font-weight:900;}
.exam-s{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700;}
.exam-p{flex:1 0 100%;height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;}
.exam-p i{display:block;height:100%;background:var(--gold);transition:width .35s;}
.q.answered{border-color:rgba(16,185,129,.32);}
.qp{user-select:none;-webkit-user-select:none;}
.submitbar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-top:20px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  background:rgba(9,13,26,.94);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:16px 16px 0 0;}
.submitbar .pri{flex:1 1 200px;}
body.sitting #fx{display:none;}     /* nothing moving behind an exam */

/* ── a stop, explained ── */
.stop{margin-top:22px;text-align:center;}
.stop.bad{border-color:rgba(239,68,68,.28);}
.stop-i{font-size:38px;line-height:1;margin-bottom:12px;}
.stop .vrow{justify-content:center;}

.hidden{display:none!important;}

/* ══ the 3D layer ═════════════════════════════════════════════════════════
   Hand-rolled, because a backdrop and a ring of cards do not need a library.
   The field is a canvas with real perspective (x/z, y/z); the chooser is CSS
   preserve-3d, which keeps every card a real, clickable, focusable button —
   the thing a canvas would have taken away. */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;}
.wrap{position:relative;z-index:1;}

/* ── the domain chooser: a coverflow, not a carousel of one ── */
.pickwrap{margin-top:26px;}
.stage{position:relative;height:310px;perspective:1200px;perspective-origin:50% 45%;
  touch-action:pan-y;user-select:none;overflow:hidden;}
/* Half the card's own width, computed from the same expression — min() of two
   negatives picks the MORE negative, so `min(-130px,-36vw)` pushed the whole
   coverflow 460px off-centre on a desktop. */
.dcard{position:absolute;top:50%;left:50%;width:min(260px,72vw);
  margin:-125px 0 0 calc(min(260px,72vw) * -0.5);
  height:250px;padding:22px 20px;border-radius:20px;text-align:left;font-weight:400;
  background:linear-gradient(160deg,#131c36,#0a1024);border:1px solid var(--border);
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.22,.9,.28,1),opacity .45s,border-color .3s;
  box-shadow:0 26px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;justify-content:space-between;}
.dcard.on{border-color:var(--border-strong);box-shadow:0 30px 70px rgba(212,175,55,.16),0 24px 60px rgba(0,0,0,.6);}
.dcard.off{opacity:0;pointer-events:none;}
.dcard .code{font-family:'Outfit',sans-serif;font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:800;}
.dcard .nm{font-family:'Outfit',sans-serif;font-size:23px;font-weight:900;line-height:1.15;letter-spacing:-.02em;}
.dcard .cnt{font-size:12.5px;color:var(--muted);}
.dcard .yours{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--green);}
.dcard .soon{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--dim);}
.glow{position:absolute;inset:auto 0 -30px 0;height:120px;pointer-events:none;
  background:radial-gradient(60% 100% at 50% 0,rgba(212,175,55,.18),transparent 70%);}
.picknav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px;}
.picknav .arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--border-strong);
  background:rgba(212,175,55,.06);color:var(--gold);font-size:17px;line-height:1;padding:0;}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:280px;}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.16);transition:all .3s;}
.dots i.on{background:var(--gold);width:20px;border-radius:3px;}

/* ── the module screen: the run in 3D ── */
.pathbox{position:relative;margin-top:20px;border-radius:18px;overflow:hidden;
  border:1px solid var(--border);background:linear-gradient(170deg,#0a1024,#070b16);}
#path{display:block;width:100%;height:190px;}
.pathlabel{position:absolute;left:18px;top:14px;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;font-weight:800;color:var(--dim);}
.pct{position:absolute;right:18px;top:12px;text-align:right;}
.pct b{font-family:'Outfit',sans-serif;font-size:30px;font-weight:900;color:var(--gold);line-height:1;}
.pct span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:3px;}

/* ── motion: everything arrives, nothing jumps ── */
.rise{opacity:0;transform:translateY(14px);animation:rise .5s cubic-bezier(.2,.8,.3,1) forwards;}
@keyframes rise{to{opacity:1;transform:none;}}
.bar i{transition:width .9s cubic-bezier(.2,.8,.3,1);}
.t{transition:border-color .2s,transform .2s,background .2s;}
.t:not(:disabled):hover{transform:translateX(3px);border-color:var(--border-strong);}
.t.now{box-shadow:0 0 0 1px var(--border-strong),0 10px 30px rgba(212,175,55,.09);}
.t.now .n{animation:beat 2.4s ease-in-out infinite;}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.35);}50%{box-shadow:0 0 0 7px rgba(212,175,55,0);}}

@media (max-width:560px){.wrap{padding:18px 14px 70px;}.cam{width:128px;right:10px;bottom:10px;}
  .stage{height:280px;} .dcard{height:228px;margin-top:-114px;}}
@media (prefers-reduced-motion:reduce){
  .t,.dcard{transition:none;} .t:hover{transform:none;}
  .rise{opacity:1;transform:none;animation:none;} .bar i{transition:none;}
  .t.now .n{animation:none;} #fx{display:none;}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top">
    <div class="brand">TEN <span>LLM PORTAL</span></div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="who" id="who"></span>
      <button class="ghost hidden" id="signOut">Sign out</button>
    </div>
  </div>
  <div id="view"></div>
</div>

<!-- The proctor. Mounted only while an exam is open. -->
<div class="cam hidden" id="cam">
  <video id="camVideo" autoplay muted playsinline></video>
  <div class="lbl"><span>Proctored</span><span id="camState">watching</span></div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const view = $('view');
const esc = (v) => String(v == null ? '' : v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const api = async (path, opts) => {
  const r = await fetch('/api/v2/learn' + path, Object.assign({
    credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }
  }, opts || {}));
  let d = null; try { d = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, d: d || {} };
};
let me = null;

/* ── sign in / sign up ─────────────────────────────────────────────────── */
function authScreen(mode) {
  const up = mode === 'up';
  view.innerHTML = `
    <h1>${up ? 'Create your learning account' : 'Sign in to the LLM Portal'}</h1>
    <p class="sub">The LLM Portal has its own account, separate from the internship portal.
       ${up ? 'Sign up, unlock the course, and every domain module opens.' : ''}</p>
    <div class="card" style="max-width:440px;margin-top:22px;">
      <div id="authMsg"></div>
      ${up ? '<label for="nm">Your name</label><input id="nm" autocomplete="name">' : ''}
      <label for="em">Email</label><input id="em" type="email" autocomplete="email">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="${up ? 'new-password' : 'current-password'}">
      ${up ? '<div style="font-size:11.5px;color:var(--dim);margin-top:6px;">At least 8 characters.</div>' : ''}
      <button class="pri" id="go" style="width:100%;margin-top:18px;">${up ? 'Create account' : 'Sign in'}</button>
      <button class="ghost" id="swap" style="width:100%;margin-top:12px;">
        ${up ? 'I already have an account — sign in' : 'New here? Create an account'}</button>
    </div>`;
  $('swap').onclick = () => authScreen(up ? 'in' : 'up');
  const submit = async () => {
    const btn = $('go'); btn.disabled = true;
    const body = { email: $('em').value.trim(), password: $('pw').value };
    if (up) body.name = $('nm').value.trim();
    const { ok, d } = await api(up ? '/signup' : '/login', { method: 'POST', body: JSON.stringify(body) });
    btn.disabled = false;
    if (!ok) { $('authMsg').innerHTML = '<div class="note bad">' + esc(d.message || 'That did not work.') + '</div>'; return; }
    me = d; boot();
  };
  $('go').onclick = submit;
  ['em','pw','nm'].forEach((id) => { const el = $(id); if (el) el.onkeydown = (e) => { if (e.key === 'Enter') submit(); }; });
}

/* ── where you land ────────────────────────────────────────────────────────
   Not a menu of fifteen. A learner buys ONE course: either they have picked
   their domain, in which case the portal IS that module, or they have not, and
   the only thing to do here is pick it. */
async function home() {
  const { d } = await api('/curriculum');
  if (!d.courseOpen) { lockedScreen(d); return; }
  if (d.chosen) { moduleScreen(d.chosen, d); return; }
  chooseScreen(d);
}

function accessNote(d) {
  return d.via === 'deferred'
    ? `<div class="note">You chose to pay after completion — everything below is open.
         Your certificate waits for the fee, nothing else does.</div>`
    : d.via === 'tenure'
      ? `<div class="note good">Open with your paid internship track.</div>`
      : `<div class="note good">Unlocked — this is yours.</div>`;
}

function lockedScreen(d) {
  view.innerHTML = `
    <h1 class="rise">The Academic Portal</h1>
    <p class="sub rise" style="animation-delay:.06s">Twenty-one topics in your domain, a proctored exam after
       every one of them, a two-hour final, and a certificate that can be verified.</p>
    <div class="note rise" style="animation-delay:.12s">This is not unlocked on your account yet.
      <a href="/studio.html?want=course" class="btn pri" style="margin-left:10px;">See what it includes →</a></div>`;
}

/* ── choosing your domain ──────────────────────────────────────────────────
   A coverflow rather than a ring: fifteen cards on a circle need a radius no
   phone has. Here the chosen card faces you, its neighbours turn away in real
   3D, and every one of them stays a focusable button — which is exactly what a
   canvas version would have cost. */
let pick = { list: [], i: 0 };

function chooseScreen(d) {
  const ready = d.modules.filter((m) => m.ready);
  const rest = d.modules.filter((m) => !m.ready);
  pick.list = ready.concat(rest);
  pick.i = Math.max(0, pick.list.findIndex((m) => m.slug === d.suggested));
  if (pick.i < 0) pick.i = 0;

  view.innerHTML = `
    <h1 class="rise">Choose your domain</h1>
    <p class="sub rise" style="animation-delay:.06s">One domain, one module, twenty-one topics. This is the
       course you will be examined on and the domain your certificate will name, so pick the one you
       actually want${d.suggested ? ' — we have started you on your internship domain' : ''}.</p>
    ${accessNote(d)}
    <div class="pickwrap rise" style="animation-delay:.12s">
      <div class="stage" id="stage">${pick.list.map((m, i) => `
        <button class="dcard" data-i="${i}" ${m.ready ? '' : 'disabled'}>
          <div>
            <div class="code">${esc(m.shortCode || '')}</div>
            ${m.slug === d.suggested ? '<div class="yours" style="margin-top:6px;">YOUR INTERNSHIP DOMAIN</div>' : ''}
          </div>
          <div>
            <div class="nm">${esc(m.name)}</div>
            <div class="cnt" style="margin-top:8px;">${m.topicCount} topics · exam after each</div>
            ${m.ready ? '' : '<div class="soon" style="margin-top:8px;">CONTENT COMING</div>'}
          </div>
        </button>`).join('')}
        <div class="glow"></div>
      </div>
      <div class="picknav">
        <button class="arrow" id="prev" aria-label="Previous domain">‹</button>
        <div class="dots" id="dots">${pick.list.map(() => '<i></i>').join('')}</div>
        <button class="arrow" id="next" aria-label="Next domain">›</button>
      </div>
      <div id="pickMsg"></div>
      <button class="pri" id="take" style="width:100%;margin-top:16px;">Start this domain</button>
      <p class="sub" style="font-size:12.5px;">You can change this while you have not passed a topic yet.
         After that it is fixed — the certificate names it.</p>
    </div>`;

  const stage = $('stage');
  layoutPick();
  $('prev').onclick = () => movePick(-1);
  $('next').onclick = () => movePick(1);
  stage.querySelectorAll('[data-i]').forEach((b) => {
    b.onclick = () => { const i = +b.dataset.i; if (i === pick.i) takeDomain(); else { pick.i = i; layoutPick(); } };
  });
  document.onkeydown = (e) => {
    if (e.key === 'ArrowLeft') movePick(-1);
    else if (e.key === 'ArrowRight') movePick(1);
  };
  // Swipe. A coverflow you cannot drag on a phone is a coverflow with two arrows.
  let x0 = null;
  stage.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) movePick(dx < 0 ? 1 : -1);
    x0 = null;
  });
  $('take').onclick = takeDomain;
}

function movePick(step) {
  pick.i = Math.min(pick.list.length - 1, Math.max(0, pick.i + step));
  layoutPick();
}

/** Position every card relative to the active one. Depth is real: cards behind
 *  are further away and turned, not merely smaller. */
function layoutPick() {
  const cards = view.querySelectorAll('.dcard');
  cards.forEach((c, i) => {
    const o = i - pick.i;
    const a = Math.abs(o);
    c.classList.toggle('on', o === 0);
    c.classList.toggle('off', a > 2);
    c.setAttribute('aria-hidden', a > 2 ? 'true' : 'false');
    c.tabIndex = a > 2 ? -1 : 0;
    const x = o * 84, z = -a * 230, ry = -o * 40, sc = 1 - a * 0.16;
    c.style.transform = `translateX(${x}%) translateZ(${z}px) rotateY(${ry}deg) scale(${sc})`;
    c.style.zIndex = String(50 - a);
    c.style.opacity = a > 2 ? '0' : String(1 - a * 0.55);
    // Depth of field. Without it the cards behind read their titles straight
    // across the front one at the same size — worse than no 3D at all.
    c.style.filter = a === 0 ? 'none' : `blur(${a * 3}px) brightness(${1 - a * 0.5})`;
  });
  const dots = $('dots');
  if (dots) dots.querySelectorAll('i').forEach((n, i) => n.classList.toggle('on', i === pick.i));
  const take = $('take');
  const m = pick.list[pick.i];
  if (take && m) {
    take.disabled = !m.ready;
    take.textContent = m.ready ? 'Start ' + m.name : m.name + ' is not ready yet';
  }
}

async function takeDomain() {
  const m = pick.list[pick.i];
  if (!m || !m.ready) return;
  $('take').disabled = true;
  const { ok, d } = await api('/domain', { method: 'POST', body: JSON.stringify({ slug: m.slug }) });
  $('take').disabled = false;
  if (!ok) { $('pickMsg').innerHTML = '<div class="note bad">' + esc(d.message || 'Could not set that.') + '</div>'; return; }
  document.onkeydown = null;
  moduleScreen(m.slug);
}

/* ── your module ───────────────────────────────────────────────────────────
   There is no "all modules" any more: this IS the portal for whoever is signed
   in. The only way back is switching domain, and only while nothing has been
   passed. */
async function moduleScreen(slug, cur) {
  const { ok, status, d } = await api('/module/' + encodeURIComponent(slug));
  if (status === 402) { home(); return; }
  if (status === 409 || status === 403) { home(); return; }
  if (!ok) { view.innerHTML = '<div class="note bad">Could not open your module.</div>'; return; }

  const settled = d.topics.filter((t) => t.passedAt || t.closedByHR).length;
  const pct = d.topics.length ? Math.round(settled / d.topics.length * 100) : 0;
  const canSwitch = cur ? cur.canSwitch : settled === 0 && !d.finalPassed;
  view.innerHTML = `
    <div class="hd rise">
      <div><span class="tag">YOUR DOMAIN</span><h1>${esc(d.name)}</h1>
        <p class="sub">${settled} of ${d.topics.length} topics settled${d.finalPassed ? ' · final passed' : ''}.</p></div>
      ${canSwitch ? '<button class="ghost" id="switch">Change domain</button>' : ''}
    </div>
    <div class="pathbox rise" style="animation-delay:.06s">
      <canvas id="path" aria-hidden="true"></canvas>
      <div class="pathlabel">Your run</div>
      <div class="pct"><b id="pctN">0%</b><span>settled</span></div>
    </div>
    ${d.proctorHold ? `<div class="note bad">Your exams are on hold —
       HR is reviewing the camera warnings from topic ${d.proctorHold.topicN || 'final'}.
       You will get an email with the decision.</div>` : ''}
    <div class="tlist">${d.topics.map((t) => `
      <button class="t rise ${t.passedAt ? 'done' : ''} ${t.closedByHR ? 'shut' : ''} ${t.open && !t.passedAt && !t.closedByHR ? 'now' : ''}"
              style="animation-delay:${Math.min(0.5, 0.1 + t.n * 0.022)}s"
              data-n="${t.n}" ${t.open ? '' : 'disabled'}>
        <span class="n">${t.n}</span>
        <span class="ti">${esc(t.title)}<br><span class="diff">DIFFICULTY ${t.difficulty}/5</span></span>
        <span class="st">${t.passedAt ? 'passed' : t.closedByHR ? 'closed' : t.open ? 'open' : 'locked'}</span>
      </button>`).join('')}</div>
    <div class="card" style="margin-top:22px;">
      <h2>Final exam</h2>
      <p class="sub">Two hours, every topic, ${d.finalPassed ? '' : 'opens when all topics are settled.'}</p>
      ${d.finalPassed ? '<div class="note good">Final passed.</div>'
        : `<button class="pri" id="final" style="margin-top:12px;" ${d.finalOpen ? '' : 'disabled'}>Start the final</button>`}
    </div>
    ${d.finalPassed ? `<div class="card" style="margin-top:14px;">
      <h2>Your big project</h2>
      <p class="sub">Optional — build something real with what you learned, or skip straight to the certificate.</p>
      ${d.project && (d.project.doneAt || d.project.skippedAt)
        ? `<div class="note good">${d.project.doneAt ? 'Project submitted.' : 'Project skipped.'}</div>`
        : `<label for="purl">Link to your project</label><input id="purl" placeholder="https://github.com/you/project">
           <label for="pnote">Anything we should know</label><textarea id="pnote"></textarea>
           <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">
             <button class="pri" id="psub">Submit project</button>
             <button class="sec" id="pskip">Skip the project</button></div>`}
      <div style="margin-top:18px;border-top:1px solid var(--border);padding-top:18px;">
        <h2>Certificate</h2>
        <div id="certMsg"></div>
        <button class="pri" id="cert" style="margin-top:10px;">Download my certificate</button>
      </div></div>` : ''}`;

  document.onkeydown = null;      // the chooser's arrow keys leave with it
  drawPath(d.topics);
  countUp($('pctN'), pct);
  if ($('switch')) $('switch').onclick = async () => {
    // ?choose=1 asks for the whole list back. The server refuses it once a topic
    // has been passed, which is the same rule the button is shown under.
    const { ok, d: cd } = await api('/curriculum?choose=1');
    if (!ok) { alert(cd.message || 'You have already started this domain.'); return; }
    chooseScreen(cd);
  };
  view.querySelectorAll('[data-n]').forEach((b) => { b.onclick = () => topicScreen(slug, +b.dataset.n); });
  if ($('final')) $('final').onclick = () => startExam(slug, 0);
  if ($('psub')) $('psub').onclick = async () => {
    const r = await api('/module/' + slug + '/project', { method: 'POST',
      body: JSON.stringify({ url: $('purl').value.trim(), note: $('pnote').value }) });
    if (!r.ok) { alert(r.d.message || 'Could not submit that.'); return; }
    moduleScreen(slug);
  };
  if ($('pskip')) $('pskip').onclick = async () => {
    await api('/module/' + slug + '/project', { method: 'POST', body: JSON.stringify({ skip: true }) });
    moduleScreen(slug);
  };
  if ($('cert')) $('cert').onclick = async () => {
    const r = await fetch('/api/v2/learn/module/' + slug + '/certificate', { credentials: 'same-origin' });
    if (r.ok) { window.location = '/api/v2/learn/module/' + slug + '/certificate'; return; }
    let msg = 'Not ready yet.'; try { msg = (await r.json()).message || msg; } catch (e) {}
    $('certMsg').innerHTML = '<div class="note">' + esc(msg)
      + (r.status === 402 ? ' <a class="btn sec" href="/studio.html" style="margin-left:8px;">Settle it →</a>' : '') + '</div>';
  };
}

/* ── your run, in perspective ──────────────────────────────────────────────
   Twenty-one topics on a curve receding into the screen: projected with real
   perspective (x/z, y/z), not a flat row scaled down. Gold behind you, a
   pulsing ring where you are, dim ahead.

   ponytail: a picture, not a control — the list below it is what you click.
   Hit-testing a canvas would be a second set of buttons to keep in step with
   the first, for nothing the list does not already do. */
function drawPath(topics) {
  const cv = $('path');
  if (!cv || !topics.length) return;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ctx = cv.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  let w = 0, h = 0, t0 = null, raf = 0;

  function size() {
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function frame(now) {
    if (t0 === null) t0 = now;
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, w, h);
    const n = topics.length;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1 || 1);
      // A gentle S through space, drifting so the run feels alive.
      const x3 = (u - 0.5) * 3.15;
      const y3 = Math.sin(u * Math.PI * 1.6 + (still ? 0 : t * 0.35)) * 0.26;
      const z3 = 2.6 - Math.cos(u * Math.PI * 1.15) * 0.72;
      const k = 1 / z3;                       // the projection, in one character
      // 0.54, not 0.5: the curve rises before it falls, so a true centre line
      // pushes the whole run into the top half and leaves dead space below.
      pts.push({ x: w / 2 + x3 * k * w * 0.52, y: h * 0.54 - y3 * k * h * 0.95, k, t: topics[i] });
    }
    // The thread first, so the nodes sit on top of it.
    ctx.lineWidth = 1.4;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const done = a.t.passedAt || a.t.closedByHR;
      ctx.strokeStyle = done ? 'rgba(212,175,55,.55)' : 'rgba(255,255,255,.09)';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    for (const p of pts) {
      const done = p.t.passedAt, shut = p.t.closedByHR;
      const here = p.t.open && !done && !shut;
      const r = Math.max(2.2, p.k * 6.4);
      if (here && !still) {
        const pulse = (Math.sin(t * 2.6) + 1) / 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, r + 4 + pulse * 7, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(212,175,55,' + (0.20 - pulse * 0.15).toFixed(3) + ')';
        ctx.fill();
      }
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = done ? '#D4AF37' : shut ? 'rgba(239,68,68,.75)'
        : here ? '#F0EEE8' : 'rgba(255,255,255,.16)';
      ctx.fill();
    }
    if (!still) raf = requestAnimationFrame(frame);
  }

  size();
  if (still) { frame(0); } else { raf = requestAnimationFrame(frame); }
  const onResize = () => { size(); if (still) frame(0); };
  window.addEventListener('resize', onResize);
  // The canvas dies with the screen it belongs to; nothing else holds a
  // reference, so stopping when it leaves the document is enough.
  const stop = setInterval(() => {
    if (document.body.contains(cv)) return;
    cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); clearInterval(stop);
  }, 2000);
}

/** A number that arrives rather than appears. */
function countUp(el, to) {
  if (!el) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = to + '%'; return; }
  const start = performance.now(), ms = 900;
  const step = (now) => {
    const k = Math.min(1, (now - start) / ms);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + '%';
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ── the field behind everything ───────────────────────────────────────────
   Points on a slowly turning cylinder, projected the same honest way. Costs
   about forty lines and no dependency; absent entirely under reduced-motion. */
(function field() {
  const cv = $('fx');
  if (!cv || matchMedia('(prefers-reduced-motion: reduce)').matches) { if (cv) cv.remove(); return; }
  const ctx = cv.getContext('2d');
  const dpr = Math.min(1.5, window.devicePixelRatio || 1);
  const N = window.innerWidth < 560 ? 130 : 260;
  const pts = [];
  for (let i = 0; i < N; i++) {
    pts.push({ a: Math.random() * Math.PI * 2, r: 0.6 + Math.random() * 0.9,
               y: Math.random() * 2 - 1, s: 0.6 + Math.random() * 0.7 });
  }
  let w = 0, h = 0, raf = 0, lean = 0, leanTo = 0;

  function size() {
    w = window.innerWidth; h = window.innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function frame(now) {
    const t = now / 1000;
    lean += (leanTo - lean) * 0.05;
    ctx.clearRect(0, 0, w, h);
    for (const p of pts) {
      const a = p.a + t * 0.055 * p.s + lean;
      const x3 = Math.cos(a) * p.r, z3 = Math.sin(a) * p.r + 2.6;
      if (z3 < 0.35) continue;
      const k = 1 / z3;
      const x = w / 2 + x3 * k * w * 0.62;
      const y = h / 2 + p.y * k * h * 0.62;
      const r = k * 1.7;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(212,175,55,' + Math.min(0.5, k * 0.34).toFixed(3) + ')';
      ctx.fill();
    }
    raf = requestAnimationFrame(frame);
  }

  size();
  window.addEventListener('resize', size);
  window.addEventListener('pointermove', (e) => { leanTo = (e.clientX / window.innerWidth - 0.5) * 0.5; });
  // A background that keeps painting in a hidden tab is a background that eats
  // a battery for no one to see.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) raf = requestAnimationFrame(frame);
  });
  raf = requestAnimationFrame(frame);
})();

/* ── one topic: read, watch, then the exam ─────────────────────────────── */
async function topicScreen(slug, n) {
  const { ok, d } = await api('/module/' + encodeURIComponent(slug) + '/topic/' + n);
  if (!ok) { view.innerHTML = '<div class="note bad">' + esc(d.message || 'Locked.') + '</div>'; return; }
  const t = d.topic;
  /*
   * `youtube.com/embed?listType=search&list=…` is a form YouTube withdrew: it
   * answers "Error 153 — video player configuration error", which is what two
   * thirds of these topics were showing. Only ids are ever embedded now, and
   * when there is no id at all the page says so and hands over a search rather
   * than staging a player that cannot work.
   */
  const vids = Array.isArray(t.videoIds) ? t.videoIds : (t.videoId ? [t.videoId] : []);
  let vidAt = 0;
  const searchUrl = 'https://www.youtube.com/results?search_query='
    + encodeURIComponent(t.videoSearch || t.title);
  const embed = (id) => 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id)
    + '?rel=0&modestbranding=1';

  view.innerHTML = `
    <button class="ghost" id="back">← ${esc(d.moduleName || slug)}</button>
    <h1 class="rise" style="margin-top:8px;">${t.n}. ${esc(t.title)}</h1>
    <p class="sub">Difficulty ${t.difficulty} of 5</p>
    <div class="card" style="margin-top:18px;">
      <div class="tag">The technical explanation</div>
      <div class="prose">${esc(t.technical)}</div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="tag">In simple terms</div>
      <div class="prose">${esc(t.simple)}</div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="tag">Watch this before the exam</div>
      ${vids.length ? `
        <iframe class="vid" id="vframe" src="${esc(embed(vids[0]))}" title="Video for ${esc(t.title)}"
          allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <div class="vrow">
          <span class="vcount" id="vcount">Video 1 of ${vids.length}</span>
          ${vids.length > 1 ? '<button class="sec" id="vnext">Not playing? Show another →</button>' : ''}
          <a class="sec btn" href="${esc(searchUrl)}" target="_blank" rel="noopener">Search YouTube for this topic ↗</a>
        </div>`
      : `<div class="note">No video is pinned to this topic yet. Open a search for it — any one of the
           results counts, and the reading above is the part the exam is set from.</div>
         <div class="vrow">
           <a class="pri btn" href="${esc(searchUrl)}" target="_blank" rel="noopener">Find a video for this topic ↗</a>
         </div>`}
      ${d.videoDoneAt ? '<div class="note good">Video marked as watched.</div>'
        : `<div class="note">The exam unlocks once you have watched it through.</div>
           <button class="sec" id="vdone">I have watched the whole video</button>`}
    </div>
    <div class="card" style="margin-top:14px;">
      <h2>Topic exam</h2>
      <p class="sub">Section 1 — 10 written answers marked by AI. Section 2 — 10 multiple choice.
         Camera on throughout; three warnings and it stops.</p>
      ${d.passedAt ? '<div class="note good">Passed.</div>'
        : d.closedByHR ? '<div class="note bad">Closed by HR. Carry on to the next topic.</div>'
        : `<button class="pri" id="exam" style="margin-top:12px;" ${d.videoDoneAt ? '' : 'disabled'}>Start the exam</button>`}
    </div>`;
  $('back').onclick = () => moduleScreen(slug);
  // "Show another" steps through the pool and wraps, so a learner who is not
  // being served by one video is never stuck with it.
  if ($('vnext')) $('vnext').onclick = () => {
    vidAt = (vidAt + 1) % vids.length;
    $('vframe').src = embed(vids[vidAt]);
    $('vcount').textContent = 'Video ' + (vidAt + 1) + ' of ' + vids.length;
  };
  if ($('vdone')) $('vdone').onclick = async () => {
    // The player is cross-origin so its true position is unreadable; the claim
    // plus a minimum dwell is the honest ceiling here.
    await api('/module/' + slug + '/topic/' + n + '/video-done',
      { method: 'POST', body: JSON.stringify({ playedSeconds: 999 }) });
    topicScreen(slug, n);
  };
  if ($('exam')) $('exam').onclick = () => startExam(slug, n);
}

/* ── the proctor ───────────────────────────────────────────────────────── *
 * The camera must be live for the exam to run. Warnings fire when the face
 * leaves the frame, the tab is hidden, or the stream stops — three and the
 * attempt is void and HR is asked to review.
 * ponytail: brightness-variance heuristic, not face recognition — it catches
 * an empty seat and a covered lens. Swap in FaceDetector where supported if
 * false positives ever bite.
 */
let proctor = null;
async function startProctor(attemptId, onVoid) {
  const cam = $('cam'), video = $('camVideo'), state = $('camState');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 }, audio: false });
  } catch (e) { return null; }
  video.srcObject = stream;
  cam.classList.remove('hidden');

  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 48;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let warnings = 0, cooling = 0, dead = false;

  const warn = async (reason) => {
    if (dead || Date.now() < cooling) return;
    cooling = Date.now() + 6000;   // one warning per six seconds, not per frame
    cam.classList.add('warn');
    const { d } = await api('/exam/' + attemptId + '/warning', { method: 'POST', body: JSON.stringify({ reason }) });
    warnings = d.warningCount || warnings + 1;
    state.textContent = 'warning ' + warnings + ' of 3';
    setTimeout(() => cam.classList.remove('warn'), 2500);
    if (d.voided) { dead = true; stopProctor(); onVoid(d.message); }
  };

  const tick = setInterval(() => {
    if (dead) return;
    if (document.hidden) { warn('left the exam tab'); return; }
    if (!stream.active || !video.videoWidth) { warn('camera stopped'); return; }
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const px = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let sum = 0, sq = 0, n = 0;
    for (let i = 0; i < px.length; i += 16) { const v = px[i]; sum += v; sq += v * v; n++; }
    const mean = sum / n, variance = sq / n - mean * mean;
    // A covered lens or an empty, flat scene: almost no variation in the frame.
    if (variance < 60) warn('nobody visible in frame');
    else state.textContent = warnings ? 'warning ' + warnings + ' of 3' : 'watching';
  }, 3000);

  proctor = { stop: () => { clearInterval(tick); stream.getTracks().forEach((t) => t.stop());
                            cam.classList.add('hidden'); proctor = null; } };
  return proctor;
}
function stopProctor() { if (proctor) proctor.stop(); }

/* ── sitting an exam ───────────────────────────────────────────────────── */

/**
 * A stop, explained.
 *
 * Every one of these used to be one bare sentence on an otherwise empty black
 * page — no heading, no way on, nothing saying whether it was the learner's
 * fault or ours. Same three parts every time now: what happened, what it means
 * for them, and the button that does the next thing.
 */
function examStop(slug, { icon, title, body, retry, bad }) {
  view.innerHTML = `
    <div class="card stop rise ${bad ? 'bad' : ''}">
      <div class="stop-i" aria-hidden="true">${icon}</div>
      <h1>${esc(title)}</h1>
      <p class="sub">${body}</p>
      <div class="vrow" style="margin-top:18px;">
        ${retry ? '<button class="pri" id="retry">Try again</button>' : ''}
        <button class="sec" id="back">← Back to my module</button>
      </div>
    </div>`;
  $('back').onclick = () => moduleScreen(slug);
  if ($('retry')) $('retry').onclick = retry;
}

async function startExam(slug, topicN) {
  view.innerHTML = '<div class="card rise"><h1>Setting your paper…</h1>'
    + '<p class="sub">Your questions are written fresh for this attempt, so no two sittings are the same. '
    + 'This takes a few seconds.</p></div>';
  const { ok, status, d } = await api('/exam/start',
    { method: 'POST', body: JSON.stringify({ slug, topicN }) });
  if (!ok) {
    const offline = status === 503;
    examStop(slug, {
      icon: status === 423 ? '⏸' : offline ? '⏳' : '✕',
      bad: !offline,
      title: status === 423 ? 'Your exams are on hold'
        : offline ? 'The examiner is busy' : 'Could not start the exam',
      body: esc(d.message || 'Could not start.')
        + (offline ? ' <br><br>Nothing has been counted against you and no attempt has been used — '
                     + 'the paper simply was not written. Try again, and tell your coordinator if it keeps happening.' : ''),
      retry: offline ? () => startExam(slug, topicN) : null
    });
    return;
  }

  const started = await startProctor(d.attemptId, (msg) => {
    examStop(slug, { icon: '⛔', bad: true, title: 'This attempt has been stopped',
      body: esc(msg) + '<br><br>HR has been notified and will email you the decision. '
        + 'If they approve it you can sit the exam again; if not, your course carries on at the next topic.' });
  });
  if (!started) {
    stopProctor();
    examStop(slug, { icon: '📷', bad: true, title: 'The camera has to be on',
      body: 'This exam is proctored, so it cannot start without the camera. Allow camera access in your '
        + 'browser — the padlock beside the address bar — then try again. Nothing is recorded or stored: '
        + 'the frame is checked on your own device and only the warnings are sent.',
      retry: () => startExam(slug, topicN) });
    return;
  }

  const written = d.questions.filter((q) => q.kind === 'written');
  const mcq = d.questions.filter((q) => q.kind === 'mcq');
  const total = d.questions.length;
  document.body.classList.add('sitting');
  view.innerHTML = `
    <div class="exambar">
      <div>
        <div class="exam-t">${topicN === 0 ? 'Final exam' : 'Topic ' + topicN + ' exam'}</div>
        <div class="exam-s"><span id="answered">0</span> of ${total} answered</div>
      </div>
      <div style="text-align:right;">
        <div class="timer" id="clock">--:--</div>
        <div class="exam-s">time remaining</div>
      </div>
      <div class="exam-p"><i id="pbar" style="width:0%"></i></div>
    </div>
    <div id="examMsg"></div>
    <div class="note" style="margin-top:16px;">Answer in your own words. Copying the question, pasting from
      elsewhere and leaving this tab are all recorded — the camera is on for the whole paper.</div>
    <h2 style="margin-top:20px;">Section 1 — explain in your own words</h2>
    ${written.map((q) => `<div class="q" data-q="${q.i}"><div class="qp">${q.i + 1}. ${esc(q.prompt)}</div>
      <textarea data-a="${q.i}" placeholder="Your answer"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea></div>`).join('')}
    <h2 style="margin-top:24px;">Section 2 — choose one</h2>
    ${mcq.map((q) => `<div class="q" data-q="${q.i}"><div class="qp">${q.i + 1}. ${esc(q.prompt)}</div>
      ${q.options.map((o, k) => `<label class="opt"><input type="radio" name="q${q.i}" value="${k}">
        <span>${esc(o)}</span></label>`).join('')}</div>`).join('')}
    <div class="submitbar">
      <span class="exam-s" id="leftnote"></span>
      <button class="pri" id="submit">Submit my paper</button>
    </div>`;

  /*
   * Client-side deterrents, and only that. The paper cannot be marked in the
   * browser — the answer key never leaves the server, the deadline is the
   * server's clock and the camera warnings are counted server-side — so this
   * layer only has to make the lazy routes inconvenient.
   *
   * ponytail: a determined learner with devtools gets past all of it. The
   * things that actually hold are already on the server; do not add more here
   * believing otherwise.
   */
  const paper = view;
  paper.querySelectorAll('.qp').forEach((el) => {
    el.addEventListener('copy', (e) => e.preventDefault());
    el.addEventListener('cut', (e) => e.preventDefault());
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  });
  paper.querySelectorAll('textarea[data-a]').forEach((ta) => {
    ta.addEventListener('paste', (e) => {
      e.preventDefault();
      $('examMsg').innerHTML = '<div class="note bad">Pasting is off in this exam — '
        + 'section one is marked on whether the explanation is yours.</div>';
      setTimeout(() => { const m = $('examMsg'); if (m) m.innerHTML = ''; }, 4000);
    });
    ta.addEventListener('drop', (e) => e.preventDefault());
  });

  /** How far through they are — and the bar that shows it. */
  function tally() {
    let n = 0;
    paper.querySelectorAll('textarea[data-a]').forEach((t) => { if (t.value.trim().length > 1) n++; });
    n += paper.querySelectorAll('input[type=radio]:checked').length;
    const a = $('answered'), b = $('pbar'), note = $('leftnote');
    if (a) a.textContent = String(n);
    if (b) b.style.width = Math.round(n / total * 100) + '%';
    if (note) note.textContent = n === total ? 'Every question answered.' : (total - n) + ' still blank';
    paper.querySelectorAll('[data-q]').forEach((box) => {
      const t = box.querySelector('textarea[data-a]');
      const done = t ? t.value.trim().length > 1 : !!box.querySelector('input:checked');
      box.classList.toggle('answered', done);
    });
    return n;
  }
  paper.addEventListener('input', tally);
  paper.addEventListener('change', tally);
  tally();

  const deadline = new Date(d.deadlineAt).getTime();
  const clock = setInterval(() => {
    const left = Math.max(0, deadline - Date.now());
    const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    const el = $('clock'); if (!el) { clearInterval(clock); return; }
    el.textContent = m + ':' + String(s).padStart(2, '0');
    if (left < 5 * 60000) el.classList.add('low');
    if (left === 0) { clearInterval(clock); submit(true); }
  }, 1000);

  async function submit(auto) {
    const btn = $('submit'); if (btn) btn.disabled = true;
    const answers = {};
    view.querySelectorAll('[data-a]').forEach((t) => { answers[t.dataset.a] = t.value; });
    view.querySelectorAll('input[type=radio]:checked').forEach((r) => {
      answers[r.name.slice(1)] = Number(r.value);
    });
    const r = await api('/exam/' + d.attemptId + '/submit', { method: 'POST', body: JSON.stringify({ answers }) });
    if (!r.ok) {
      if (btn) btn.disabled = false;
      $('examMsg').innerHTML = '<div class="note bad">' + esc(r.d.message || 'Could not submit.') + '</div>';
      return;
    }
    clearInterval(clock); stopProctor();
    document.body.classList.remove('sitting');
    showResult(slug, topicN, r.d, auto);
  }
  $('submit').onclick = () => {
    const n = tally();
    // Submitting nine of twenty by accident is a wasted attempt, and attempts
    // are what stand between a learner and their certificate.
    if (n < total && !confirm((total - n) + ' question' + (total - n === 1 ? ' is' : 's are')
        + ' still blank. Submit anyway?')) return;
    submit(false);
  };
}

function showResult(slug, topicN, r, auto) {
  view.innerHTML = `
    <h1>${r.passed ? 'Passed' : 'Not this time'}</h1>
    <div class="note ${r.passed ? 'good' : 'bad'}">
      Written ${r.writtenScore}/${r.writtenTotal} · Multiple choice ${r.mcqScore}/${r.mcqTotal}
      ${auto ? ' · submitted automatically when time ran out' : ''}</div>
    <p class="sub">${r.passed
      ? 'The next topic is open.'
      : 'Take it again when you are ready — you will get a completely new set of questions.'}</p>
    ${r.review.filter((q) => q.kind === 'written').map((q) => `<div class="q">
       <div class="qp">${esc(q.prompt)}</div>
       <div style="font-size:13.5px;color:var(--muted);line-height:1.6;">Your answer: ${esc(q.given || '(blank)')}</div>
       <div style="margin-top:9px;font-size:13px;font-weight:700;color:${q.correct ? 'var(--green)' : 'var(--red)'};">
         ${q.correct ? '✓ Accepted' : '✗ Not accepted'} — ${esc(q.feedback || '')}</div></div>`).join('')}
    <button class="pri" id="back" style="margin-top:18px;">← Back to the module</button>`;
  $('back').onclick = () => moduleScreen(slug);
}

/* ── boot ──────────────────────────────────────────────────────────────── */
async function boot() {
  const { ok, d } = await api('/me');
  if (!ok) { $('who').textContent = ''; $('signOut').classList.add('hidden'); authScreen('in'); return; }
  me = d;
  $('who').textContent = d.name;
  $('signOut').classList.remove('hidden');
  $('signOut').onclick = async () => { await api('/logout', { method: 'POST' }); me = null; boot(); };
  home();
}
window.addEventListener('beforeunload', stopProctor);
boot();
</script>
</body>
</html>
