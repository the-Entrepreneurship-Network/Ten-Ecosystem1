<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEN — register for the Academic Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/mobile.css">
<style>
:root{--bg:#05070e;--card:#0e1428;--gold:#D4AF37;--text:#F0EEE8;--muted:#9a9080;--dim:#4E4840;
  --green:#10b981;--red:#ef4444;--border:rgba(212,175,55,.15);--border-strong:rgba(212,175,55,.38);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;padding:34px 18px 70px;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(800px 420px at 50% -10%,rgba(212,175,55,.1),transparent 60%);}
.card{position:relative;width:100%;max-width:470px;background:var(--card);border:1px solid var(--border-strong);
  border-radius:22px;padding:32px;}
h1{font-family:'Outfit',sans-serif;font-size:24px;font-weight:900;letter-spacing:-.01em;}
.sub{color:var(--muted);font-size:13.5px;line-height:1.65;margin-top:9px;}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:14px 0 5px;}
input{width:100%;padding:12px 14px;border-radius:11px;min-height:46px;background:#0b1222;
  border:1px solid var(--border);color:var(--text);font-size:15px;font-family:inherit;}
input:focus{outline:none;border-color:var(--border-strong);}
button,.btn{font-family:inherit;font-weight:800;font-size:13.5px;border-radius:11px;cursor:pointer;
  padding:12px 18px;min-height:46px;border:1px solid transparent;transition:all .2s;text-decoration:none;
  display:block;width:100%;text-align:center;}
.pri{background:var(--gold);color:#05070e;}
.pri:hover{filter:brightness(1.08);}
.sec{background:transparent;border-color:var(--border-strong);color:#e2c766;}
.sec:hover{background:rgba(212,175,55,.09);}
.ghost{background:none;border:none;color:var(--muted);font-weight:600;min-height:auto;padding:8px 0 0;}
button:disabled{opacity:.45;cursor:not-allowed;}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
.note{padding:12px 15px;border-radius:11px;font-size:13px;line-height:1.55;margin-top:14px;
  background:rgba(212,175,55,.09);border:1px solid var(--border-strong);color:#e8d9a8;}
.note.bad{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:#fecaca;}
.note.good{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3);color:#a7f3d0;}
.plan{border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:12px;cursor:pointer;
  display:block;transition:border-color .2s;}
.plan:hover,.plan.on{border-color:var(--border-strong);}
.plan input{width:auto;min-height:auto;margin-right:9px;}
.plan .nm{font-weight:800;font-size:14.5px;}
.plan .pr{float:right;font-family:'Outfit',sans-serif;font-weight:800;color:var(--gold);}
.plan .ds{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55;}
.paybox{text-align:center;margin-top:16px;}
.qr{background:#fff;border-radius:13px;padding:10px;display:inline-block;}
.qr img{width:200px;height:200px;display:block;}
.upi{font-size:12.5px;color:var(--muted);margin-top:9px;}
.upi code{color:var(--gold);font-weight:700;}
.tiny{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.5;}
.stepdots{display:flex;gap:6px;margin-bottom:18px;}
.stepdots i{height:4px;flex:1;border-radius:2px;background:rgba(255,255,255,.09);}
.stepdots i.on{background:var(--gold);}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="card">
  <div class="stepdots" aria-hidden="true"><i id="d1" class="on"></i><i id="d2"></i><i id="d3"></i></div>
  <div id="view"></div>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const view = $('view');
const esc = (v) => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const money = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');
const DOMAIN = new URLSearchParams(location.search).get('domain') || '';
const api = async (path, body) => {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  let d = null; try { d = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, d: d || {} };
};
const dots = (n) => [1,2,3].forEach((k) => $('d'+k).classList.toggle('on', k <= n));

/* ── step 1: the fork ──────────────────────────────────────────────────── */
function fork() {
  dots(1);
  view.innerHTML = `
    <h1>Before we register you</h1>
    <p class="sub">Are you already registered in the TEN portal — as an intern or a student?</p>
    <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px;">
      <a class="btn pri" href="/student-login.html?next=%2Fstudio.html">
        Yes — sign me in to upgrade</a>
      <button class="sec" id="new">No — I'm new, register me</button>
    </div>
    <p class="tiny" style="margin-top:14px;">Signing in shows your existing details and an upgrade
      button — you pay only for what you add. New here? Registration takes two minutes.</p>`;
  $('new').onclick = signup;
}

/* ── step 2: the account ───────────────────────────────────────────────── */
function signup() {
  dots(2);
  view.innerHTML = `
    <h1>Create your account</h1>
    <p class="sub">${DOMAIN ? 'Registering for <b style="color:var(--gold)">' + esc(DOMAIN) + '</b>. '
      : ''}This is your Academic Portal login — keep the password safe.</p>
    <div id="msg"></div>
    <label for="nm">Your name</label><input id="nm" autocomplete="name">
    <label for="em">Email</label><input id="em" type="email" autocomplete="email">
    <label for="pw">Password <span style="color:var(--dim);font-weight:400;">(8+ characters)</span></label>
    <input id="pw" type="password" autocomplete="new-password">
    <button class="pri" id="go" style="margin-top:18px;">Create account →</button>
    <button class="ghost" id="back">← Back</button>`;
  $('back').onclick = fork;
  $('go').onclick = async () => {
    $('go').disabled = true;
    const { ok, d } = await api('/api/v2/learn/signup',
      { name: $('nm').value.trim(), email: $('em').value.trim(), password: $('pw').value });
    $('go').disabled = false;
    if (!ok) { $('msg').innerHTML = '<div class="note bad">' + esc(d.message || 'That did not work.') + '</div>'; return; }
    plans();
  };
}

/* ── step 3: pay ───────────────────────────────────────────────────────── */
let pricing = null;
async function plans() {
  dots(3);
  if (!pricing) {
    const { d } = await api('/api/v2/studio/pricing');
    pricing = (d && d.pricing) || null;
  }
  const course = pricing ? pricing.singles.find((s) => s.key === 'course') : { price: 300 };
  const combo = pricing ? pricing.combo : { price: 500, saving: 150 };
  view.innerHTML = `
    <h1>Choose how you start</h1>
    <p class="sub">Account created. Pick a plan — access opens the moment your payment is approved,
      and you get a mail the minute it is.</p>
    <div id="msg"></div>
    <label class="plan on"><input type="radio" name="p" value="course" data-mode="now" checked>
      <span class="nm">Course only — pay now</span><span class="pr">${money(course.price)}</span>
      <div class="ds">The full Academic Portal: every domain module, proctored exams, the certificate.</div></label>
    <label class="plan"><input type="radio" name="p" value="course" data-mode="after">
      <span class="nm">Course only — pay after completion</span><span class="pr">${money(course.deferredPrice || course.price)} later</span>
      <div class="ds">Start learning today, pay when you finish. Your certificate waits for the fee — nothing else does.
        Waiting costs ${money((course.deferredPrice || course.price) - course.price)} more, and HR reads your request first.</div></label>
    <label class="plan"><input type="radio" name="p" value="combo" data-mode="now">
      <span class="nm">Everything — course + resume + job</span><span class="pr">${money(combo.price)}</span>
      <div class="ds">The whole Studio, pay now only. Saves ${money(combo.saving)} against buying separately.</div></label>
    <button class="pri" id="go" style="margin-top:16px;">Continue →</button>
    <p class="tiny">Pay-after-completion exists for the course only — the Resume and Job portals are
      used up as you use them, so they are pay-first.</p>`;
  view.querySelectorAll('.plan input').forEach((r) => {
    r.onchange = () => view.querySelectorAll('.plan').forEach((pl) =>
      pl.classList.toggle('on', pl.contains(r) && r.checked));
  });
  $('go').onclick = async () => {
    const pick = view.querySelector('.plan input:checked');
    // "Pay after completion" never reaches a QR. It asks HR first, and asking
    // needs a reason, so that plan goes to the request screen instead.
    if (pick.dataset.mode === 'after') { deferAsk(pick.value); return; }
    $('go').disabled = true;
    const { ok, d } = await api('/api/v2/studio/choose',
      { product: pick.value, payMode: 'now' });
    $('go').disabled = false;
    if (!ok || !d.success) { $('msg').innerHTML = '<div class="note bad">' + esc(d.message || 'Could not start that.') + '</div>'; return; }
    // Somebody on a paid internship track already owns all of this. Sending
    // them to a QR was how this page came to say "Pay ₹0".
    if (d.alreadyOwned) { owned(d.message); return; }
    if (d.requested) { requested(d); return; }
    pay(d);
  };
}

/* ── step 3b: the pay-after request ────────────────────────────────────────
   No QR here by design. What HR needs is the reason, and what the student
   needs is one honest look at the cheaper option before they commit. */
function deferAsk(productKey) {
  const course = pricing ? pricing.singles.find((s) => s.key === productKey) : { price: 300, deferredPrice: 400 };
  const extra = (course.deferredPrice || course.price) - course.price;
  view.innerHTML = `
    <h1>Tell us why</h1>
    <p class="sub">You are asking to start now and pay ${money(course.deferredPrice || course.price)} when you
      finish. HR reads this and decides — your portal opens the moment they approve it.</p>
    <div class="note">Paying ${money(course.price)} right now is the better deal: it is
      ${money(extra)} cheaper, it opens straight away, and nobody has to approve anything.</div>
    <div id="msg"></div>
    <label for="why">Why can you not pay right now?</label>
    <textarea id="why" rows="4" placeholder="A line or two is enough — HR reads every one of these."
      style="width:100%;padding:12px 14px;border-radius:11px;background:#0b1222;border:1px solid var(--border);
             color:var(--text);font:inherit;font-size:14px;line-height:1.6;resize:vertical;"></textarea>
    <button class="pri" id="go" style="margin-top:16px;">Send my request →</button>
    <button class="ghost" id="paynow">Actually, I will pay ${money(course.price)} now</button>
    <button class="ghost" id="back">← Choose a different plan</button>`;
  $('back').onclick = plans;
  $('paynow').onclick = async () => {
    const { ok, d } = await api('/api/v2/studio/choose', { product: productKey, payMode: 'now' });
    if (!ok || !d.success) { $('msg').innerHTML = '<div class="note bad">' + esc(d.message || 'Could not start that.') + '</div>'; return; }
    if (d.alreadyOwned) { owned(d.message); return; }
    pay(d);
  };
  $('go').onclick = async () => {
    const reason = $('why').value.trim();
    if (reason.length < 15) {
      $('msg').innerHTML = '<div class="note bad">A line or two, please — HR needs something to go on.</div>'; return;
    }
    $('go').disabled = true;
    const { ok, d } = await api('/api/v2/studio/choose',
      { product: productKey, payMode: 'after', reason });
    $('go').disabled = false;
    if (!ok || !d.success) { $('msg').innerHTML = '<div class="note bad">' + esc(d.message || 'Could not send that.') + '</div>'; return; }
    if (d.alreadyOwned) { owned(d.message); return; }
    requested(d);
  };
}

function requested(d) {
  view.innerHTML = `
    <h1>Sent to HR</h1>
    <div class="note">Your request to pay ${money(d.amount)} after completion is with HR. They read these
      by hand — you will get an email with their decision, and the moment it is approved the Academic
      Portal is open in your account. Nothing opens before that.</div>
    <p class="tiny" style="margin-top:12px;">Changed your mind? Paying up front is cheaper and opens
      immediately — sign in and pick it from your portal.</p>`;
}

function owned(message) {
  view.innerHTML = `
    <h1>You already have this</h1>
    <div class="note good">${esc(message || 'Your internship track already includes all of this — there is nothing to buy.')}</div>
    <a class="btn pri" style="margin-top:16px;" href="/learn">Open the Academic Portal →</a>`;
}

function pay(order) {
  view.innerHTML = `
    <h1>Pay ${money(order.amount)}</h1>
    <p class="sub">${esc(order.name)} — scan with any UPI app, then enter the transaction id below.</p>
    <div class="paybox">
      <div class="qr"><img alt="UPI QR code for this payment"
        src="/api/upi-qr?amount=${encodeURIComponent(order.amount)}&note=${encodeURIComponent(order.name)}"></div>
      <div class="upi">UPI ID: <code>paytmqr5k0ods@ptys</code></div>
    </div>
    <label for="utr">Transaction / UTR number</label>
    <input id="utr" inputmode="latin" autocomplete="off" placeholder="e.g. 412345678901">
    <div class="tiny" id="msg">Find it in your UPI app under payment history.</div>
    <button class="pri" id="go" style="margin-top:16px;">I have paid — submit</button>
    <button class="ghost" id="back">← Choose a different plan</button>`;
  $('back').onclick = plans;
  $('go').onclick = async () => {
    const utr = $('utr').value.trim();
    if (!/^[A-Za-z0-9]{6,25}$/.test(utr)) {
      $('msg').textContent = 'That does not look like a transaction id — 6 to 25 letters and numbers.'; return;
    }
    $('go').disabled = true;
    const { ok, d } = await api('/api/v2/studio/submit-utr', { orderId: order.orderId, utr });
    $('go').disabled = false;
    if (!ok || !d.success) { $('msg').textContent = d.message || 'Could not submit that.'; return; }
    done();
  };
}

function done() {
  view.innerHTML = `
    <h1>Payment submitted</h1>
    <div class="note">Our team verifies UPI payments by hand — usually within a day. The moment yours is
      approved you will get a mail naming exactly what has been added to your portal, and your login
      will open it.</div>
    <a class="btn pri" style="margin-top:16px;" href="/learn">Go to the Academic Portal</a>
    <p class="tiny" style="margin-top:12px;">Sign in there with the email and password you just created.</p>`;
}

fork();
</script>
<!-- Two guards, on every page that shows or saves data:
     db-banner says so when there is no database behind the portal, which
     once ran for days looking normal while writing to a JSON file;
     build-guard reloads a page the server has been deployed under, which
     is how an old sentence came to be printed around a new number. -->
<script src="/js/db-banner.js" defer></script>
<script src="/js/build-guard.js" defer></script>
</body>
</html>
