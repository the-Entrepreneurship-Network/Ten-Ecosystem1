<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEN Resume Portal — The unrejectable resume</title>
    <meta name="description" content="The TEN Resume Portal — AI builds or tailors an ATS-friendly, unrejectable resume that gets you shortlisted first." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cinzel:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      The paygate lives in the source page, not the built one. A
      `vite build - -emptyOutDir` rewrites public/resume-portal/index.html
      from this file, so anything added to the output by hand is deleted on
      the next build — which is exactly how it vanished once already.
    -->
    <script src="/portal-paygate.js?v=5"
            data-portal="resume"
            data-title="Resume Builder Access"
            data-blurb="AI resume building and tailoring, ATS scoring and unlimited exports."
            data-continue="/resume-dashboard.html"></script>
  </body>
</html>
